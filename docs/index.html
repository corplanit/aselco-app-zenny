window.DOCS_DATA = {"architecture/mvc-conventions.md":"# MVC and Services conventions\n\n## Purpose\n\nLaravel in `aselcoph/` follows classic MVC plus a **Services** layer for business rules. Controllers stay thin: validate input, call a service, return Blade or JSON.\n\nThis convention exists because the same domain is exposed on two HTTP surfaces (Blade session UI and `/api/v1` JSON). Putting wallet, ticket, chat, announcement, and AI rules in Services prevents “fixed in web, broken on mobile” drift. Models stay focused on persistence and relationships; Jobs handle async work such as ticket AI analysis.\n\nMobile is intentionally **not** Laravel MVC: screens and API clients in `mobile/src/` call HTTP only. AI follows a fixed link pattern — controllers call `Services/Ai`, which may call `Services/Rag` and `OpenAiClient` — so keys, guards, and grounding stay server-side.\n\n## Deeper explanation\n\n- **Key concepts:** Thin controllers; fat-enough services; Eloquent models; Blade views for staff/customer web; config as feature flags; jobs for async; Access/Ai/Rag service folders as bounded contexts.\n- **Invariants:** Money, ticket state machine, and AI completion calls belong in Services; ledger/audit style tables are append-oriented (see AST docs); staff writes use `config/access.php` gates/middleware; mobile never imports PHP services.\n- **Common pitfalls:** Growing controllers with CIS/OpenAI/FCM calls; copying service logic into Livewire/Blade; checking only role names in views; adding mobile screens that assume undocumented response shapes; updating historical ledger rows instead of appending.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Backend developers | `aselcoph/app/{Http/Controllers,Services,Models}` |\n| Staff UI developers | `aselcoph/resources/views/` |\n| Mobile developers | `mobile/src/{pages,api,auth,realtime,notifications}` |\n\n## Layer map\n\n| Layer | Location | Responsibility |\n|-------|----------|----------------|\n| Routes | `aselcoph/routes/web.php`, `api.php` | URL → controller |\n| Controllers | `aselcoph/app/Http/Controllers/` | HTTP boundary |\n| Services | `aselcoph/app/Services/` | Domain logic, integrations |\n| Models | `aselcoph/app/Models/` | Eloquent + relationships |\n| Views | `aselcoph/resources/views/` | Blade UI (staff/customer) |\n| Config | `aselcoph/config/` | Feature flags and module settings |\n| Jobs | `aselcoph/app/Jobs/` | Async work (e.g. ticket AI analyze) |\n\n## Controller folders\n\n| Folder | Used for |\n|--------|----------|\n| `Http/Controllers/` | Staff Blade + shared domain controllers |\n| `Http/Controllers/Access/` | User / org / workspace web UI |\n| `Http/Controllers/Chats/` | Support chat + legacy monitor |\n| `Http/Controllers/Api/V1/` | Mobile + customer API |\n| `Http/Controllers/Api/Admin/` | Staff/admin JSON API |\n| `Http/Controllers/Auth/` | Google OAuth |\n\n## Services folders\n\n| Folder | Used for |\n|--------|----------|\n| `Services/` | AST, tickets, chat, announcements, notifications |\n| `Services/Ai/` | OpenAI client, assistant, ticket AI, guards |\n| `Services/Rag/` | Knowledge ingest, embeddings, retrieval, grounded answers |\n| `Services/Access/` | Permissions, user management, activity log |\n\n## Views layout\n\n| Path | Content |\n|------|---------|\n| `resources/views/pages/staff/{ast,tickets,knowledge,access,announcements}/` | Primary staff modules |\n| `resources/views/modules/chats/` | Support chat UI |\n| `resources/views/components/menu/` | Role side menus (`admin`, `agent`, `cms`, …) |\n| `resources/views/pages/customer/` | Customer web pages |\n| `resources/views/cms/` | Legacy CMS / blog |\n\n## Mobile counterpart (not MVC)\n\nMobile is **screen + API client**, not Laravel MVC:\n\n| Layer | Location |\n|-------|----------|\n| Screens | `mobile/src/pages/` |\n| API clients | `mobile/src/api/` |\n| Auth / membership state | `mobile/src/auth/`, `membership/`, `onboarding/` |\n| Realtime | `mobile/src/realtime/` |\n| Push | `mobile/src/notifications/` |\n\nMobile never imports Laravel services. It calls `/api/v1/*` via `mobile/src/api/client.ts`.\n\n## AI link pattern\n\n```mermaid\nflowchart LR\n  UI[Blade_or_Mobile] --> Ctrl[Controller]\n  Ctrl --> AiSvc[Services_Ai]\n  AiSvc --> Rag[Services_Rag]\n  AiSvc --> OpenAI[OpenAiClient]\n  Rag --> Chunks[(knowledge_chunks)]\n```\n\n- Customer chat → `CustomerAiController` → `AiAssistantService` → RAG + OpenAI  \n- Ticket AI → `TicketAdminWebController` / `AdminTicketAiController` → `TicketAiAnalyzer` / `TicketAiResponseAssistant`  \n- Knowledge admin → `KnowledgeAdminWebController` → `KnowledgeBaseService` / `DocumentProcessor`\n\n## Naming tips for new work\n\n- Prefer a **Service** for any money, ticket state, or AI call — do not put that in the controller.\n- Keep **append-only** money and audit tables (see AST docs); never update ledger rows.\n- Gate staff writes with permissions from `config/access.php`, not only role name checks in Blade.\n\n## Scenarios\n\n### Scenario A — Add a staff Blade write action\n\n- **Actor:** Backend developer\n- **Steps:**\n  1. Add/adjust route in `web.php` with permission middleware.\n  2. Keep controller thin: validate, call Service, return view/redirect.\n  3. Update menu under `resources/views/components/menu/` if needed.\n- **Expected result:** Same Service method is reusable from `Api/Admin` later; unauthorized users blocked before controller logic.\n- **Where in code:** Routes + `Http/Controllers/` + `Services/` + `config/access.php`.\n\n### Scenario B — Add a mobile-readable endpoint\n\n- **Actor:** Backend + mobile developers\n- **Steps:**\n  1. Add route under `api.php` `/api/v1`.\n  2. Implement `Http/Controllers/Api/V1/*` calling existing Service when domain overlaps.\n  3. Consume from `mobile/src/api/` via `client.ts` — no PHP imports.\n- **Expected result:** JSON contract documented; auth via Sanctum; no duplicated business rules in the app.\n- **Where in code:** `api.php`, `Api/V1`, `mobile/src/api/client.ts`.\n\n### Scenario C — Wire a new AI feature\n\n- **Actor:** Backend developer\n- **Steps:**\n  1. Place completion/guard logic under `Services/Ai/` (and RAG under `Services/Rag/` if grounded).\n  2. Call from Blade or API controller only.\n  3. Respect `config/ai.php` / throttles; persist via AI/ticket models as appropriate.\n- **Expected result:** Matches the AI link pattern diagram; no browser OpenAI key.\n- **Where in code:** pattern above; `OpenAiClient`, `AiAssistantService`, Rag services.\n\n## Developer discussion\n\n- Is new domain logic in a Service (or justified Job), not a fat controller or Blade script?\n- Web and API: one Service method, two controllers — or accidental divergence?\n- Permissions: new `config/access.php` codes + middleware, not only menu hiding?\n- Money/audit: append-only respected; no silent ledger updates?\n- AI/RAG: still follows Controller → Services/Ai → (Rag) → OpenAiClient without client-side keys?\n\n## Related modules\n\n- [System architecture overview](overview.md)\n- Web modules: [`docs/web/`](../web/)\n- AST deeper contract: [aselcoph/docs/ast-wallet-architecture.md](../../aselcoph/docs/ast-wallet-architecture.md)\n- Access deeper reference: [aselcoph/docs/user-management.md](../../aselcoph/docs/user-management.md)\n","architecture/overview.md":"# System architecture overview\n\n## Purpose\n\nASELCO Zenny is a monorepo: staff use the **Laravel Blade** portal; members use the **Ionic/Capacitor** mobile app. Both share the same domain logic through Laravel controllers and services. Mobile talks only to `/api/v1` with Sanctum bearer tokens.\n\nThe split exists so coop staff get dense operational UIs (tickets, wallet load, knowledge, access) while members get a mobile-first experience for membership, bills, AST pay, chat, and assistant. One backend avoids divergent business rules: wallet debit, ticket state, and RAG grounding are implemented once in Laravel services and reused by web session routes and JSON APIs.\n\nWeb requests enter through `web.php` with session auth and permission middleware; mobile enters through `api.php` with Sanctum PATs. External systems (OpenAI, FCM, Pusher, CIS) stay behind services so clients never hold provider secrets. Module activation is mostly routes + `config/access.php` + env flags — not a separate plugin runtime.\n\n## Deeper explanation\n\n- **Key concepts:** Monorepo (`aselcoph/` + `mobile/`); shared Controllers → Services → Models path; Sanctum for mobile; Jetstream/Fortify for staff/customer web; permission catalog and middleware as the staff authorization spine; optional queues/jobs for async AI work.\n- **Invariants:** Mobile never imports Laravel PHP; money/ticket/AI mutations belong in Services; staff writes gated by access codes/middleware; feature env flags (`AI_ENABLED`, `AST_*`, `ACCESS_*`) must be considered part of deploy config.\n- **Common pitfalls:** Duplicating domain rules in Ionic; calling OpenAI/FCM from the client; Blade-only `@if(role)` checks without matching route middleware; adding “temporary” APIs outside `/api/v1` that mobile then hard-depends on.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Members | Ionic app → `/api/v1` |\n| Staff | Browser → `web.php` Blade portal |\n| Integrations | Services → OpenAI, FCM, Pusher, CIS |\n\n## Context\n\n```mermaid\nflowchart LR\n  Member[Member_Mobile] -->|Bearer_Sanctum| ApiV1[\"/api/v1\"]\n  Staff[Staff_Browser] -->|Session_auth| WebRoutes[web.php]\n  ApiV1 --> Controllers\n  WebRoutes --> Controllers\n  Controllers --> Services\n  Services --> Models\n  Services --> AiRag[Ai_and_Rag]\n  Services --> External[OpenAI_FCM_Pusher_CIS]\n```\n\n## Apps\n\n| App | Stack | Entry |\n|-----|--------|-------|\n| Staff web | Laravel 12, Jetstream/Fortify, Blade, Livewire, Vite/Tailwind | `aselcoph/` |\n| Mobile | Ionic React 8, Capacitor 8, Vite | `mobile/` (`appId`: `com.aselco.ph`) |\n| API | Sanctum PATs under `/api/v1` | `aselcoph/routes/api.php` |\n\n## Request path (direct)\n\n```mermaid\nflowchart TD\n  Request[HTTP_request] --> Routes\n  Routes --> Middleware[auth_permissions_throttle]\n  Middleware --> Controller\n  Controller --> Service\n  Service --> Model[(Eloquent_DB)]\n  Service --> Jobs[Queues_optional]\n  Controller --> Response[Blade_or_JSON]\n```\n\n## How modules are activated\n\n| Mechanism | Where | Effect |\n|-----------|--------|--------|\n| Routes | `aselcoph/routes/web.php`, `api.php` | Exposes URLs |\n| Permissions | `aselcoph/config/access.php` | Gates menus and APIs |\n| Middleware | `can.load-wallet`, `can.manage-tickets`, `can.permission:*` | Protects write paths |\n| Side menus | `resources/views/components/menu/*` | Role-based nav |\n| Env flags | `AI_ENABLED`, `AST_*`, `ACCESS_*` | Feature toggles |\n\n## Shared feature map (web ↔ mobile)\n\n| Domain | Web | Mobile | API prefix |\n|--------|-----|--------|------------|\n| Auth | Jetstream / Google OAuth | Login / Register | `/auth` |\n| Membership | Account link / validation | Membership setup | `/membership` |\n| AST Wallet | `/ast/*` admin | Wallet + Pay tabs | `/customer/wallet`, `/wallet` |\n| Tickets | `/tickets/*` | Tickets + Complaints | `/customer/tickets` |\n| AI | Ticket AI + knowledge chat | Assistant | `/customer/ai`, `/admin/ai` |\n| Knowledge/RAG | `/knowledge/*` | (via AI answers) | `/admin/knowledge` |\n| Support chat | `/chats/support/*` | Support chat | `/customer/support-chat` |\n| Notifications | Announcements UI | Push register | `/notifications`, `/devices` |\n\n## Scenarios\n\n### Scenario A — Member pays a bill from mobile\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. Authenticate via `/api/v1/auth/*` (Sanctum).\n  2. Membership/dashboard APIs confirm linked accounts.\n  3. Pay via customer wallet API; staff may post CIS from web later.\n- **Expected result:** Debit and audit occur in Laravel wallet services; mobile only sees JSON success/error.\n- **Where in code:** `api.php` → customer wallet controllers → `AstWalletService`; web CIS queue under `/ast/*`.\n\n### Scenario B — Staff works a ticket with AI assist\n\n- **Actor:** Ticket staff\n- **Steps:**\n  1. Session login; open `/tickets/*` (permission middleware).\n  2. Progress ticket via `TicketService`.\n  3. Optionally analyze/suggest via Services/Ai; knowledge may ground customer AI separately.\n- **Expected result:** Ticket state and AI drafts persist server-side; OpenAI key never reaches the browser as a callable client secret.\n- **Where in code:** `web.php` ticket routes → `TicketAdminWebController` → `TicketService` / `Services/Ai/*`.\n\n### Scenario C — Enabling a feature in an environment\n\n- **Actor:** Deploy / admin engineer\n- **Steps:**\n  1. Confirm routes exist in `web.php` / `api.php`.\n  2. Set permission codes in `config/access.php` and menus under `components/menu/*`.\n  3. Toggle env flags (`AI_ENABLED`, `AST_*`, `ACCESS_*`) and middleware on write paths.\n- **Expected result:** Feature visible/callable only when route + permission + env align.\n- **Where in code:** activation table above; module docs under `docs/web/`.\n\n## Developer discussion\n\n- Does this change keep domain logic in Services shared by web and API, or only in one surface?\n- Are new staff writes protected by `config/access.php` codes and middleware, not only Blade menus?\n- Mobile: still Sanctum `/api/v1` only — no new ad-hoc endpoints without docs?\n- Secrets: OpenAI/FCM/Pusher/CIS credentials remain server-side?\n- What must not break: auth split (session vs PAT), wallet/ticket invariants, and the shared feature map contracts.\n\n## Related modules\n\n- [MVC conventions](mvc-conventions.md)\n- [aselcoph/docs/ast-wallet-architecture.md](../../aselcoph/docs/ast-wallet-architecture.md)\n- [aselcoph/docs/user-management.md](../../aselcoph/docs/user-management.md)\n- [aselcoph/docs/api/](../../aselcoph/docs/api/) (OpenAPI + Postman)\n- Web module docs under [`docs/web/`](../web/)\n","mobile/ai-assistant.md":"# Mobile — AI Assistant\n\n## Purpose\n\nCustomer AI chat with conversation history and escalate-to-ticket. All model calls happen on the Laravel server; mobile only sends messages over Sanctum — the device never holds OpenAI keys or RAG indexes.\n\n**Mobile UX:** `/assistant` chat UI: bootstrap → send/receive → optional escalate. History/conversation management via customer AI conversation endpoints.\n\n**Owning Laravel API:** `CustomerAiController` — bootstrap, chat, inquiry, escalate, conversations CRUD. Server uses `AiAssistantService`, RAG, and `OpenAiClient`. Knowledge corpus is managed on web ([Knowledge / RAG](../web/knowledge-rag.md)).\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/assistant` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Assistant[Assistant_tsx] --> AiApi[api_ai_ts]\n  AiApi --> CustAi[CustomerAiController]\n  CustAi --> Assist[AiAssistantService]\n  Assist --> Rag[Knowledge_RAG]\n  Assist --> OpenAI[OpenAiClient]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_Assistant] --> Boot[GET_bootstrap]\n  Boot --> Chat[User_sends_message]\n  Chat --> Post[POST_customer_ai_chat]\n  Post --> Reply[Render_reply]\n  Reply --> Escalate{User_or_system_escalate}\n  Escalate -->|yes| Esc[POST_escalate]\n  Esc --> Ticket[Ticket_created_or_linked]\n  Escalate -->|no| Chat\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Assistant.tsx` |\n| API | `api/ai.ts` |\n| Types | `AiBootstrap`, `AiCustomerReply`, conversation types |\n\n## Routes / API\n\nMobile: `/assistant`.\n\nBackend: `GET /customer/ai/bootstrap`; `POST /chat`, `/inquiry`, `/escalate`; `GET|DELETE /conversations[/{id}]`.  \n(`POST /customer/ai/search` exists on backend but is not wrapped in `api/ai.ts` yet.)\n\n## Backend link\n\n- Laravel: `Api/V1/CustomerAiController.php`, `Services/Ai/*`, `Services/Rag/*`\n- Web: [AI Assistant](../web/ai-assistant.md), [Knowledge / RAG](../web/knowledge-rag.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** On open, `GET bootstrap` seeds capabilities/disclaimers/conversation id. Chat posts user text; UI appends assistant replies. Escalate POSTs when the member (or policy) wants a human ticket. Conversation list/delete keeps local UI in sync with server history.\n\n**API client:** `api/ai.ts` is Sanctum-only; no streaming client assumed unless added later — treat replies as full response payloads. Search endpoint exists server-side but is unwired on mobile.\n\n**Offline / mock:** AI requires network and server AI config. No on-device LLM fallback. Show clear errors when AI is disabled or rate-limited rather than mock answers.\n\n**Membership gate impact:** Assistant is behind linked membership. Escalated tickets flow into [Tickets](tickets.md) / staff queues. Prefer Support Chat when the member wants a live human without AI.\n\n## Scenarios\n\n### Ask a billing FAQ\n\n- **Actor:** Linked member.\n- **Steps:** Open Assistant → bootstrap → send question → `POST /chat` → render reply (RAG-backed on server).\n- **Expected result:** Helpful answer + any citations/disclaimer from bootstrap policy; no ticket created.\n- **Files involved:** `Assistant.tsx`, `api/ai.ts`, `CustomerAiController`, RAG services.\n\n### Escalate to ticket\n\n- **Actor:** Member unsatisfied with AI answers.\n- **Steps:** Trigger escalate → `POST /escalate` → ticket created/linked → optionally navigate to ticket detail.\n- **Expected result:** Ticket appears in Tickets tab and staff web; conversation tied for context.\n- **Files involved:** `Assistant.tsx`, `api/ai.ts`, Tickets module, `TicketService`.\n\n### Resume prior conversation\n\n- **Actor:** Returning member.\n- **Steps:** Open Assistant → load conversations → select id → continue chat.\n- **Expected result:** History restored from server; new messages append to same conversation.\n- **Files involved:** `Assistant.tsx`, `api/ai.ts` (conversations GET).\n\n## Developer discussion\n\n1. Should mobile implement streaming tokens for perceived latency, or keep request/response?\n2. When is escalate offered automatically vs only on explicit user action?\n3. How do we surface “AI disabled / quota exceeded” distinctly from generic network errors?\n4. Wire `POST /customer/ai/search` or remove it from public API docs until used?\n5. What PII must never be echoed in AI replies, and how is that enforced server-side?\n\n## Related modules\n\n- [Tickets](tickets.md)\n- [Complaints](complaints.md)\n- [Support Chat](support-chat.md) — human alternative\n","mobile/ast-wallet.md":"# Mobile — AST Wallet\n\n## Purpose\n\nShows the member’s ASELCO Token (AST) balance and transaction history. Loading AST onto a wallet is staff-only on the web portal; mobile is **read balance/history** plus navigation into Pay (separate screen) to spend AST on bills.\n\n**Mobile UX:** `/wallet` summary + list; drill-down `/wallet/transactions/:id`. Home balance card teasers the same wallet summary.\n\n**Owning Laravel API:** Primary customer routes on `CustomerWalletController` (`GET /customer/wallet/balance`, `GET /customer/wallet/transactions`). Alternate `WalletController` routes (`GET /wallet`, `/wallet/transactions`) also exist — prefer the customer-prefixed client methods used by the app.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/wallet`, transaction detail `/wallet/transactions/:id` |\n| Home | Balance card teaser |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  WalletUI[WalletHome] --> WalletApi[api_wallet_ts]\n  WalletApi --> CustWallet[CustomerWalletController]\n  WalletApi --> AltWallet[WalletController]\n  CustWallet --> AstSvc[AstWalletService]\n  StaffWeb[Web_AST_admin] --> AstSvc\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_wallet] --> Bal[GET_customer_wallet_balance]\n  Bal --> Txns[GET_customer_wallet_transactions]\n  Txns --> List[Render_history]\n  List --> Detail[Open_transaction_detail]\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/WalletHome.tsx`, `WalletTransactionDetail.tsx` |\n| API | `api/wallet.ts` |\n| Local | `api/walletAttemptStorage.ts` (used heavily by Pay) |\n| Types | `WalletSummary`, `WalletTransaction`, … |\n\n## Routes / API\n\nMobile: `/wallet`, `/wallet/transactions/:id`.\n\nBackend (primary): `GET /customer/wallet/balance`, `GET /customer/wallet/transactions`.  \nAlso available: `GET /wallet`, `/wallet/transactions`.\n\n## Backend link\n\n- Laravel: `CustomerWalletController`, `WalletController`, `AstWalletService`\n- Web: [AST Wallet](../web/ast-wallet.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** Wallet screens are mostly presentational: fetch balance + paginated/list transactions via `api/wallet.ts`, then navigate to detail by id. No local “top-up” UI — members cannot mint AST on device.\n\n**API client:** Customer wallet endpoints under Sanctum. Shared `api/wallet.ts` also hosts Pay helpers (`payBillWithAst`) and idempotency headers; keep read paths free of write side effects. `walletAttemptStorage` is for Pay retries, not for faking balance offline.\n\n**Offline / mock:** Balance/history are online reads. Do not use `mockData` TokenWallet shapes as live truth on production builds. After Pay succeeds, Wallet and Home should refresh so history includes the new debit.\n\n**Membership gate impact:** Wallet routes sit behind the linked-account gate like other member features. Without membership, users never reach `/wallet`. Pay still needs a matching linked billing account even when AST balance is positive.\n\n## Scenarios\n\n### Check AST balance\n\n- **Actor:** Linked member.\n- **Steps:** Open `/wallet` → `GET .../balance` (+ transactions) → render summary and list.\n- **Expected result:** Balance matches staff/web AST ledger for that customer wallet.\n- **Files involved:** `WalletHome.tsx`, `api/wallet.ts`.\n\n### Inspect a transaction\n\n- **Actor:** Member reviewing a past pay or credit.\n- **Steps:** Tap row → `/wallet/transactions/:id` → show detail fields from list payload or follow-up fetch.\n- **Expected result:** Clear type/amount/timestamps; correlates with ledger/CIS where applicable.\n- **Files involved:** `WalletTransactionDetail.tsx`, `api/wallet.ts`.\n\n### After paying a bill\n\n- **Actor:** Member returning from Pay success.\n- **Steps:** Navigate to Wallet or Home → refetch balance/transactions.\n- **Expected result:** Debit visible; no reliance on `walletAttemptStorage` for display (that storage is attempt/idempotency only).\n- **Files involved:** `Pay.tsx`, `WalletHome.tsx`, `walletAttemptStorage.ts`, `api/wallet.ts`.\n\n## Developer discussion\n\n1. Which client path is canonical — `/customer/wallet/*` vs `/wallet/*` — and can we delete the unused one from `api/wallet.ts`?\n2. How should empty history and zero balance be explained so members know top-up is office/staff-driven?\n3. Do transaction detail routes need a dedicated GET-by-id if list pagination drops the item?\n4. Should Wallet subscribe to push events when staff loads AST?\n5. How do we keep Home’s AST teaser and WalletHome from racing with different cached values?\n\n## Related modules\n\n- [Pay with AST](pay-with-ast.md)\n- [Home](home-dashboard.md)\n- [Ledger](ledger.md)\n","mobile/auth.md":"# Mobile — Auth\n\n## Purpose\n\nRegister, login, logout, session restore, and email verification resend for the myASELCO app. This is the first Laravel-backed gate after local onboarding: without a valid Sanctum personal access token (PAT), no membership, dashboard, wallet, or ticket APIs can run.\n\n**Mobile UX:** Ionic pages for `/login` and `/register`; `AuthContext` owns boot-time restore so the user lands on tabs or membership setup without re-entering credentials when the token is still valid.\n\n**Owning Laravel API:** `AuthController` under `/api/v1/auth/*` (Sanctum). Tokens are stored in Capacitor Preferences via `tokenStorage` and attached by `api/client.ts` on every request.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| New users | `/register` |\n| Returning users | `/login` |\n| App boot | `AuthContext` restores token → `GET /auth/user` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  UI[Login_Register] --> AuthApi[api_auth_ts]\n  AuthApi --> Client[api_client_ts]\n  Client --> Laravel[AuthController_V1]\n  AuthCtx[AuthContext] --> TokenStore[tokenStorage]\n  AuthCtx --> AuthApi\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Boot[App_start] --> HasToken{Token_present}\n  HasToken -->|yes| Me[GET_auth_user]\n  Me -->|ok| Authed[Authenticated]\n  Me -->|fail| Login\n  HasToken -->|no| Login\n  Login --> Post[POST_auth_login]\n  Post --> Save[Save_token]\n  Save --> Authed\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `mobile/src/pages/Login.tsx`, `Register.tsx` |\n| State | `mobile/src/auth/AuthContext.tsx` |\n| API | `mobile/src/api/auth.ts`, `tokenStorage.ts`, `client.ts` |\n| Types | `mobile/src/api/types.ts` (`AuthUser`, payloads) |\n\n## Routes / API\n\nMobile routes: `/login`, `/register`.\n\nBackend (`/api/v1`): `POST /auth/register`, `/auth/login`, `/auth/logout`, `/auth/logout-all`, `GET /auth/user`, `POST /auth/email/resend`.\n\n## Permissions / feature flags\n\nRequires verified email for most membership/dashboard routes (`verified` middleware on API).\n\n## Backend link\n\n- Laravel: `aselcoph/app/Http/Controllers/Api/V1/AuthController.php`\n- Web counterpart: [Auth & Profile](../web/auth-profile.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** `AuthContext` hydrates from Preferences on boot, then calls `GET /auth/user`. Login/register pages call thin wrappers in `api/auth.ts`; success writes the token and updates context so `App.tsx` routing can leave the auth gate.\n\n**API client:** `client.ts` prefixes `VITE_API_BASE_URL`, sends `Authorization: Bearer …`, and surfaces Laravel validation / 401 errors to the UI. Logout clears the token and typically clears related local caches (e.g. ledger snapshot) so the next session cannot leak prior-account data.\n\n**Offline / mock:** Auth itself is online-only; there is no mock login path. A stale or revoked token fails `/auth/user` and forces the login screen.\n\n**Membership gate impact:** Authentication alone does not unlock main tabs. After a successful session, `MembershipContext` still requires at least one linked service account; otherwise the user is redirected to `/membership/setup`. Email verification on the API can block membership and dashboard calls even when the mobile session looks “logged in.”\n\n## Scenarios\n\n### New member registers\n\n- **Actor:** First-time customer installing myASELCO.\n- **Steps:** Complete onboarding → open Register → submit name/email/password → app stores PAT → routing continues to membership (or email-verify messaging if required).\n- **Expected result:** Sanctum token persisted; `AuthContext` reports authenticated; next gate is membership setup, not Home.\n- **Files involved:** `Register.tsx`, `api/auth.ts`, `tokenStorage.ts`, `AuthContext.tsx`, `App.tsx`.\n\n### Returning member cold start\n\n- **Actor:** Previously logged-in member reopening the app.\n- **Steps:** App boots → Preferences token found → `GET /auth/user` succeeds → membership status loads.\n- **Expected result:** No login form if token valid; user reaches tabs (if linked) or membership setup (if not).\n- **Files involved:** `AuthContext.tsx`, `tokenStorage.ts`, `api/auth.ts`, `MembershipContext.tsx`, `App.tsx`.\n\n### Sign out from Profile\n\n- **Actor:** Linked member choosing Sign out.\n- **Steps:** Profile triggers logout → `POST /auth/logout` → clear token (and local caches) → redirect to login.\n- **Expected result:** Subsequent API calls are unauthenticated; Home/Pay/Ledger are unreachable until login again.\n- **Files involved:** `Profile.tsx`, `AuthContext.tsx`, `api/auth.ts`, `ledgerStorage.ts` (cache clear).\n\n## Developer discussion\n\n1. What should happen when `/auth/user` returns 401 versus a network timeout — same UX, or a “retry / offline” path?\n2. Is email verification messaging complete enough on mobile, or do users get stuck after register with a silent `verified` middleware failure?\n3. Should `logout-all` be exposed in the Profile UI for shared-device security?\n4. How do we keep `AuthUser` types in `types.ts` aligned with Laravel’s `/auth/user` resource shape when staff fields change?\n5. On logout, which Preferences keys must always be cleared to avoid cross-account leakage (ledger, wallet attempts, onboarding)?\n\n## Related modules\n\n- [Onboarding](onboarding.md)\n- [Membership](membership.md)\n- [Profile](profile.md)\n","mobile/complaints.md":"# Mobile — Complaints (Create Ticket)\n\n## Purpose\n\nFile a new complaint/request with category and optional attachment. Creates a ticket on the shared tickets backend (categories currently use seed IDs 1–6 in the screen) so staff can triage in the web Tickets module.\n\n**Mobile UX:** Full-page `/complaints` form (category, subject, body, optional file) reachable from Home quick action; on success navigates toward ticket detail or the tickets list.\n\n**Owning Laravel API:** `CustomerTicketController` — `POST /customer/tickets`, `POST /customer/tickets/{id}/attachments`. Same `TicketService` as staff web.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/complaints` |\n| Home quick action | Complaints |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Form[Complaints_tsx] --> TicketsApi[api_tickets_ts]\n  TicketsApi --> Store[POST_customer_tickets]\n  TicketsApi --> Attach[POST_attachments]\n  Store --> TicketSvc[TicketService]\n  Staff[Staff_queue] --> TicketSvc\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_Complaints] --> Fill[Category_subject_body]\n  Fill --> File{Has_attachment}\n  File -->|optional| Multipart[Prepare_file]\n  Fill --> Create[POST_customer_tickets]\n  Create --> AttachStep{Attachment}\n  AttachStep -->|yes| Upload[POST_attachments]\n  AttachStep -->|no| Done[Navigate_to_ticket_or_list]\n  Upload --> Done\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Complaints.tsx` |\n| API | `api/tickets.ts` (`createCustomerTicket`, `uploadTicketAttachment`) |\n\n## Routes / API\n\nMobile: `/complaints`.\n\nBackend: `POST /customer/tickets`, `POST /customer/tickets/{id}/attachments`.\n\n## Backend link\n\n- Laravel: `CustomerTicketController`\n- Web: [Tickets](../web/tickets.md), legacy [Consumers](../web/consumers-billing.md) complaints UI\n\n## Deeper explanation\n\n**Screen / state pattern:** Controlled form in `Complaints.tsx`. Create ticket first, then upload attachment against the new id if a file was chosen — two-step so multipart failure does not block ticket creation (or define transactional UX if product requires attach-or-fail).\n\n**API client:** Shared `api/tickets.ts` with the Tickets inbox. Category IDs 1–6 are currently hard-coded seeds — they must stay aligned with Laravel ticket category seeds or move to a categories GET when available.\n\n**Offline / mock:** Submit is online-only. Do not queue fake tickets in Preferences without a sync story. Photo/file size limits should match backend validation.\n\n**Membership gate impact:** Route is behind linked membership. Created tickets immediately belong to the Sanctum user and show under Tickets after refresh.\n\n## Scenarios\n\n### File complaint without attachment\n\n- **Actor:** Linked member reporting an outage/issue.\n- **Steps:** Open Complaints → pick category → subject/body → POST create → navigate to list/detail.\n- **Expected result:** Ticket visible to member and in staff queue; category id accepted by API.\n- **Files involved:** `Complaints.tsx`, `api/tickets.ts`, `CustomerTicketController`.\n\n### File complaint with photo\n\n- **Actor:** Member attaching evidence.\n- **Steps:** Fill form + pick file → POST ticket → POST attachment multipart → done.\n- **Expected result:** Ticket has attachment metadata; staff can download on web; member sees success even if they remain on list.\n- **Files involved:** `Complaints.tsx`, `api/tickets.ts` (`uploadTicketAttachment`).\n\n### Validation failure\n\n- **Actor:** Member submitting empty subject or invalid category.\n- **Steps:** POST → 422 from Laravel → show field errors.\n- **Expected result:** No orphan navigation to detail; user can correct and resubmit.\n- **Files involved:** `Complaints.tsx`, `api/client.ts`, `api/tickets.ts`.\n\n## Developer discussion\n\n1. Should categories be fetched from an API instead of hard-coded IDs 1–6?\n2. If attachment upload fails after create, do we keep the ticket and prompt retry, or offer delete?\n3. Cap file types/sizes on client to match Laravel validation messages?\n4. Should create require selecting a linked service account number in the payload?\n5. How do we distinguish Complaints-origin vs AI-escalate tickets in the member list?\n\n## Related modules\n\n- [Tickets](tickets.md)\n- [Home](home-dashboard.md)\n- [Support Chat](support-chat.md)\n","mobile/home-dashboard.md":"# Mobile — Home / Dashboard\n\n## Purpose\n\nMain tab greeting with AST wallet summary, per-account balances (from dashboard/ledger cache), and quick actions to Pay, Ledger, Complaints, and Support. Home is the post-membership landing surface for day-to-day coop account awareness.\n\n**Mobile UX:** `/tabs/home` with header, balance/AST teasers, quick-action grid, and a “Recent Activity” area. Primary numbers should come from live dashboard APIs; some secondary lists may still be mock.\n\n**Owning Laravel API:** `DashboardController` — `GET /api/v1/dashboard/summary` (aggregates wallet + billing context for linked accounts). AST detail/pay still owned by customer wallet controllers.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/tabs/home` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Home[Home_tsx] --> DashApi[api_dashboard_ts]\n  Home --> Auth[AuthContext]\n  Home --> Memb[MembershipContext]\n  DashApi --> Laravel[DashboardController]\n  Home --> Quick[QuickActions]\n  Quick --> Pay\n  Quick --> Ledger\n  Quick --> Complaints\n  Quick --> Support\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_Home] --> Summary[GET_dashboard_summary]\n  Summary --> Render[Show_balances_and_AST]\n  Render --> Action[Tap_quick_action]\n  Action --> Navigate[Navigate_to_feature]\n```\n\nNote: “Recent Activity” may still read from `data/mockData.ts`.\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Home.tsx` |\n| Components | `components/BalanceCard.tsx`, `QuickActions.tsx`, `AppHeader.tsx` |\n| API | `api/dashboard.ts`, `ledgerStorage.ts` |\n| Types | `DashboardSummary`, `WalletSummary` |\n\n## Routes / API\n\nMobile: `/tabs/home`.\n\nBackend: `GET /api/v1/dashboard/summary`.\n\n## Backend link\n\n- Laravel: `Api/V1/DashboardController.php`\n- Web: [Dashboard](../web/dashboard.md), [AST Wallet](../web/ast-wallet.md), [Consumers / Billing](../web/consumers-billing.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** `Home.tsx` reads `AuthContext` (greeting) and `MembershipContext` (linked accounts), then loads `getDashboardSummary`. It may also peek at `ledgerStorage` cached snapshots for snappier per-account balance display before/alongside the network response. Quick actions are navigation-only; they do not mutate server state.\n\n**API client:** `api/dashboard.ts` → Sanctum `GET /dashboard/summary`. Wallet balance on the card should stay consistent with `/customer/wallet/*` used on Wallet/Pay; treat summary as a composite read model, not a second source of truth for payments.\n\n**Offline / mock:** “Recent Activity” (and some type imports from `mockData.ts`) may still be seed data — do not treat that list as live ledger. Cached ledger snapshots can show stale balances when offline; prefer empty/error states over inventing numbers when both network and cache miss.\n\n**Membership gate impact:** Unlinked users never see Home; `App.tsx` redirects to `/membership/setup`. Multi-account members rely on membership state to know which accounts the summary covers.\n\n## Scenarios\n\n### Linked member opens Home\n\n- **Actor:** Member with at least one linked account.\n- **Steps:** Land on `/tabs/home` after auth+membership → fetch dashboard summary → render balances/AST → optional cache merge.\n- **Expected result:** Greeting + live summary fields; quick actions navigate to Pay/Ledger/Complaints/Support.\n- **Files involved:** `Home.tsx`, `api/dashboard.ts`, `BalanceCard.tsx`, `QuickActions.tsx`, `MembershipContext.tsx`.\n\n### Quick action to Pay\n\n- **Actor:** Member paying the current bill.\n- **Steps:** Tap Pay on Home → navigate to `/tabs/pay` → Pay screen loads bill context from dashboard/wallet APIs.\n- **Expected result:** Pay receives enough context to show amount/account; no duplicate payment from Home itself.\n- **Files involved:** `QuickActions.tsx`, `Pay.tsx`, `api/dashboard.ts`, `api/wallet.ts`.\n\n### Offline with ledger cache\n\n- **Actor:** Member with poor connectivity who previously loaded ledger.\n- **Steps:** Open Home → dashboard request fails or is slow → UI may fall back to cached ledger-derived figures where implemented.\n- **Expected result:** Stale-but-labeled or partial UI; Recent Activity must not be mistaken for live API if still mocked.\n- **Files involved:** `Home.tsx`, `ledgerStorage.ts`, `data/mockData.ts`.\n\n## Developer discussion\n\n1. Which Home fields are guaranteed live vs still mock — can we label or remove mock sections before release?\n2. Should dashboard summary and wallet balance share one refresh hook to avoid mismatched AST amounts?\n3. How do we present multi-account summaries without overcrowding the first viewport?\n4. What empty state do we show when summary succeeds but all balances are zero?\n5. Is pull-to-refresh required on Home for field ops with flaky networks?\n\n## Related modules\n\n- [AST Wallet](ast-wallet.md)\n- [Pay with AST](pay-with-ast.md)\n- [Ledger](ledger.md)\n- [Membership](membership.md)\n","mobile/ledger.md":"# Mobile — Ledger\n\n## Purpose\n\nShows bills and payments for a linked account number, with an offline snapshot cache for faster reloads. Ledger is the member-facing history of billing activity that staff upload/manage on the web consumers/billing pipeline.\n\n**Mobile UX:** `/tabs/ledger` with account picker (from membership), filters/sort/pagination, and entry list. Snapshots in Preferences/local storage speed repeat visits.\n\n**Owning Laravel API:** `LedgerController` — `GET /api/v1/ledger` with `account_number`, paging, type, sort, and snapshot query params.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/tabs/ledger` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  LedgerUI[Ledger_tsx] --> LedgerApi[api_ledger_ts]\n  LedgerApi --> Laravel[LedgerController]\n  LedgerUI --> Cache[ledgerStorage]\n  Laravel --> BillingData[(billing_account_data)]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_Ledger] --> PickAcct[Select_account_number]\n  PickAcct --> Fetch[GET_ledger]\n  Fetch --> Cache[Save_snapshot]\n  Cache --> Render[Render_entries]\n  Render --> Filter[Optional_type_sort_page]\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Ledger.tsx` |\n| API | `api/ledger.ts`, `ledgerStorage.ts` |\n| Types | `LedgerResponse`, `LedgerEntry`, … |\n\n## Routes / API\n\nMobile: `/tabs/ledger`.\n\nBackend: `GET /api/v1/ledger?account_number=&page=&type=&sort=&snapshot=`.\n\n## Backend link\n\n- Laravel: `Api/V1/LedgerController.php`\n- Web: [Consumers / Billing](../web/consumers-billing.md) (upload pipeline feeds ledger)\n\n## Deeper explanation\n\n**Screen / state pattern:** `Ledger.tsx` takes the active/selected account from `MembershipContext`, calls `api/ledger.ts`, then writes a snapshot via `ledgerStorage` for Home and offline use. Filters (type/sort/page) re-query the API rather than inventing client-side truth for large histories.\n\n**API client:** Query-string driven GET; Sanctum auth required. Snapshot parameter supports server-assisted cache semantics where implemented — keep client snapshot keys namespaced per account (and cleared on logout).\n\n**Offline / mock:** `ledgerStorage` enables stale reads when the network fails. Fallback imports from `mockData.ts` may still exist for empty/dev states — production UX should prefer cache or explicit error over silent mock bills. Auth logout clears ledger cache to prevent account bleed.\n\n**Membership gate impact:** No linked account ⇒ no Ledger tab access (redirect to setup). Account picker only lists membership-linked numbers; pay/bill amounts shown here should match what Pay uses from dashboard/billing ids.\n\n## Scenarios\n\n### View current account history\n\n- **Actor:** Linked member.\n- **Steps:** Open Ledger → select account → `GET /ledger` → render entries → save snapshot.\n- **Expected result:** Bills/payments list matches backend for that account; subsequent open can show snapshot quickly.\n- **Files involved:** `Ledger.tsx`, `api/ledger.ts`, `ledgerStorage.ts`, `MembershipContext.tsx`.\n\n### Filter by type / paginate\n\n- **Actor:** Member looking for payments only.\n- **Steps:** Change type/sort or page → new GET with query params → list updates.\n- **Expected result:** Server-filtered page; local snapshot policy decided (overwrite full vs keep last unfiltered).\n- **Files involved:** `Ledger.tsx`, `api/ledger.ts`.\n\n### Offline reopen after prior fetch\n\n- **Actor:** Member without connectivity.\n- **Steps:** Open Ledger → network fails → load last snapshot for account if present.\n- **Expected result:** Stale indicator or equivalent; no fabricated mock ledger presented as live if avoidable.\n- **Files involved:** `Ledger.tsx`, `ledgerStorage.ts`, optionally `mockData.ts`.\n\n## Developer discussion\n\n1. When should snapshot overwrite happen — every successful fetch, or only when unfiltered?\n2. How do we signal “stale cache” vs “live” in the UI without clutter?\n3. Are billing ids on ledger entries sufficient for Pay deep-links, or must Pay always re-fetch dashboard summary?\n4. Multi-account: should we prefetch snapshots for all linked accounts on membership ready?\n5. Confirm logout always clears `ledgerStorage` for every account key.\n\n## Related modules\n\n- [Home](home-dashboard.md)\n- [Pay with AST](pay-with-ast.md)\n- [Membership](membership.md)\n","mobile/membership.md":"# Mobile — Membership / Account Linking\n\n## Purpose\n\nBlocks main tabs until the member links at least one electric service account **and** submits membership personal information. Shows privacy copy, account-link requests, and the personal-information step from the ASELCO membership application (address via PSGC, remaining fields as free text).\n\n**Mobile UX:** Forced full-screen `/membership/setup` (not a tab): privacy → account number → preview/submit → personal information → done. Profile can add more links later (`?add=1`) and skips personal info. Until `MembershipContext` reports a linked account **and** saved personal info, `App.tsx` redirects tab and feature routes back to setup.\n\n**Owning Laravel API:** `MembershipController` — `GET /membership/status`, privacy, account-links, `GET|PUT /membership/profile`, linked-accounts. Staff validation / approval of links happens on the web consumers/billing side.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Authenticated members without links or personal info | `/membership/setup` (forced gate) |\n| Profile | Linked accounts list / add link |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Setup[MembershipSetup] --> MembCtx[MembershipContext]\n  MembCtx --> MembApi[api_membership_ts]\n  Setup --> Psgc[PSGC_API]\n  MembApi --> Laravel[MembershipController]\n  Laravel --> Links[(account_links)]\n  Laravel --> Profiles[(member_profiles)]\n  StaffWeb[Web_validation] --> Links\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Authed[User_authenticated] --> Status[GET_membership_status]\n  Status --> Ready{Has_link_and_personal_info}\n  Ready -->|no| Setup[MembershipSetup_screen]\n  Setup --> Privacy[GET_privacy]\n  Privacy --> Submit[POST_account_links]\n  Submit --> Personal[PUT_membership_profile]\n  Personal --> Status\n  Ready -->|yes| Tabs[MainTabs]\n```\n\nAddress (region → province → municipality/city → barangay) is loaded from the [PSGC API](https://psgc.gitlab.io/api/). Street and sitio are typed in because they are not in PSGC. Membership O.R.#, area manager, and date issued are staff-only and are not collected on mobile. Date of seminar is optional.\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/membership/MembershipSetup.tsx`, `PersonalInformationForm.tsx`; Profile linked-accounts UI |\n| State | `membership/MembershipContext.tsx` |\n| API | `api/membership.ts`, `api/psgc.ts` |\n| Utils | `utils/serviceAccount.ts` |\n| Types | `types.ts` (`MembershipStatus`, `AccountLink`, `MemberProfile`, …) |\n\n## Routes / API\n\nMobile: `/membership/setup`.\n\nBackend: `GET /membership/status`, `/privacy`, `GET|POST /membership/account-links`, `GET|PUT /membership/profile`, `GET /membership/linked-accounts`.\n\n## Backend link\n\n- Laravel: `Api/V1/MembershipController.php`, `Services/MemberProfileService.php`, `Models/MemberProfile.php`\n- Web: [Consumers / Billing](../web/consumers-billing.md) (validation, staff linking)\n\n## Deeper explanation\n\n**Screen / state pattern:** After auth, `MembershipContext` fetches status, linked accounts, and member profile, then exposes helpers used by `App.tsx` redirects and by Home/Ledger/Pay for the active account number. `MembershipSetup` loads privacy text, validates the service account format, POSTs a link request, then collects personal information. Geographic selects call PSGC directly; if that API is down, the same fields become free text.\n\n**API client:** Thin `api/membership.ts` wrappers over Sanctum-authenticated `/api/v1` membership routes. Status includes `has_personal_info`; the stepper stays required until both an account link and a profile exist. Pending vs approved link states should still be reflected so the UI does not pretend staff validation is done.\n\n**Offline / mock:** No meaningful offline linking or PSGC lookup — submit requires network. Do not confuse “authenticated” with “membership ready”; both contexts must succeed.\n\n**Membership gate impact:** This **is** the gate. Home, Ledger, Pay, Tickets, Wallet, Assistant, Support, and related deep links redirect to `/membership/setup` until at least one account is linked **and** personal information is saved (see `App.tsx` comments/routes). Profile remains the place to manage additional links (`?add=1` style flows).\n\n## Scenarios\n\n### First link after register\n\n- **Actor:** Newly registered, verified member with zero links.\n- **Steps:** Login succeeds → status shows no links → MembershipSetup → accept privacy → enter account number → POST account-links → fill personal information (PSGC address + civil status, sex, contact #) → PUT profile → refresh status.\n- **Expected result:** When Laravel reports a usable linked account and `has_personal_info`, redirects lift and MainTabs open.\n- **Files involved:** `MembershipSetup.tsx`, `PersonalInformationForm.tsx`, `MembershipContext.tsx`, `api/membership.ts`, `api/psgc.ts`, `App.tsx`.\n\n### Staff still validating the link\n\n- **Actor:** Member who submitted a number that needs web-side confirmation.\n- **Steps:** POST succeeds → personal info saved → status still not staff-validated → UI can open the dashboard; link remains pending.\n- **Expected result:** Tabs unlock after personal info + first submission; staff completes validation on web consumers/billing.\n- **Files involved:** `MembershipContext.tsx`, `MembershipSetup.tsx`, web [Consumers / Billing](../web/consumers-billing.md).\n\n### Add another account from Profile\n\n- **Actor:** Linked member adding a second service account.\n- **Steps:** Profile → add link → setup/add flow → POST → linked list refreshes. Personal information is not asked again.\n- **Expected result:** New account appears in membership/linked-accounts; Ledger/Pay account pickers can include it.\n- **Files involved:** `Profile.tsx`, `MembershipSetup.tsx`, `MembershipContext.tsx`, `api/membership.ts`.\n\n## Developer discussion\n\n1. How should the app distinguish “no links,” “pending approval,” and “rejected” in setup UX?\n2. Is account-number validation on mobile (`serviceAccount.ts`) aligned with Laravel rules to avoid false accepts?\n3. After unlink/removal on web, how quickly should mobile refresh status — pull-to-refresh, focus effect, or push?\n4. Should `/membership/setup` be dismissible when the user already has one valid link (add-only mode)?\n5. What error copy do we show when privacy fetch fails but linking is still required?\n6. If PSGC is down, is free-text address enough for staff matching, or should we retry later?\n\n## Related modules\n\n- [Auth](auth.md)\n- [Home](home-dashboard.md)\n- [Profile](profile.md)\n- [Ledger](ledger.md)\n","mobile/notifications.md":"# Mobile — Notifications & Push\n\n## Purpose\n\nRegisters the device for FCM/APNs push on app boot and deep-links into tickets/chat/ledger/notifications. The Notifications **list screen** still uses seed mock data; live `GET /notifications` exists on the backend but is not wired into that UI yet.\n\n**Mobile UX:** Silent registration via `PushNotificationRegistration` in `App.tsx`; inbox at `/notifications` (partial mock); taps route into feature screens. Profile may show preference toggles (also partially unwired).\n\n**Owning Laravel API:** `DeviceTokenController` (`POST|DELETE /devices` / device-tokens); `NotificationController` (`GET /notifications`, mark read); `NotificationPreferenceController` (`GET|PUT /notification-preferences`). Staff broadcast via announcements / `FcmPushService` on web.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| All authenticated sessions | `PushNotificationRegistration` in `App.tsx` |\n| Members | `/notifications` (inbox UI — partial mock) |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Boot[App_boot] --> PushInit[pushNotifications_ts]\n  PushInit --> Devices[POST_devices]\n  Devices --> Tokens[(device_tokens)]\n  Staff[AnnouncementPublisher] --> Fcm[FcmPushService]\n  Fcm --> Tokens\n  PushInit --> DeepLink[Navigate_to_feature]\n  InboxUI[Notifications_tsx] --> Mock[mockData_today]\n```\n\n## Process flowchart — register\n\n```mermaid\nflowchart TD\n  Auth[User_authenticated] --> Perm[Request_push_permission]\n  Perm --> Token[Get_device_token]\n  Token --> Reg[POST_api_v1_devices]\n  Reg --> Listen[Listen_notification_tap]\n  Listen --> Route[Deep_link_route]\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| Logic | `notifications/pushNotifications.ts` |\n| API | `api/notifications.ts` |\n| UI | `pages/Notifications.tsx` |\n| Boot | `App.tsx` (`PushNotificationRegistration`) |\n| Partial mock | `data/mockData.ts` |\n\n## Routes / API\n\nMobile: `/notifications`.\n\nBackend: `POST|DELETE /devices` (and `/device-tokens`); `GET /notifications`; mark read; `GET|PUT /notification-preferences`.\n\n## Backend link\n\n- Laravel: `DeviceTokenController`, `NotificationController`, `NotificationPreferenceController`\n- Web: [Announcements](../web/announcements.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** Registration is side-effectful on auth: permission → platform token → `POST /devices`. Tap handlers map payload types to Ionic routes (ticket, chat, ledger, inbox). The inbox page currently renders `mockData` seeds — treat as placeholder until wired to `GET /notifications`.\n\n**API client:** `api/notifications.ts` should already expose device + inbox + preferences helpers; UI adoption is the gap. Unregister/delete device token on logout to avoid notifying the wrong user on shared devices.\n\n**Offline / mock:** Push registration needs network once; inbox mock works offline but is not trustworthy. Deep links must wait for auth + membership hydration before navigating into gated tabs.\n\n**Membership gate impact:** Device registration can run when authenticated; opening deep-linked member features still hits the membership gate. Prefer queuing the intended route until `MembershipContext` is ready.\n\n## Scenarios\n\n### Register device after login\n\n- **Actor:** Newly authenticated member granting notification permission.\n- **Steps:** Auth succeeds → `PushNotificationRegistration` → permission → token → `POST /devices`.\n- **Expected result:** Token stored server-side; future announcements/ticket pushes can deliver.\n- **Files involved:** `App.tsx`, `pushNotifications.ts`, `api/notifications.ts`, `DeviceTokenController`.\n\n### Tap push to open ticket\n\n- **Actor:** Member receiving a ticket update push.\n- **Steps:** Tap notification → handler parses id → navigate `/tickets/:id` (after gates).\n- **Expected result:** Correct ticket detail; if unlinked/unauth, gate then continue or drop gracefully.\n- **Files involved:** `pushNotifications.ts`, `App.tsx`, `TicketDetail.tsx`, membership/auth contexts.\n\n### Open notifications inbox (current)\n\n- **Actor:** Member opening `/notifications`.\n- **Steps:** Navigate to inbox → UI reads seed `mockData` today.\n- **Expected result:** Placeholder list; developers should not treat items as live until `GET /notifications` is wired + mark-read works.\n- **Files involved:** `Notifications.tsx`, `data/mockData.ts`, (target) `api/notifications.ts`.\n\n## Developer discussion\n\n1. Priority: wire inbox to `GET /notifications` + mark-read before go-live?\n2. On logout, do we always `DELETE` the device token, and what if the call fails?\n3. How are deep-link routes queued until onboarding/auth/membership finish hydrating?\n4. Align Profile toggles with `/notification-preferences` categories used by FCM topics/announcements.\n5. How do we test APNs vs FCM in Capacitor without leaking production server keys into the mobile repo?\n\n## Related modules\n\n- [Profile](profile.md)\n- [Tickets](tickets.md)\n- [Support Chat](support-chat.md)\n- [Home](home-dashboard.md)\n","mobile/onboarding.md":"# Mobile — Onboarding\n\n## Purpose\n\nFirst-run splash, welcome, and walkthrough that introduce myASELCO before auth. Completion is a **local Preferences flag** — this module does not call Laravel.\n\n**Mobile UX:** Timed splash → branded welcome → swipeable walkthrough slides; haptics on key taps. Returning installs skip the walkthrough when the completion flag is set.\n\n**Owning Laravel API:** None. After local completion, routing hands off to [Auth](auth.md) (`/login` / `/register`) and then the membership gate.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| New installs | Splash → Welcome → Walkthrough |\n| Returning | Splash skips walkthrough if completed |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Splash[Splash] --> OnbCtx[OnboardingContext]\n  OnbCtx --> Storage[local_storage_flag]\n  Welcome[Welcome] --> Walkthrough\n  Walkthrough --> AuthGate[Login_or_Tabs]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Splash[Splash] --> Done{Onboarding_done}\n  Done -->|no| Welcome\n  Welcome --> Walkthrough\n  Walkthrough --> Mark[Set_completed_flag]\n  Mark --> Auth[Auth_gate]\n  Done -->|yes| Auth\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/onboarding/Splash.tsx`, `Welcome.tsx`, `Walkthrough.tsx` |\n| State | `onboarding/OnboardingContext.tsx`, `storage.ts`, `haptics.ts` |\n| Data | `data/walkthroughSlides.ts` |\n| API | None |\n\n## Routes / API\n\nRoutes: `/welcome`, `/walkthrough` (plus splash gate in `App.tsx`). No backend endpoints.\n\n## Backend link\n\nNone — local only. After completion, flow continues to [Auth](auth.md).\n\n## Deeper explanation\n\n**Screen / state pattern:** `OnboardingContext` hydrates `aselco_onboarding_complete` from storage, enforces a minimum splash duration, and exposes `needsOnboarding` / `completeOnboarding`. `App.tsx` uses that flag together with auth and membership to decide the first navigable route.\n\n**API client:** Not used. Slide copy lives in `data/walkthroughSlides.ts` so product can edit messaging without backend deploys.\n\n**Offline / mock:** Fully offline by design. Clearing app storage (or reinstall) resets onboarding even if the user still has a valid Sanctum token in Preferences — treat storage keys carefully during logout/debug.\n\n**Membership gate impact:** Onboarding never bypasses membership. Completing the walkthrough only unlocks the auth gate; linked accounts are still required before main tabs.\n\n**Auth interaction:** If the user is already authenticated when onboarding state loads, context may mark onboarding complete to avoid trapping a logged-in user in the walkthrough.\n\n## Scenarios\n\n### Fresh install walkthrough\n\n- **Actor:** New customer after installing from store.\n- **Steps:** Splash minimum time → Welcome CTA → Walkthrough slides → complete → flag saved → Login/Register.\n- **Expected result:** Walkthrough does not show again on next cold start; auth screens are reachable.\n- **Files involved:** `Splash.tsx`, `Welcome.tsx`, `Walkthrough.tsx`, `OnboardingContext.tsx`, `onboarding/storage.ts`, `App.tsx`.\n\n### Returning install skips walkthrough\n\n- **Actor:** User who finished onboarding previously.\n- **Steps:** Splash → completion flag true → auth check (login or restore session).\n- **Expected result:** No welcome/walkthrough; flow matches auth + membership gates only.\n- **Files involved:** `OnboardingContext.tsx`, `App.tsx`.\n\n### Storage cleared mid-session (debug / OS wipe)\n\n- **Actor:** Developer or user clearing app data.\n- **Steps:** Preferences wiped → app relaunch → onboarding flag missing.\n- **Expected result:** Walkthrough appears again even if Laravel user still exists; user must re-auth if token was cleared too.\n- **Files involved:** `onboarding/storage.ts`, `tokenStorage.ts`, `App.tsx`.\n\n## Developer discussion\n\n1. Should onboarding completion be tied to the Laravel user id so a reinstall on the same account can skip slides?\n2. Is the splash minimum duration still right for slow devices, or does it feel like artificial delay?\n3. How do we version walkthrough slides when marketing copy changes — force re-show once, or never?\n4. Should haptics be optional via a system accessibility setting?\n5. What is the intended order when both `needsOnboarding` and an existing token are true after a partial Preferences wipe?\n\n## Related modules\n\n- [Auth](auth.md)\n- [Membership](membership.md)\n","mobile/pay-with-ast.md":"# Mobile — Pay with AST\n\n## Purpose\n\nCenter tab to pay the current electric bill using AST for a matching linked account. Confirms with PIN UI, sends an Idempotency-Key, and handles AST-specific error codes so retries are safe and CIS settlement can proceed on the web side.\n\n**Mobile UX:** `/tabs/pay` loads bill context + AST balance, confirms via PIN, shows success/receipt or mapped AST errors. Home quick action deep-links here.\n\n**Owning Laravel API:** `CustomerWalletController::payBill` — `POST /api/v1/customer/wallet/pay-bill` with body `{ billing_id, amount, idempotency_key }` and `Idempotency-Key` header. Alternate `POST /wallet/pay` exists; mobile should stick to the customer pay-bill client used in `api/wallet.ts`. Downstream CIS queue is staff/web (`AstWalletService`).\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/tabs/pay` |\n| Home quick action | Navigates to Pay |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  PayUI[Pay_tsx] --> WalletApi[api_wallet_ts]\n  PayUI --> DashApi[api_dashboard_ts]\n  PayUI --> Attempt[walletAttemptStorage]\n  WalletApi --> PayBill[POST_customer_wallet_pay_bill]\n  PayBill --> AstSvc[AstWalletService]\n  AstSvc --> Cis[CIS_queue_on_web]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_Pay] --> Context[Load_bill_from_dashboard_summary]\n  Context --> Bal[Load_AST_balance]\n  Bal --> Confirm[PIN_confirm]\n  Confirm --> Key[Create_or_reuse_Idempotency_Key]\n  Key --> Post[POST_pay_bill]\n  Post --> Ok{Success}\n  Ok -->|yes| Done[Show_receipt_state]\n  Ok -->|no| Err[Show_AST_error_code]\n```\n\nCommon error codes: `AST_INSUFFICIENT_FUNDS`, `AST_BILL_ALREADY_PAID`, `AST_BILL_NOT_FOUND`, `AST_AMOUNT_MISMATCH`, `AST_IDEMPOTENCY_REQUIRED`.\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Pay.tsx` |\n| API | `api/wallet.ts` (`getCustomerWalletBalance`, `payBillWithAst`), `api/dashboard.ts` |\n| Local | `api/walletAttemptStorage.ts` |\n\n## Routes / API\n\nMobile: `/tabs/pay`.\n\nBackend: `POST /api/v1/customer/wallet/pay-bill` with body `{ billing_id, amount, idempotency_key }` and `Idempotency-Key` header.  \nAlternate: `POST /wallet/pay` (account_number + amount).\n\n## Backend link\n\n- Laravel: `CustomerWalletController::payBill`\n- Web CIS: [AST Wallet](../web/ast-wallet.md) (`/ast/cis-queue`)\n- Billing context: [Consumers / Billing](../web/consumers-billing.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** `Pay.tsx` composes dashboard summary (bill / billing_id / amount) with wallet balance. PIN is a client confirmation UX (not a separate Laravel PIN API unless added later). Before POST, the screen creates or reuses an idempotency key from `walletAttemptStorage` so retries after timeouts do not double-charge.\n\n**API client:** `payBillWithAst` sets both body `idempotency_key` and `Idempotency-Key` header. Map Laravel AST error codes to member-readable messages; clear pending attempt storage only on definitive success or terminal business errors (already paid, etc.).\n\n**Offline / mock:** Pay requires network. Do not mock a successful payment locally. Pending attempt persistence helps flaky networks but must never invent a receipt without server confirmation.\n\n**Membership gate impact:** Unlinked users cannot open Pay. The billing account in the payload must belong to the member’s linked accounts; mismatches surface as AST/bill errors. After success, Ledger/Home/Wallet should refresh.\n\n## Scenarios\n\n### Happy-path bill payment\n\n- **Actor:** Linked member with sufficient AST and an unpaid bill.\n- **Steps:** Open Pay → load summary + balance → enter PIN → POST pay-bill with new Idempotency-Key → success UI → clear pending attempt.\n- **Expected result:** AST debited; CIS queue item created on backend/web; receipt state shown.\n- **Files involved:** `Pay.tsx`, `api/wallet.ts`, `api/dashboard.ts`, `walletAttemptStorage.ts`.\n\n### Retry after uncertain network\n\n- **Actor:** Member whose first POST timed out client-side.\n- **Steps:** Reopen/retry Pay → detect pending key in `walletAttemptStorage` → reuse same Idempotency-Key → POST again.\n- **Expected result:** Server returns original success or consistent error; no double payment.\n- **Files involved:** `Pay.tsx`, `walletAttemptStorage.ts`, `api/wallet.ts`, Laravel payBill + AstWalletService.\n\n### Insufficient funds / already paid\n\n- **Actor:** Member with low AST or stale bill context.\n- **Steps:** Confirm → POST → API returns `AST_INSUFFICIENT_FUNDS` or `AST_BILL_ALREADY_PAID`.\n- **Expected result:** Clear error copy; no fake success; refresh summary so UI catches up.\n- **Files involved:** `Pay.tsx`, `api/wallet.ts`, `api/dashboard.ts`.\n\n## Developer discussion\n\n1. Is PIN only UX friction, or should it bind to a server-side verification step?\n2. Which AST error codes are terminal (clear attempt) vs retryable (keep key)?\n3. How do we keep `billing_id` + `amount` in sync if the bill changes between screen open and POST?\n4. Should Pay block when membership has multiple accounts until the user explicitly picks one?\n5. What telemetry do we need around idempotency reuse for support debugging?\n\n## Related modules\n\n- [AST Wallet](ast-wallet.md)\n- [Ledger](ledger.md)\n- [Home](home-dashboard.md)\n","mobile/profile.md":"# Mobile — Profile\n\n## Purpose\n\nShows member/service info, linked accounts, add-link affordances, local notification toggles UI, and sign out. Profile is the settings/account hub after membership is established — not a second auth screen.\n\n**Mobile UX:** `/tabs/profile` with identity summary, linked accounts list, navigation into membership add-link, preference toggles (partially local today), and logout.\n\n**Owning Laravel API:** Membership endpoints via `MembershipController` for linked accounts / add link; `AuthController` for `POST /auth/logout`. Notification preference `GET|PUT /notification-preferences` exists on backend but Profile toggles may not be fully wired yet. Staff see the same customers under web Access / Consumers.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/tabs/profile` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Profile[Profile_tsx] --> Auth[AuthContext]\n  Profile --> Memb[MembershipContext]\n  Memb --> MembApi[api_membership_ts]\n  Profile --> Logout[auth_logout]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_Profile] --> Load[Auth_user_plus_linked_accounts]\n  Load --> Actions{User_action}\n  Actions -->|add_link| Link[POST_account_links]\n  Actions -->|sign_out| Logout[POST_auth_logout]\n  Actions -->|toggles| Local[Local_UI_only_today]\n```\n\nNote: notification toggles are not fully wired to `GET|PUT /notification-preferences` yet.\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Profile.tsx` |\n| State | `auth/AuthContext.tsx`, `membership/MembershipContext.tsx` |\n| Utils | `utils/serviceAccount.ts` |\n| API | membership + auth logout |\n\n## Routes / API\n\nMobile: `/tabs/profile`.\n\nBackend: membership endpoints + `POST /auth/logout`. Preferences API exists but Profile may not call it yet.\n\n## Backend link\n\n- Laravel: `MembershipController`, `AuthController`\n- Web: [Access](../web/access-user-management.md) (staff view of customers), [Consumers / Billing](../web/consumers-billing.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** Profile composes `AuthContext` user fields with `MembershipContext` linked accounts. Add-link routes into membership setup (`?add=1`). Logout goes through auth context (token clear + cache clear). Some display fields may still lean on `mockData` member placeholders — prefer live `AuthUser` / membership payloads.\n\n**API client:** No dedicated `api/profile.ts`; reuse auth + membership modules. Wire notification preferences through `api/notifications.ts` when finishing the toggles.\n\n**Offline / mock:** Linked accounts need network to refresh; logout should work and clear local session even if logout POST fails (decide product policy). Preference toggles that only flip local state will not survive reinstall until API-backed.\n\n**Membership gate impact:** Profile tab is for linked members. Unlinked users live on MembershipSetup instead. Adding links from Profile still uses the same membership APIs as first-time setup.\n\n## Scenarios\n\n### View linked accounts\n\n- **Actor:** Linked member.\n- **Steps:** Open Profile → membership context supplies accounts → list renders.\n- **Expected result:** Account numbers match `/membership/linked-accounts`; no stale mock-only identities for account list.\n- **Files involved:** `Profile.tsx`, `MembershipContext.tsx`, `api/membership.ts`.\n\n### Add another service account\n\n- **Actor:** Multi-property member.\n- **Steps:** Tap add → `/membership/setup?add=1` → privacy + POST link → return/refresh Profile.\n- **Expected result:** New link pending or active per status; Ledger/Pay pickers update after ready.\n- **Files involved:** `Profile.tsx`, `MembershipSetup.tsx`, `MembershipContext.tsx`.\n\n### Sign out\n\n- **Actor:** Member finished on a shared device.\n- **Steps:** Sign out → `POST /auth/logout` → clear token/caches → login screen.\n- **Expected result:** No access to tabs; next user must authenticate; ledger/wallet attempt caches cleared.\n- **Files involved:** `Profile.tsx`, `AuthContext.tsx`, `api/auth.ts`, `ledgerStorage.ts`.\n\n## Developer discussion\n\n1. Which Profile fields still come from `mockData.member`, and can we delete that dependency?\n2. Finish wiring notification toggles to `/notification-preferences` — default values on first load?\n3. Should Profile expose email resend / change-password if Auth API supports it?\n4. How do we show pending vs approved account links clearly?\n5. Offline logout policy: clear local session immediately even when logout API fails?\n\n## Related modules\n\n- [Membership](membership.md)\n- [Auth](auth.md)\n- [Notifications](notifications.md)\n","mobile/README.md":"# Mobile modules (Ionic / Capacitor)\n\nCustomer app **myASELCO** lives in `mobile/`. All live data goes through `VITE_API_BASE_URL` → Laravel `/api/v1` with Sanctum bearer tokens (`mobile/src/api/client.ts`).\n\n## Active modules\n\n| Module | Doc | Routes / screens |\n|--------|-----|------------------|\n| Auth | [auth.md](auth.md) | `/login`, `/register` |\n| Onboarding | [onboarding.md](onboarding.md) | `/welcome`, `/walkthrough` |\n| Membership | [membership.md](membership.md) | `/membership/setup` |\n| Home / Dashboard | [home-dashboard.md](home-dashboard.md) | `/tabs/home` |\n| Ledger | [ledger.md](ledger.md) | `/tabs/ledger` |\n| AST Wallet | [ast-wallet.md](ast-wallet.md) | `/wallet` |\n| Pay with AST | [pay-with-ast.md](pay-with-ast.md) | `/tabs/pay` |\n| Tickets | [tickets.md](tickets.md) | `/tabs/tickets`, `/tickets/:id` |\n| Complaints (create ticket) | [complaints.md](complaints.md) | `/complaints` |\n| AI Assistant | [ai-assistant.md](ai-assistant.md) | `/assistant` |\n| Support Chat | [support-chat.md](support-chat.md) | `/support`, `/support/chat` |\n| Profile | [profile.md](profile.md) | `/tabs/profile` |\n| Notifications / Push | [notifications.md](notifications.md) | `/notifications` + device register |\n\n## Inactive (not documented in depth)\n\n- `Tab1.tsx`, `Tab2.tsx`, `Tab3.tsx` — Ionic starter stubs, not routed.\n\n## Partial mock UI (note in module docs)\n\n- Home “Recent Activity”, Notifications inbox list, Support FAQ/contact — still use `mobile/src/data/mockData.ts` in places while other APIs are live.\n\n## Gate flow\n\n```mermaid\nflowchart TD\n  Splash[Splash] --> Onboarding{First_run}\n  Onboarding -->|yes| Walkthrough\n  Onboarding -->|no| AuthCheck{Authenticated}\n  Walkthrough --> AuthCheck\n  AuthCheck -->|no| Login\n  AuthCheck -->|yes| Membership{Account_linked}\n  Membership -->|no| MembershipSetup\n  Membership -->|yes| Tabs[MainTabs]\n```\n","mobile/support-chat.md":"# Mobile — Support Hub & Live Chat\n\n## Purpose\n\nSupport hub (contact/FAQ) plus realtime human chat with staff via Pusher. Chat is API-backed; some hub contact/FAQ copy still comes from mock data. Use this when the member wants a live agent rather than AI or a formal complaint ticket.\n\n**Mobile UX:** `/support` hub → `/support/chat` conversation. Home quick action can jump to Support. Messages sync through REST + Pusher events; read receipts via POST read.\n\n**Owning Laravel API:** `SupportChatApiController` + `SupportChatService` — ensure session, get chat, messages GET/POST, read. Broadcast auth at `{origin}/broadcasting/auth`. Staff reply on web Support Chat.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/support`, `/support/chat` |\n| Home quick action | Support |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Hub[Support_tsx] --> ChatUI[SupportChat_tsx]\n  ChatUI --> ChatApi[api_chat_ts]\n  ChatUI --> Pusher[supportPusher]\n  ChatApi --> SupportApi[SupportChatApiController]\n  SupportApi --> ChatSvc[SupportChatService]\n  StaffWeb[SupportChatController] --> ChatSvc\n  Pusher --> Broadcast[broadcasting_auth]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_support_chat] --> Ensure[POST_ensure]\n  Ensure --> Load[GET_messages]\n  Load --> Subscribe[Subscribe_Pusher]\n  Subscribe --> Send[POST_message]\n  Send --> Broadcast[Realtime_update]\n  Broadcast --> Read[POST_read]\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Support.tsx`, `SupportChat.tsx` (+ CSS) |\n| API | `api/chat.ts` |\n| Realtime | `realtime/supportPusher.ts` |\n| Partial mock | `data/mockData.ts` (FAQ/contact on hub) |\n\n## Routes / API\n\nMobile: `/support`, `/support/chat`.\n\nBackend: `POST /customer/support-chat/ensure`; `GET /customer/support-chat`; `GET|POST .../messages`; `POST .../read`.  \nBroadcast: `{origin}/broadcasting/auth`.\n\n## Backend link\n\n- Laravel: `Api/V1/SupportChatApiController.php`, `SupportChatService`\n- Web: [Support Chat](../web/support-chat.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** Hub (`Support.tsx`) is mostly static/mock contact+FAQ today. Chat page ensures a support session, loads history, subscribes via `supportPusher.ts`, and posts messages. Read receipts fire as the member views agent messages.\n\n**API client:** `api/chat.ts` for REST; Pusher client uses Sanctum-authenticated broadcasting auth. Reconnect strategy matters when the app backgrounds on mobile OS.\n\n**Offline / mock:** FAQ/contact on the hub still use `mockData.ts` — replace with CMS/API when available. Live chat cannot work fully offline; show reconnect/disabled send when subscription fails. Do not mix mock FAQ answers into the chat transcript.\n\n**Membership gate impact:** Support routes require linked membership. Chat is complementary to AI and Tickets: escalate/complaint create tickets; chat is synchronous human messaging.\n\n## Scenarios\n\n### Start live chat\n\n- **Actor:** Linked member needing an agent.\n- **Steps:** Open Support → Chat → `POST ensure` → load messages → subscribe Pusher → send first message.\n- **Expected result:** Message persists via API and appears for staff on web; realtime echo on device.\n- **Files involved:** `SupportChat.tsx`, `api/chat.ts`, `supportPusher.ts`, `SupportChatApiController`.\n\n### Receive staff reply in realtime\n\n- **Actor:** Member waiting in chat.\n- **Steps:** Staff sends from web → broadcast → mobile listener appends → optional `POST read`.\n- **Expected result:** Reply appears without manual refresh; unread state clears after read.\n- **Files involved:** `supportPusher.ts`, `SupportChat.tsx`, web Support Chat, broadcasting auth.\n\n### Browse hub FAQ (mock)\n\n- **Actor:** Member checking hours/contact before chatting.\n- **Steps:** Open `/support` → read FAQ/contact from current mock sources.\n- **Expected result:** Informative hub; user understands chat is separate; mock content labeled or replaced before go-live if required.\n- **Files involved:** `Support.tsx`, `data/mockData.ts`.\n\n## Developer discussion\n\n1. When do we replace hub FAQ/contact mock with CMS or API content?\n2. What is the reconnect/backoff policy if Pusher drops on cellular handoff?\n3. Should ensure create a new thread daily or resume the same open chat indefinitely?\n4. How are after-hours messages queued for staff — member-visible expectations?\n5. Do push notifications duplicate Pusher events, and how do we dedupe in UI?\n\n## Related modules\n\n- [AI Assistant](ai-assistant.md)\n- [Tickets](tickets.md)\n- [Home](home-dashboard.md)\n","mobile/tickets.md":"# Mobile — Tickets\n\n## Purpose\n\nList the member’s tickets, open detail/timeline, and submit resolution feedback. Creation is a separate Complaints flow; this module is the inbox + detail experience over the shared tickets backend staff use on web.\n\n**Mobile UX:** `/tabs/tickets` list; `/tickets/:id` detail with status/timeline; feedback prompt when resolved. Push deep-links can open detail.\n\n**Owning Laravel API:** `CustomerTicketController` — `GET /customer/tickets`, `GET /customer/tickets/{id}`, `POST /customer/tickets/{id}/feedback`. Staff triage uses the web Tickets module / `TicketService`.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Linked members | `/tabs/tickets`, `/tickets/:id` |\n| Create flow | [Complaints](complaints.md) → `/complaints` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  List[Tickets_tsx] --> TicketsApi[api_tickets_ts]\n  Detail[TicketDetail] --> TicketsApi\n  TicketsApi --> CustTicket[CustomerTicketController]\n  CustTicket --> TicketSvc[TicketService]\n  StaffWeb[TicketAdminWeb] --> TicketSvc\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_Tickets_tab] --> List[GET_customer_tickets]\n  List --> Tap[Open_ticket_detail]\n  Tap --> Show[GET_customer_tickets_id]\n  Show --> Feedback{Resolved_ask_feedback}\n  Feedback -->|yes| Post[POST_feedback]\n```\n\n## File map\n\n| Layer | Path |\n|-------|------|\n| UI | `pages/Tickets.tsx`, `TicketDetail.tsx` |\n| API | `api/tickets.ts` |\n| Types | `CustomerTicketListItem`, `CustomerTicketDetail`, … |\n\n## Routes / API\n\nMobile: `/tabs/tickets`, `/tickets/:id`.\n\nBackend: `GET /customer/tickets`, `GET /customer/tickets/{id}`, `POST /customer/tickets/{id}/feedback`.\n\n## Backend link\n\n- Laravel: `Api/V1/CustomerTicketController.php`\n- Web: [Tickets](../web/tickets.md)\n\n## Deeper explanation\n\n**Screen / state pattern:** List page fetches customer tickets on enter/refresh; detail fetches by id for timeline/messages. Feedback is a POST when status allows. Types in `types.ts` should mirror customer ticket resources, not staff admin DTOs.\n\n**API client:** `api/tickets.ts` also serves Complaints (create/attachments). Keep list/detail/feedback here; avoid calling admin ticket routes from the mobile client.\n\n**Offline / mock:** Tickets are live API. Empty list is a valid state. Do not seed fake tickets in production UI. Deep links from push should tolerate 404 if the ticket was deleted.\n\n**Membership gate impact:** Tickets tab requires linked membership like other main tabs. AI escalate and Complaints create tickets that appear here after refresh.\n\n## Scenarios\n\n### Browse open tickets\n\n- **Actor:** Linked member with prior complaints.\n- **Steps:** Open Tickets tab → `GET /customer/tickets` → tap item → detail GET.\n- **Expected result:** Status/timeline match staff web ticket; member sees customer-safe fields only.\n- **Files involved:** `Tickets.tsx`, `TicketDetail.tsx`, `api/tickets.ts`.\n\n### Submit resolution feedback\n\n- **Actor:** Member whose ticket is resolved.\n- **Steps:** Open detail → feedback UI → `POST .../feedback`.\n- **Expected result:** Feedback stored; UI confirms; staff can see rating/comments on web.\n- **Files involved:** `TicketDetail.tsx`, `api/tickets.ts`, `CustomerTicketController`.\n\n### Arrive from push / notification\n\n- **Actor:** Member tapping a ticket push.\n- **Steps:** Deep link to `/tickets/:id` → membership/auth gates → detail load.\n- **Expected result:** Lands on correct ticket when session + membership ready; otherwise gate then continue.\n- **Files involved:** `pushNotifications.ts`, `App.tsx`, `TicketDetail.tsx`.\n\n## Developer discussion\n\n1. Should the list poll or rely on pull-to-refresh / push invalidation after staff updates?\n2. Are customer-visible timeline events filtered consistently with web privacy rules?\n3. What happens if feedback is submitted twice — idempotent or error?\n4. How do AI-escalated tickets appear differently (labels) from Complaints-created ones?\n5. Do we need optimistic UI when returning from Complaints create?\n\n## Related modules\n\n- [Complaints](complaints.md)\n- [AI Assistant](ai-assistant.md) — escalate may create tickets\n- [Notifications](notifications.md)\n","README.md":"# ASELCO Zenny — Module Documentation\n\n**Docs version:** `v1.0.2` (revised 2026-09-07 03:25:23)\n\nDeveloper docs for every **active** web and mobile feature. Each module page lists purpose, MVC/Services/AI
