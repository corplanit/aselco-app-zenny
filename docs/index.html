 replies from Blade inbox\n\n- **Actor:** Support staff with `chat.view`\n- **Steps:**\n  1. Open `/chats/support`, load inbox.\n  2. Open conversation, POST message.\n  3. Mark read; confirm unread-total drops.\n- **Expected result:** Reply stored and pushed to member; badge counts consistent.\n- **Where in code:** `SupportChatController`; views `modules/chats/support.blade.php`.\n\n### Scenario C — Monitor vs modern stack\n\n- **Actor:** Ops / supervisor using monitor\n- **Steps:**\n  1. Open `/chats/monitor` (legacy path).\n  2. Compare with modern support inbox for the same period.\n- **Expected result:** Monitor may use legacy models; do not assume feature parity with `SupportChatService`.\n- **Where in code:** `ConversationController`, legacy `Supp*` models/views under `supp_chat/*`.\n\n## Developer discussion\n\n- Is all new message logic in `SupportChatService`, shared by web and API controllers?\n- Ensure-conversation: what are the reuse rules, and did you add tests for double-ensure?\n- Realtime: persist-then-broadcast order; broadcasting auth still required?\n- Are you accidentally writing to `Supp*` tables from the mobile API?\n- Permissions: `chat.view` for UI vs `can.manage-tickets` for staff API — both still correct?\n\n## Related modules\n\n- [Mobile Support Chat](../mobile/support-chat.md)\n- [Tickets](tickets.md) — escalation from AI may create tickets; chat stays human\n- [AI Assistant](ai-assistant.md) — parallel channel\n- [Support Workspace](support-workspace.md)\n","web/support-workspace.md":"# Web — Support Workspace\n\n## Purpose\n\nAgent and supervisor working surface on top of tickets and notifications: my tickets, department queue, SLA view, and notification inbox. Requires `tickets.view` permission (`can.permission:tickets.view`).\n\nWorkspace is not a second ticket engine — it is a curated set of views over tickets, notifications, and access/assignment data so agents start from “what’s mine / what’s in my department” instead of the full admin queue every time. Detail work still deep-links into `TicketAdminWebController` flows.\n\nWeb routes live under `/workspace/*`. Agents also have API counterparts (`/api/v1/support/dashboard`, `/support/tickets`, `/support/notifications`) for non-Blade clients. Keep permission requirements aligned with Access and Tickets docs so a user who can open workspace can actually act on tickets they pick up.\n\n## Deeper explanation\n\n- **Key concepts:** Agent dashboard vs supervisor dashboard; my tickets vs department queue; SLA view as ops signal; notifications inbox as attention feed; availability/assignment data from Access.\n- **Invariants:** Middleware `can.permission:tickets.view` on workspace routes; mutating ticket state still goes through ticket controllers/services, not ad-hoc workspace writes; supervisor views may show wider queues but must still respect escalate/reassign permissions on actions.\n- **Common pitfalls:** Duplicating ticket lifecycle logic inside `SupportWorkspaceWebController`; showing tickets the agent cannot open; drifting Blade paths away from `pages/staff/access/*` support views; ignoring notification unread state that agents rely on.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Support agents | `/workspace/dashboard`, `/workspace/tickets` |\n| Supervisors | `/workspace/supervisor`, `/workspace/department-queue`, `/workspace/sla` |\n| All ticket viewers | `/workspace/notifications` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Agent[Agent_Browser] --> Workspace[SupportWorkspaceWebController]\n  Workspace --> Tickets[(tickets)]\n  Workspace --> Notifs[(notifications)]\n  Workspace --> AccessApi[Access_assignment_data]\n  Agent --> TicketDetail[TicketAdminWebController]\n```\n\n## Process flowchart — agent day\n\n```mermaid\nflowchart TD\n  Login[Agent_logs_in] --> Dash[Workspace_dashboard]\n  Dash --> MyTickets[Open_my_tickets]\n  MyTickets --> Work[Work_ticket_detail]\n  Work --> Queue{More_in_department_queue}\n  Queue -->|yes| Pick[Take_or_get_assigned]\n  Queue -->|no| Notif[Check_notifications]\n  Pick --> Work\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controller | `aselcoph/app/Http/Controllers/Access/SupportWorkspaceWebController.php` |\n| Models | Uses `Ticket`, notifications, user availability (via Access) |\n| Services | Relies on `TicketService`, `AccessService` / assignment helpers |\n| Views | `pages/staff/access/support-dashboard.blade.php` |\n| | `supervisor-dashboard.blade.php`, `ticket-dashboard.blade.php` |\n| | `ticket-list.blade.php`, `notifications.blade.php` (under access views) |\n| AI | Indirect — ticket AI from ticket detail |\n\n## Routes / API\n\n| Route | Name |\n|-------|------|\n| `GET /workspace/dashboard` | `workspace.dashboard` |\n| `GET /workspace/supervisor` | `workspace.supervisor` |\n| `GET /workspace/tickets` | `workspace.tickets` |\n| `GET /workspace/department-queue` | `workspace.department` |\n| `GET /workspace/sla` | `workspace.sla` |\n| `GET /workspace/notifications` | `workspace.notifications` |\n\nAPI counterpart: `/api/v1/support/dashboard`, `/support/tickets`, `/support/notifications`.\n\n## Permissions / feature flags\n\n- Middleware: `can.permission:tickets.view`\n- Related: `tickets.*`, `notifications.view`, availability settings in `config/access.php`\n\n## Scenarios\n\n### Scenario A — Agent works “my tickets”\n\n- **Actor:** Support agent with `tickets.view`\n- **Steps:**\n  1. Open `/workspace/dashboard` then `/workspace/tickets`.\n  2. Open a ticket (detail via ticket admin flow).\n  3. Progress/close per ticket permissions.\n- **Expected result:** List scoped to the agent’s assignments; detail actions still permission-checked.\n- **Where in code:** `SupportWorkspaceWebController`; views `support-dashboard.blade.php`, `ticket-list.blade.php`; `TicketService` on mutations.\n\n### Scenario B — Supervisor reviews department queue and SLA\n\n- **Actor:** Supervisor\n- **Steps:**\n  1. Open `/workspace/supervisor` and `/workspace/department-queue`.\n  2. Check `/workspace/sla` for at-risk items.\n  3. Reassign/escalate using ticket tools as needed.\n- **Expected result:** Wider queue visibility; actions still go through ticket permission codes.\n- **Where in code:** Supervisor/department/SLA routes; Access assignment helpers; ticket reassign/escalate.\n\n### Scenario C — Notification inbox triage\n\n- **Actor:** Any ticket viewer\n- **Steps:**\n  1. Open `/workspace/notifications`.\n  2. Follow through to the related ticket or item.\n  3. Confirm API `/support/notifications` stays consistent if used by clients.\n- **Expected result:** Notifications surface actionable work without inventing a parallel ticket store.\n- **Where in code:** `notifications.blade.php`; support notifications API.\n\n## Developer discussion\n\n- Is this PR only changing presentation/query filters, or is it duplicating ticket write logic?\n- Do agent vs supervisor views enforce the same `tickets.*` action permissions on deep-links?\n- Availability / max workload from Access: still respected when picking from department queue?\n- API parity: `/api/v1/support/*` vs Blade workspace — intentional differences documented?\n- Do not break: route names `workspace.*`, menu links, and ticket detail navigation.\n\n## Related modules\n\n- [Tickets](tickets.md)\n- [Access / User Management](access-user-management.md)\n- [Support Chat](support-chat.md)\n- [Announcements](announcements.md)\n","web/survey.md":"# Web — Satisfaction Survey\n\n## Purpose\n\nStores and updates an external satisfaction survey URL (model name is historically misspelled `Survery`). Admin can update the link; customer menu opens the URL. Not a full survey engine inside the app.\n\nThis module exists as a lightweight pointer: ASELCO can change the third-party survey destination without a mobile/app store release. Admins set the URL from the admin menu Swal; customers open whatever is currently stored. There is no question bank, response analytics, or `/api/v1` survey API in this doc’s scope.\n\nBe careful with the wiring: `POST /survey/update-link` is routed to `BillingUploadController::updateAccountNumber` in `web.php`. That historical coupling is easy to break when refactoring billing upload. Prefer fixing the route target deliberately over “cleaning” billing methods without checking survey behavior.\n\n## Deeper explanation\n\n- **Key concepts:** Single stored external URL; admin update POST; customer menu link-out; misspelled `Survery` model / `surveries` table naming.\n- **Invariants:** App does not host survey questions; changing the link should not require schema beyond the Survery row; customer only needs read of the configured URL.\n- **Common pitfalls:** “Fixing” the BillingUploadController method and silently breaking survey updates; renaming the model without migrations/aliases; building a full survey product on this table without a new design; assuming fine-grained access codes exist (role menu visibility only).\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Admin | Swal/UI in admin menu → `POST /survey/update-link` |\n| Customer (web) | Customer menu opens configured survey link |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Admin[Admin] --> Update[POST_survey_update_link]\n  Update --> Model[(surveries_table)]\n  Customer[Customer] --> OpenLink[Open_external_survey_URL]\n  OpenLink --> Model\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  AdminEdit[Admin_sets_URL] --> Save[BillingUploadController_updateAccountNumber_handler]\n  Save --> Stored[Survery_row_updated]\n  Stored --> CustomerOpens[Customer_opens_link]\n```\n\nNote: the update route is wired to `BillingUploadController::updateAccountNumber` in `web.php` (`POST /survey/update-link`) — verify behavior when changing survey storage.\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Model | `aselcoph/app/Models/Survery.php` |\n| Controller hook | `BillingUploadController` (route target for update) |\n| UI | Admin menu Swal in `components/menu/admin.blade.php`; customer menu link |\n| Services / AI | None |\n\n## Routes\n\n| Method | Path |\n|--------|------|\n| POST | `/survey/update-link` |\n\n## Permissions / feature flags\n\nAdmin menu visibility by role.\n\n## Scenarios\n\n### Scenario A — Admin updates survey URL\n\n- **Actor:** Admin (menu-visible role)\n- **Steps:**\n  1. Open admin menu survey Swal (`components/menu/admin.blade.php`).\n  2. Submit new URL to `POST /survey/update-link`.\n  3. Confirm `Survery` row updated.\n- **Expected result:** Stored URL changes; no in-app survey pages created.\n- **Where in code:** Route → `BillingUploadController::updateAccountNumber`; model `Survery.php`.\n\n### Scenario B — Customer opens survey\n\n- **Actor:** Customer web user\n- **Steps:**\n  1. Use customer menu survey entry.\n  2. Browser opens the external URL from storage.\n- **Expected result:** External site loads; app does not collect answers locally.\n- **Where in code:** Customer menu link reading configured URL / `Survery` model.\n\n### Scenario C — Billing upload refactor risk\n\n- **Actor:** Developer changing billing upload\n- **Steps:**\n  1. Inspect `web.php` for `/survey/update-link` target.\n  2. Change or rename `updateAccountNumber` only with a survey regression check.\n  3. Prefer dedicating a clear controller method if decoupling.\n- **Expected result:** Survey update still works after billing changes; intentional decoupling documented.\n- **Where in code:** `web.php` route binding; `BillingUploadController`.\n\n## Developer discussion\n\n- If you touch `BillingUploadController::updateAccountNumber`, did you verify `/survey/update-link`?\n- URL validation (https only, length, XSS in admin display)?\n- Is role-menu gating enough, or should this move under Access permissions?\n- Renaming `Survery` / `surveries`: migration + code aliases plan?\n- Do not build response storage into this table without a proper survey product design.\n\n## Related modules\n\n- [Dashboard](dashboard.md)\n- [Auth & Profile](auth-profile.md)\n","web/tickets.md":"# Web — Tickets (Complaints & Requests)\n\n## Purpose\n\nStaff-facing ticket queue for customer complaints and service requests: intake, assign/reassign, progress actions, escalate, close, attachments, feedback, and reports. Replaces or supplements the older `CustomerComplaint` flow. Mobile customers create and track tickets via `/api/v1/customer/tickets`.\n\nTicket AI (analyze priority, suggest replies) is documented under [AI Assistant](ai-assistant.md) but invoked from ticket screens.\n\nTickets are the operational spine for member issues that need a human owner, SLA visibility, and an auditable action history. Intake can start on web (staff on behalf of a caller) or on mobile (member self-serve); both converge on `TicketService` and the same `tickets` tables so status, assignment, and attachments stay consistent.\n\nWeb owns the full lifecycle UI under `/tickets/*` (middleware `can.manage-tickets`). Mobile and admin APIs mirror create/list/show and selected actions. Legacy `CustomerComplaint` / `CustomerComplaintController` may still appear in older menus — prefer the Ticket models for new work, and use import helpers only when migrating history.\n\n## Deeper explanation\n\n- **Key concepts:** Ticket as the case record; actions and status history as the timeline; categories for routing; escalations for supervisor paths; attachments and feedback as optional edges; AI analysis/drafts are assistive, not auto-close.\n- **Invariants:** Assignment and reassignment should leave history (`TicketAssignmentHistory`); close is a terminal (or near-terminal) staff action; customer API must not expose staff-only escalate/reassign without proper gates; auto-assign strategy comes from config (`TICKET_AUTO_ASSIGN_STRATEGY`, `ACCESS_AI_ASSIGNMENT`), not hard-coded agent IDs in controllers.\n- **Common pitfalls:** Building new flows against legacy complaints only; mutating status without writing action/history rows; letting AI apply priority without an explicit staff confirm path; forgetting attachment download auth on `TicketAttachmentDownloadController`.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Ticket-capable staff | `/tickets` queue, `/tickets/intake` |\n| Supervisors | Escalations, reports, reassign |\n| Agents via workspace | [Support Workspace](support-workspace.md) |\n| Members | Mobile Tickets / Complaints |\n\nMiddleware: `can.manage-tickets` on `/tickets/*`.\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff_Web] --> TicketWeb[TicketAdminWebController]\n  Mobile[Mobile_App] --> CustTicket[CustomerTicketController]\n  AdminApi[Admin_API] --> AdminTicket[AdminTicketController]\n  TicketWeb --> TicketSvc[TicketService]\n  CustTicket --> TicketSvc\n  AdminTicket --> TicketSvc\n  TicketSvc --> Ticket[(tickets)]\n  TicketWeb --> TicketAi[Ticket_AI_actions]\n  TicketAi --> AiSvc[Services_Ai]\n```\n\n## Process flowchart — staff lifecycle\n\n```mermaid\nflowchart TD\n  Intake[Intake_or_customer_create] --> Open[Ticket_open]\n  Open --> Assign[Assign_or_auto_assign]\n  Assign --> Progress[Start_progress_and_actions]\n  Progress --> Branch{Need_escalate}\n  Branch -->|yes| Escalate[Escalate]\n  Escalate --> Progress\n  Branch -->|no| Close[Close_ticket]\n  Close --> Feedback[Optional_feedback]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers (web) | `aselcoph/app/Http/Controllers/TicketAdminWebController.php` |\n| Controllers (API) | `aselcoph/app/Http/Controllers/Api/Admin/AdminTicketController.php` |\n| | `aselcoph/app/Http/Controllers/Api/V1/CustomerTicketController.php` |\n| | `aselcoph/app/Http/Controllers/Api/V1/TicketAttachmentDownloadController.php` |\n| Legacy | `aselcoph/app/Http/Controllers/CustomerComplaintController.php` |\n| Models | `Ticket.php`, `TicketAction.php`, `TicketAttachment.php`, `TicketCategory.php` |\n| | `TicketEscalation.php`, `TicketFeedback.php`, `TicketStatusHistory.php`, `TicketAssignmentHistory.php` |\n| | `TicketAiAnalysis.php`, `TicketAiResponseDraft.php` |\n| | Legacy: `CustomerComplaint.php` |\n| Services | `aselcoph/app/Services/TicketService.php` |\n| | `aselcoph/app/Services/LegacyComplaintImportService.php` |\n| | AI: `Services/Ai/TicketAiAnalyzer.php`, `TicketAiResponseAssistant.php` |\n| Views | `aselcoph/resources/views/pages/staff/tickets/*` |\n| Config | `aselcoph/config/tickets.php` |\n| Jobs | `aselcoph/app/Jobs/AnalyzeTicketWithAiJob.php` |\n\n## Routes / API\n\n### Web (`/tickets/*`, `tickets.*`)\n\n| Path | Action |\n|------|--------|\n| `GET /tickets` | Queue |\n| `GET/POST /tickets/intake`, `POST /tickets` | Intake / store |\n| `GET /tickets/{id}` | Detail |\n| `POST /tickets/{id}/start\\|actions\\|escalate\\|close\\|reassign\\|attachments\\|feedback` | Lifecycle |\n| `GET /tickets/escalations`, `/reports`, `/notifications` | Ops |\n| `GET /tickets/ai` + `POST /tickets/{id}/ai/*` | AI (see AI doc) |\n\n### API (`/api/v1`)\n\n| Path | Role |\n|------|------|\n| `/customer/tickets` | Mobile create/list/show/feedback/attachments |\n| `/admin/tickets/*` | Staff API mirror |\n| `/tickets/attachments/{attachment}` | Download |\n\n## Permissions / feature flags\n\n| Key | Notes |\n|-----|--------|\n| `tickets.view/create/edit/assign/reassign/escalate/close/export` | `config/access.php` |\n| `complaints.view/create` | Legacy complaints |\n| Middleware `can.manage-tickets` | Web + many admin APIs |\n| Assignment strategy | `TICKET_AUTO_ASSIGN_STRATEGY`, `ACCESS_AI_ASSIGNMENT` in `config/access.php` |\n\n## Scenarios\n\n### Scenario A — Staff intake and close\n\n- **Actor:** Ticket-capable staff\n- **Steps:**\n  1. Open `/tickets/intake`, create the ticket, and submit.\n  2. Assign (or accept auto-assign), start progress, add actions.\n  3. Close the ticket; optionally capture feedback.\n- **Expected result:** Ticket moves through open → in progress → closed with action/status history; appears in queue/reports.\n- **Where in code:** `TicketAdminWebController` → `TicketService`; views `pages/staff/tickets/*`; `config/tickets.php`.\n\n### Scenario B — Member creates a ticket from mobile\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. App creates via `/api/v1/customer/tickets`.\n  2. Staff sees it in `/tickets` or workspace queues.\n  3. Member later views status / adds feedback or attachments as allowed by API.\n- **Expected result:** Same `Ticket` row as web intake; customer cannot reassign or escalate beyond API allowances.\n- **Where in code:** `CustomerTicketController` → `TicketService`; attachment download via `TicketAttachmentDownloadController`.\n\n### Scenario C — Escalate and use ticket AI assist\n\n- **Actor:** Agent + supervisor; optional AI\n- **Steps:**\n  1. Agent escalates from ticket detail.\n  2. Supervisor works escalations/reports views.\n  3. Staff may run AI analyze / suggest-response from `/tickets/{id}/ai/*` and review drafts before sending.\n- **Expected result:** Escalation recorded; AI outputs stored as analysis/draft, not silent status changes unless staff applies priority.\n- **Where in code:** Escalation models + `TicketAiAnalyzer` / `TicketAiResponseAssistant`; job `AnalyzeTicketWithAiJob`.\n\n## Developer discussion\n\n- Are status transitions and assignment changes going through `TicketService` with history rows, not Blade-only updates?\n- Which permission codes (`tickets.assign` vs `reassign` vs `escalate` vs `close`) does this PR touch, and are web + admin API aligned?\n- Attachment upload/download: authZ checked for both staff and customer paths?\n- If AI is involved: does apply-priority require an explicit POST, and is `AI_ENABLED` / throttle respected?\n- What should QA not break: queue filters, workspace deep-links to ticket detail, legacy complaint import assumptions?\n\n## Related modules\n\n- [AI Assistant](ai-assistant.md)\n- [Support Workspace](support-workspace.md)\n- [Access / User Management](access-user-management.md) — assignable agents\n- [Mobile Tickets](../mobile/tickets.md), [Complaints](../mobile/complaints.md)\n- [Announcements](announcements.md)\n"};

    .main-content,
    .slot-rail-body,
    .main-sidebar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .page-main::-webkit-scrollbar,
    .main-content::-webkit-scrollbar,
    .slot-rail-body::-webkit-scrollbar,
    .main-sidebar::-webkit-scrollbar,
    .article pre::-webkit-scrollbar,
    .mermaid::-webkit-scrollbar {

      height: 0 !important;
      display: none !important;

    /* ---------- Sidebar (matches aselco-shell) ---------- */
    .app-sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      height: 100dvh;
      position: fixed;

      flex-direction: column;
      overflow: hidden;

    .main-sidebar-header {

    .header-logo {

      align-items: center;

      width: 100%;

      text-decoration: none;
      height: 100%;

    .sidebar-brand-mark {

      height: 2.85rem;

      border-radius: 0.5rem;

    .sidebar-brand-copy {

      flex-direction: column;
      min-width: 0;
      line-height: 1.15;
    }
    .sidebar-brand-copy strong {

      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .sidebar-brand-tagline {
      margin-top: 0.12rem;
      color: rgb(176 182 198);
      font-size: 0.62rem;
      font-weight: 500;
      font-style: italic;
      white-space: nowrap;
    }

    .main-sidebar {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.35rem 0 1.25rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .main-sidebar::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .main-menu {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .slide {
      padding-left: 0.65rem;
      padding-right: 0.65rem;
    }

    .slide__category {
      padding: 0.85rem 1.05rem 0.35rem;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgb(162 166 185);
    }

    .side-menu__item {
      display: flex;
      align-items: center;
      min-height: 2.45rem;
      border-radius: 0.7rem;
      border: 0;
      padding: 0.38rem 0.55rem;
      font-weight: 500;
      color: rgb(196 201 220);
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
      cursor: pointer;
      width: 100%;
      background: transparent;
      font-family: inherit;
      text-align: left;
    }
    .side-menu__item:hover {
      background-color: rgb(255 255 255 / 0.06);
      color: #fff;
    }
    .side-menu__item:hover .side-menu__icon { color: #fff; }

    .side-menu__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.85rem;
      height: 1.85rem;
      margin-inline-end: 0.6rem;
      border-radius: 0.5rem;
      background: rgb(255 255 255 / 0.07);
      color: rgb(143 210 164);
      font-size: 0.95rem;
      line-height: 1;
      flex-shrink: 0;

    .side-menu__label {

      align-items: center;

      min-width: 0;
      font-size: 0.9rem;
      font-weight: 500;
      color: inherit;
    }

    .side-menu__item.active {
      background-color: rgb(var(--primary) / 0.22);

      border: 1px solid rgb(var(--primary) / 0.55);
      box-shadow: inset 3px 0 0 rgb(var(--primary));
      font-weight: 600;
    }
    .side-menu__item.active .side-menu__label { font-weight: 600; color: #fff; }
    .side-menu__item.active .side-menu__icon {
      background: rgb(var(--primary));
      color: #fff;
    }

    .slide.hidden,
    .slide__category.hidden { display: none; }

    .sidebar-search {
      padding: 0.55rem 0.85rem 0.35rem;
      flex-shrink: 0;
    }
    .sidebar-search input {
      width: 100%;
      border: 1px solid rgb(255 255 255 / 0.12);
      background: rgb(0 0 0 / 0.28);
      color: #fff;
      border-radius: 0.55rem;
      padding: 0.45rem 0.65rem;
      font: inherit;
      font-size: 0.78rem;
      outline: none;

    .sidebar-search input::placeholder { color: rgb(162 166 185); }
    .sidebar-search input:focus {
      border-color: rgb(var(--primary) / 0.7);
      box-shadow: 0 0 0 2px rgb(var(--primary) / 0.25);
    }

    .sidebar-scroll-hint {
      flex-shrink: 0;
      margin: 0 0.85rem 0.75rem;
      padding: 0.45rem 0.55rem;
      border-radius: 0.55rem;
      border: 1px solid rgb(255 255 255 / 0.08);
      background: rgb(255 255 255 / 0.04);

    .sidebar-scroll-hint.is-visible { opacity: 1; }

      opacity: 1;
      color: rgb(143 210 164);
      border-color: rgb(var(--primary) / 0.35);

    /* ---------- Main + header ---------- */
    .page-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      margin-left: var(--sidebar-w);
      width: calc(100% - var(--sidebar-w));
    }

    .app-header {
      height: var(--header-h);
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .sidemenu-toggle {
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #374151;

    .sidemenu-toggle:hover { background: #f3f4f6; }

    .header-search-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #6b7280;
      border-radius: 0.55rem;

      font-size: 0.82rem;
      cursor: text;
      min-width: min(280px, 42vw);
    }
    .header-search-trigger i { color: #9ca3af; }
    .header-search-trigger kbd {
      margin-left: auto;
      font-size: 0.68rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 0.3rem;
      padding: 0.05rem 0.35rem;
      color: #9ca3af;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: #374151;
      background: rgb(var(--primary) / 0.08);
      border: 1px solid rgb(var(--primary) / 0.2);
      color: rgb(10 90 42);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .page-crumbs-bar {
      background: #fff;
      border-bottom: 1px solid #eef0f3;
      padding: 0.55rem 1.25rem;
      font-size: 0.8rem;
      color: #6b7280;
    }
    .page-crumbs-bar strong { color: #111827; font-weight: 650; }
    .page-crumbs-bar .sep { margin: 0 0.4rem; color: #d1d5db; }

    .main-content {
      flex: 1;
      overflow: auto;
      padding: 30px;
      position: relative;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .main-content::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .content-slot {
      max-width: none;
      width: 100%;
      margin: 0;
    }

    .content-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
      width: 100%;
    }

    .box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 0.85rem;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
      overflow: hidden;
      min-width: 0;
    }
    .box-body { padding: 1.5rem 1.65rem 2rem; }

    /* ---------- In-slot left topics sidebar ---------- */
    .slot-rail-wrap {
      position: relative;
      align-self: start;
      order: 0;
    }

    .slot-rail {
      width: 280px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 0.85rem;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
    }

    .slot-rail-head {
      flex-shrink: 0;
      padding: 0.85rem 0.9rem 0.65rem;
      border-bottom: 1px solid #eef2f0;
      background: rgb(var(--primary) / 0.06);
    }
    .slot-rail-head strong {
      display: block;
      color: #111827;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .slot-rail-head span {
      display: block;
      margin-top: 0.15rem;
      color: #6b7280;
      font-size: 0.78rem;
    }

    .slot-rail-body {
      flex: 1;
      min-height: 0;
      overflow: visible;
      padding: 0.55rem 0.65rem 0.85rem;
      background: #fff;
    }

    .rail-section {
      margin-bottom: 0.85rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #eef2f0;
    }
    .rail-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }
    .rail-section h3 {
      margin: 0 0 0.45rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #166534;
      font-weight: 750;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .rail-section h3 i {
      font-size: 0.9rem;
      color: rgb(var(--primary));
    }
    .rail-section a {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #374151;
      text-decoration: none;
      padding: 0.35rem 0.45rem;
      border-radius: 0.4rem;
      font-weight: 500;
    }
    .rail-section a:hover {
      background: rgb(var(--primary) / 0.08);
      color: rgb(var(--primary));
    }
    .rail-section a.is-h3 {
      padding-left: 1.65rem;
      color: #6b7280;
      font-weight: 450;
    }
    .rail-section a .topic-num {
      flex-shrink: 0;
      min-width: 1.25rem;
      height: 1.25rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgb(var(--primary) / 0.12);
      color: #14532d;
      margin-top: 0.05rem;
    }
    .rail-section a.is-h3 .topic-num {
      background: #f3f4f6;
      color: #6b7280;
    }
    .rail-section .empty {
      font-size: 0.86rem;
      color: #9ca3af;
      margin: 0;
      line-height: 1.4;
      padding: 0 0.35rem;
    }
    .rail-section ul {
      margin: 0;
      padding-left: 1rem;
      font-size: 0.88rem;
      color: #4b5563;
      line-height: 1.5;
    }
    .rail-section li { margin: 0.28rem 0; }
    .rail-section .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .rail-section .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      background: rgb(var(--primary) / 0.08);
      color: #14532d;
      border: 1px solid rgb(var(--primary) / 0.18);
      text-decoration: none;
    }
    .rail-section .pill:hover {
      background: rgb(var(--primary) / 0.14);
      color: #14532d;
    }

    .content-main {
      min-width: 0;
      order: 1;
    }

    .scenario-callout {
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 3px solid #f59e0b;
      border-radius: 0.55rem;
    }
    .scenario-callout strong { color: #92400e; }

    .scenarios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin: 1rem 0 1.35rem;
    }

    .scenario-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 0.85rem;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-top: 3px solid rgb(var(--primary));
    }
    .scenario-card-head {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.9rem 1rem 0.65rem;
      background: rgb(var(--primary) / 0.05);
      border-bottom: 1px solid #eef2f0;
    }
    .scenario-card-badge {
      flex-shrink: 0;
      min-width: 1.75rem;
      height: 1.75rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 750;
      background: rgb(var(--primary));
      color: #fff;
      margin-top: 0.1rem;
    }
    .scenario-card-head h3 {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      font-size: 1.05rem !important;
      line-height: 1.35;
      color: #111827 !important;
      scroll-margin-top: 5.5rem;
    }
    .scenario-card-body {
      padding: 0.85rem 1rem 1.05rem;
      flex: 1;
    }
    .scenario-card-body > *:first-child { margin-top: 0; }
    .scenario-card-body > *:last-child { margin-bottom: 0; }
    .scenario-card-body ul,
    .scenario-card-body ol {
      margin: 0.4rem 0 0.65rem;
    }
    .scenario-card-body li {
      font-size: 1rem;
    }
    .scenario-card-meta {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }
    .scenario-card-meta-item {
      background: #f9fafb;
      border: 1px solid #eef2f0;
      border-radius: 0.55rem;
      padding: 0.55rem 0.7rem;
    }
    .scenario-card-meta-item strong {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #166534;
      margin-bottom: 0.2rem;
    }
    .scenario-card-meta-item .meta-body {
      font-size: 0.98rem;
      color: #374151;
      line-height: 1.55;
    }
    .scenario-card-meta-item .meta-body p,
    .scenario-card-meta-item .meta-body ul,
    .scenario-card-meta-item .meta-body ol {
      margin: 0.25rem 0 0;
    }
    .discuss-callout {
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-left: 3px solid #3b82f6;
      border-radius: 0.55rem;
    }

    .article h1 {
      margin: 0 0 0.85rem;
      font-size: 1.85rem;
      font-weight: 750;
      color: #111827;
      line-height: 1.25;
    }
    .article h2 {
      margin: 1.65rem 0 0.65rem;
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      scroll-margin-top: 5.5rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid #eef2f0;
    }
    .article h3 {
      margin: 1.2rem 0 0.45rem;
      font-size: 1.12rem;
      font-weight: 650;
      color: #1f2937;
      scroll-margin-top: 5.5rem;
    }
    .article p, .article li {
      line-height: 1.7;
      font-size: 1.05rem;
      color: #374151;
    }
    .article a {
      color: rgb(var(--primary));
      font-weight: 600;
      text-decoration: none;
    }
    .article a:hover { text-decoration: underline; }
    .article ul, .article ol { padding-left: 1.2rem; }
    .article hr {
      border: 0;
      border-top: 1px solid #e5e7eb;
      margin: 1.4rem 0;
    }
    .article table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.8rem 0 1rem;
      font-size: 0.98rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.55rem;
      overflow: hidden;
    }
    .article th, .article td {
      border: 1px solid #e5e7eb;
      padding: 0.6rem 0.75rem;
      text-align: left;
      vertical-align: top;
    }
    .article th {
      background: rgb(var(--primary) / 0.08);
      color: #14532d;
      font-weight: 700;
    }
    .article tr:nth-child(even) td { background: #fafafa; }
    .article code {
      font-family: var(--mono);
      font-size: 0.92em;
      background: #f3f4f6;
      padding: 0.1em 0.35em;
      border-radius: 0.3rem;
    }
    .article pre {
      background: #111318;
      color: #e5e7eb;
      padding: 0.9rem 1rem;
      border-radius: 0.65rem;
      overflow: auto;
      font-size: 0.92rem;
      line-height: 1.5;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .article pre::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    .article pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }
    .article blockquote {
      margin: 1rem 0;
      padding: 0.15rem 0 0.15rem 0.85rem;
      border-left: 3px solid rgb(var(--primary));
      color: #6b7280;
    }

    .mermaid {
      background: #f8faf9;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 1.25rem 1rem;
      margin: 1rem 0 1.2rem;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .mermaid svg {
      display: block;
      /* Do not stretch to full column width — that enlarges text */
      width: auto !important;
      max-width: 100%;
      height: auto !important;
      margin: 0 auto;
      overflow: visible;
    }

    .state {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: #6b7280;
    }
    .state h2 { margin: 0 0 0.45rem; color: #111827; font-size: 1.1rem; }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgb(15 23 42 / 0.45);
      z-index: 35;
    }

    @media (max-width: 1100px) {
      .content-layout { grid-template-columns: 1fr; }
      .slot-rail-wrap { order: 1; }
      .slot-rail {
        position: static !important;
        width: 100%;
        height: auto;
        max-height: none;
      }
      .slot-rail-body {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.5rem;
      }
      .rail-section {
        border-bottom: 0;
        border: 1px solid #e5e7eb;
        border-radius: 0.55rem;
        padding: 0.55rem;
        margin: 0;
        background: #fafafa;
      }
      .content-main { order: 0; }
    }

    @media (max-width: 960px) {
      .app-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-105%);
        box-shadow: 8px 0 28px rgb(0 0 0 / 0.28);
      }
      body.nav-open .app-sidebar { transform: translateX(0); }
      body.nav-open .backdrop { display: block; }
      .page-main {
        margin-left: 0;
        width: 100%;
      }
      .header-search-trigger span,
      .header-search-trigger kbd { display: none; }
      .header-search-trigger { min-width: 2.35rem; padding: 0.4rem; justify-content: center; }
      .header-pill { display: none; }
      .box-body { padding: 1.15rem 1rem 1.5rem; }
      .main-content { padding: 30px 16px 30px; }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <aside class="app-sidebar" id="sidebar">
    <div class="main-sidebar-header">
      <a href="#README.md" class="header-logo" id="brandLink">
        <img src="assets/logo_favicon.png" alt="ASELCO" class="sidebar-brand-mark" />
        <span class="sidebar-brand-copy">
          <strong>ASELCO Inc.</strong>
          <span class="sidebar-brand-tagline">Serbisyong Mapahiyumon</span>
        </span>
      </a>
    </div>

    <div class="sidebar-search">
      <input type="search" id="search" placeholder="Filter documentation…" autocomplete="off" />
    </div>

    <div class="main-sidebar" id="sidebar-scroll">
      <nav class="main-menu-container">
        <ul class="main-menu" id="nav"></ul>
      </nav>
    </div>
    <div class="sidebar-scroll-hint" id="navScrollHint">Scroll for more modules</div>
  </aside>

  <div class="page-main">
    <header class="app-header" id="header">
      <button type="button" class="sidemenu-toggle" id="menuBtn" aria-label="Toggle sidebar">
        <i class="bi bi-list"></i>
      </button>
      <label class="header-search-trigger" for="search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <span>Search docs</span>
        <kbd>/</kbd>
      </label>
      <div class="header-right">
        <span class="header-pill"><i class="bi bi-journal-code"></i> Module Docs</span>
        <span class="header-pill docs-build-stamp" title="Docs v1.0.3 · revised 2026-09-07 03:49:11 · run: node docs/build-docs-data.js"><i class="bi bi-tag"></i> v1.0.3 · 2026-09-07 03:49:11</span>
      </div>
    </header>

    <div class="page-crumbs-bar" id="crumb">
      <strong>Documentation</strong>
    </div>

    <div class="main-content" id="scroll">
      <div class="content-slot">
        <div class="box">
          <div class="box-body state" id="boot">
            <h2>Loading documentation…</h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const NAV = [
      {
        title: "Start here",
        items: [
          { label: "Overview", path: "README.md", icon: "bi-layers" },
          { label: "Architecture", path: "architecture/overview.md", icon: "bi-diagram-3" },
          { label: "MVC conventions", path: "architecture/mvc-conventions.md", icon: "bi-braces" },
        ],
      },
      {
        title: "Web modules",
        items: [
          { label: "Web index", path: "web/README.md", icon: "bi-globe2" },
          { label: "AST Wallet", path: "web/ast-wallet.md", icon: "bi-wallet2" },
          { label: "Tickets", path: "web/tickets.md", icon: "bi-ticket-detailed" },
          { label: "AI Assistant", path: "web/ai-assistant.md", icon: "bi-robot" },
          { label: "Knowledge / RAG", path: "web/knowledge-rag.md", icon: "bi-book" },
          { label: "Support Chat", path: "web/support-chat.md", icon: "bi-chat-dots" },
          { label: "Access / Users", path: "web/access-user-management.md", icon: "bi-people" },
          { label: "Support Workspace", path: "web/support-workspace.md", icon: "bi-speedometer2" },
          { label: "Announcements", path: "web/announcements.md", icon: "bi-megaphone" },
          { label: "Consumers / Billing", path: "web/consumers-billing.md", icon: "bi-receipt" },
          { label: "Calendar", path: "web/calendar.md", icon: "bi-calendar-event" },
          { label: "Auth & Profile", path: "web/auth-profile.md", icon: "bi-person-gear" },
          { label: "Dashboard", path: "web/dashboard.md", icon: "bi-grid-1x2" },
        ],
      },
      {
        title: "Web legacy / ops",
        items: [
          { label: "CMS / Blog", path: "web/cms-blog.md", icon: "bi-newspaper" },
          { label: "File Manager", path: "web/file-manager.md", icon: "bi-folder2-open" },
          { label: "Survey", path: "web/survey.md", icon: "bi-graph-up-arrow" },
        ],
      },
      {
        title: "Mobile modules",
        items: [
          { label: "Mobile index", path: "mobile/README.md", icon: "bi-phone" },
          { label: "Auth", path: "mobile/auth.md", icon: "bi-shield-lock" },
          { label: "Onboarding", path: "mobile/onboarding.md", icon: "bi-compass" },
          { label: "Membership", path: "mobile/membership.md", icon: "bi-link-45deg" },
          { label: "Home / Dashboard", path: "mobile/home-dashboard.md", icon: "bi-house" },
          { label: "Ledger", path: "mobile/ledger.md", icon: "bi-journal-text" },
          { label: "AST Wallet", path: "mobile/ast-wallet.md", icon: "bi-wallet2" },
          { label: "Pay with AST", path: "mobile/pay-with-ast.md", icon: "bi-cash-coin" },
          { label: "Tickets", path: "mobile/tickets.md", icon: "bi-ticket-detailed" },
          { label: "Complaints", path: "mobile/complaints.md", icon: "bi-hand-index" },
          { label: "AI Assistant", path: "mobile/ai-assistant.md", icon: "bi-robot" },
          { label: "Support Chat", path: "mobile/support-chat.md", icon: "bi-headset" },
          { label: "Profile", path: "mobile/profile.md", icon: "bi-person" },
          { label: "Notifications", path: "mobile/notifications.md", icon: "bi-bell" },
        ],
      },
    ];

    const flatNav = NAV.flatMap((g) => g.items);
    const labelByPath = Object.fromEntries(flatNav.map((i) => [normalizePath(i.path), i.label]));

    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      securityLevel: "loose",
      flowchart: {
        curve: "basis",
        htmlLabels: false,
        useMaxWidth: false,
      },
      themeVariables: {
        primaryColor: "#e8f6ee",
        primaryTextColor: "#0f2a24",
        primaryBorderColor: "#0e7c3a",
        lineColor: "#3d5f54",
        secondaryColor: "#f4f6f8",
        tertiaryColor: "#ffffff",
      },
    });

    marked.setOptions({ gfm: true, breaks: false });
    marked.use({
      renderer: {
        code({ text, lang, escaped }) {
          const language = (lang || "").trim().split(/\s+/)[0];
          if (language === "mermaid") {
            const safe = String(text)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            return `<pre class="mermaid">${safe}</pre>`;
          }
          const codeText = String(text);
          const shown = escaped
            ? codeText
            : codeText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
          const cls = language ? ` class="language-${language}"` : "";
          return `<pre><code${cls}>${shown}</code></pre>`;
        },
      },
    });

    const navEl = document.getElementById("nav");
    const scrollEl = document.getElementById("scroll");
    const crumbEl = document.getElementById("crumb");
    const searchEl = document.getElementById("search");
    const menuBtn = document.getElementById("menuBtn");
    const backdrop = document.getElementById("backdrop");

    function normalizePath(path) {
      return String(path || "")
        .replace(/^\.\//, "")
        .replace(/\\/g, "/")
        .replace(/^\/+/, "");
    }

    function resolveLink(href, currentPath) {
      if (!href || href.startsWith("#") || /^https?:/i.test(href) || href.startsWith("mailto:")) {
        return null;
      }
      const clean = href.split("#")[0].split("?")[0];
      if (!clean.endsWith(".md") && !clean.endsWith(".markdown") && !/README$/i.test(clean)) {
        return null;
      }
      const baseDir = currentPath.includes("/")
        ? currentPath.slice(0, currentPath.lastIndexOf("/") + 1)
        : "";
      const parts = (baseDir + clean).split("/");
      const stack = [];
      for (const part of parts) {
        if (!part || part === ".") continue;
        if (part === "..") stack.pop();
        else stack.push(part);
      }
      return normalizePath(stack.join("/"));
    }

    function buildNav() {
      navEl.innerHTML = NAV.map((group) => {
        const cat = `<li class="slide__category" data-group="${group.title}"><span class="category-name">${group.title}</span></li>`;
        const links = group.items
          .map(
            (item) => `
            <li class="slide" data-group="${group.title}" data-label="${item.label}" data-path="${item.path}">
              <a href="#${encodeURIComponent(item.path)}" class="side-menu__item" data-path="${item.path}">
                <i class="side-menu__icon bi ${item.icon}" aria-hidden="true"></i>
                <span class="side-menu__label">${item.label}</span>
              </a>
            </li>`
          )
          .join("");
        return cat + links;
      }).join("");

      const navScroll = document.getElementById("sidebar-scroll");
      if (navScroll) {
        navScroll.removeEventListener("scroll", updateNavScrollHint);
        navScroll.addEventListener("scroll", updateNavScrollHint, { passive: true });
        requestAnimationFrame(updateNavScrollHint);
      }
    }

    function setActive(path) {
      navEl.querySelectorAll(".side-menu__item").forEach((a) => {
        a.classList.toggle("active", normalizePath(a.dataset.path) === normalizePath(path));
      });
    }

    function slugify(text) {
      return String(text)
        .toLowerCase()
        .replace(/[^\w\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-");
    }

    function scrollToId(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      history.replaceState(null, "", `#${encodeURIComponent(currentPath)}#${id}`);
    }

    function assignHeadingIds(article) {
      [...article.querySelectorAll("h2, h3")].forEach((h) => {
        h.id = slugify(h.textContent);
      });
    }

    function wrapScenarioCards(article) {
      const headings = [...article.querySelectorAll("h2")];
      const scenariosH2 = headings.find((h) => /^scenarios?$/i.test(h.textContent.trim()));
      if (!scenariosH2) return;

      const blockNodes = [];
      let node = scenariosH2.nextElementSibling;
      while (node && node.tagName !== "H2") {
        blockNodes.push(node);
        node = node.nextElementSibling;
      }
      if (!blockNodes.length) return;

      const firstScenarioIdx = blockNodes.findIndex((el) => el.tagName === "H3");
      if (firstScenarioIdx < 0) return;

      const scenarioNodes = blockNodes.slice(firstScenarioIdx);
      const grid = document.createElement("div");
      grid.className = "scenarios-grid";

      let currentBody = null;
      let index = 0;

      function startCard(h3) {
        index += 1;
        const card = document.createElement("article");
        card.className = "scenario-card";

        const head = document.createElement("div");
        head.className = "scenario-card-head";

        const badge = document.createElement("span");
        badge.className = "scenario-card-badge";
        badge.textContent = String(index);

        head.appendChild(badge);
        head.appendChild(h3);
        card.appendChild(head);

        currentBody = document.createElement("div");
        currentBody.className = "scenario-card-body";
        card.appendChild(currentBody);
        grid.appendChild(card);
      }

      function enhanceListIntoMeta(ul) {
        const items = [...ul.children].filter((li) => li.tagName === "LI");
        if (!items.length) return false;

        const looksLikeMeta = items.every((li) => !!li.querySelector("strong"));
        if (!looksLikeMeta) return false;

        const meta = document.createElement("div");
        meta.className = "scenario-card-meta";

        items.forEach((li) => {
          const strong = li.querySelector("strong");
          const label = (strong?.textContent || "").replace(/:$/, "").trim();
          const clone = li.cloneNode(true);
          const strongClone = clone.querySelector("strong");
          if (strongClone) strongClone.remove();
          const html = clone.innerHTML.replace(/^\s*[:\-–—]\s*/, "").trim() || clone.textContent.trim();

          const item = document.createElement("div");
          item.className = "scenario-card-meta-item";
          item.innerHTML = `<strong>${label || "Detail"}</strong><div class="meta-body">${html}</div>`;
          meta.appendChild(item);
        });

        currentBody.appendChild(meta);
        return true;
      }

      scenarioNodes.forEach((el) => {
        if (el.tagName === "H3") {
          startCard(el);
          return;
        }
        if (!currentBody) return;
        if (el.tagName === "UL" && enhanceListIntoMeta(el)) {
          el.remove();
          return;
        }
        currentBody.appendChild(el);
      });

      const insertAfter = firstScenarioIdx > 0
        ? blockNodes[firstScenarioIdx - 1]
        : scenariosH2;
      insertAfter.after(grid);
    }

    function findSectionHeadings(article, titleMatch) {
      const all = [...article.querySelectorAll("h2, h3")];
      const start = all.findIndex((h) => titleMatch.test(h.textContent.trim()));
      if (start < 0) return [];
      const startLevel = all[start].tagName;
      const out = [];
      for (let i = start + 1; i < all.length; i++) {
        if (all[i].tagName === startLevel) break;
        if (all[i].tagName === "H3" || (startLevel === "H2" && all[i].tagName === "H3")) {
          out.push(all[i]);
        }
      }
      // Also include the section itself if no children
      if (!out.length) out.push(all[start]);
      return out;
    }

    function buildRailLinks(headings, options = {}) {
      const { numbered = false } = options;
      if (!headings.length) return `<p class="empty">None on this page yet.</p>`;
      let n = 0;
      return headings
        .map((h) => {
          const isH3 = h.tagName === "H3";
          const cls = isH3 ? " is-h3" : "";
          const num = numbered
            ? `<span class="topic-num">${++n}</span>`
            : "";
          return `<a href="#${encodeURIComponent(currentPath)}#${h.id}" data-target="${h.id}" class="${cls.trim()}">${num}<span>${h.textContent}</span></a>`;
        })
        .join("");
    }

    function extractRelated(article) {
      const headings = [...article.querySelectorAll("h2")];
      const relatedH = headings.find((h) => /related/i.test(h.textContent));
      if (!relatedH) return [];
      const links = [];
      let node = relatedH.nextElementSibling;
      while (node && node.tagName !== "H2") {
        node.querySelectorAll?.("a[href]")?.forEach((a) => {
          const href = a.getAttribute("href");
          const resolved = resolveLink(href, currentPath);
          if (resolved) links.push({ label: a.textContent.trim(), path: resolved });
        });
        node = node.nextElementSibling;
      }
      return links;
    }

    function beforeYouCodeTips(path) {
      if (path.includes("ast-wallet") || path.includes("pay-with-ast")) {
        return [
          "Never credit/debit outside a DB transaction + row lock.",
          "Always require Idempotency-Key on pay/load writes.",
          "Prefer Wallet* tables (Phase 1), not legacy AstWallet.",
        ];
      }
      if (path.includes("ticket") || path.includes("complaint")) {
        return [
          "Keep status changes in TicketService / status history.",
          "Attachments go through the ticket attachment endpoints.",
          "AI suggestions are drafts — staff must review before send.",
        ];
      }
      if (path.includes("ai-") || path.includes("knowledge")) {
        return [
          "OpenAI keys stay server-side only.",
          "Ground answers with RAG before shipping prompt changes.",
          "Respect AI_ENABLED and throttle:api-ai.",
        ];
      }
      if (path.includes("support-chat") || path.includes("chat")) {
        return [
          "Use SupportChatService for both web and mobile APIs.",
          "Do not mix legacy Supp* models into the new path.",
          "Test Pusher auth from mobile origin.",
        ];
      }
      if (path.startsWith("mobile/")) {
        return [
          "Call /api/v1 only via mobile/src/api/client.ts.",
          "Membership gate must stay before MainTabs.",
          "Avoid hardcoding secrets — use VITE_API_BASE_URL.",
        ];
      }
      return [
        "Check config/access.php permissions before new staff routes.",
        "Keep controllers thin — put rules in Services.",
        "Update this doc + rebuild docs-data.js after behavior changes.",
      ];
    }

    function buildSlotRail(article) {
      const topics = [...article.querySelectorAll("h2, h3")];
      const scenarios = findSectionHeadings(article, /^scenarios?$/i);
      // Prefer h3 under Scenarios; if section is only h2, also collect headings that start with Scenario
      const scenarioHeads = topics.filter(
        (h) => /^scenario\b/i.test(h.textContent.trim()) || /scenario/i.test(h.textContent) && h.tagName === "H3"
      );
      const discussHeads = findSectionHeadings(article, /developer discussion|discussion/i);
      const related = extractRelated(article);
      const tips = beforeYouCodeTips(currentPath);

      const relatedHtml = related.length
        ? `<div class="pill-row">${related
            .map(
              (r) =>
                `<a class="pill" href="#${encodeURIComponent(r.path)}" data-nav="${r.path}"><i class="bi bi-link-45deg"></i>${r.label}</a>`
            )
            .join("")}</div>`
        : `<p class="empty">No related module links on this page.</p>`;

      return `
        <div class="slot-rail-wrap" id="slotRailWrap">
          <aside class="slot-rail" id="slotRail" aria-label="Page topics">
            <div class="slot-rail-head">
              <strong>On this page</strong>
              <span>Topics · scenarios · discussion</span>
            </div>
            <div class="slot-rail-body" id="slotRailBody">
              <div class="rail-section">
                <h3><i class="bi bi-list-ul"></i> Topics</h3>
                ${buildRailLinks(topics, { numbered: true })}
              </div>
              <div class="rail-section">
                <h3><i class="bi bi-play-circle"></i> Scenarios</h3>
                ${buildRailLinks(scenarioHeads.length ? scenarioHeads : scenarios)}
              </div>
              <div class="rail-section">
                <h3><i class="bi bi-chat-square-text"></i> Discussion</h3>
                ${buildRailLinks(discussHeads)}
              </div>
              <div class="rail-section">
                <h3><i class="bi bi-diagram-2"></i> Related</h3>
                ${relatedHtml}
              </div>
              <div class="rail-section">
                <h3><i class="bi bi-shield-check"></i> Before you code</h3>
                <ul>${tips.map((t) => `<li>${t}</li>`).join("")}</ul>
              </div>
              <div class="rail-section">
                <h3><i class="bi bi-lightbulb"></i> How to use</h3>
                <ul>
                  <li>Read Purpose + diagrams first.</li>
                  <li>Walk a Scenario end-to-end.</li>
                  <li>Use Discussion prompts in PR review.</li>
                  <li>Jump Related modules for cross-app impact.</li>
                </ul>
              </div>
            </div>
          </aside>
        </div>`;
    }

    function updateNavScrollHint() {
      const navScroll = document.getElementById("sidebar-scroll");
      const hint = document.getElementById("navScrollHint");
      const sidebar = document.getElementById("sidebar");
      if (!navScroll || !hint || !sidebar) return;
      const overflow = navScroll.scrollHeight > navScroll.clientHeight + 4;
      const atEnd = navScroll.scrollTop + navScroll.clientHeight >= navScroll.scrollHeight - 4;
      hint.classList.toggle("is-visible", overflow && !atEnd);
      sidebar.classList.toggle("is-nav-end", overflow && atEnd);
      hint.textContent = atEnd ? "All modules shown" : "Scroll for more modules";
    }

    function updateSlotRailPosition() {
      // Intentionally no-op: topics sidebar scrolls with page content.
    }

    function bindRailBehaviors() {
      // Fixed/sticky rail disabled by design.
    }

    function wireRail(root) {
      root.querySelectorAll("[data-target]").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          scrollToId(a.dataset.target);
        });
      });
      root.querySelectorAll("[data-nav]").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(a.dataset.nav);
        });
      });
    }

    function wireInternalLinks(article, currentPath) {
      article.querySelectorAll("a[href]").forEach((a) => {
        const href = a.getAttribute("href");
        const resolved = resolveLink(href, currentPath);
        if (!resolved) return;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(resolved);
          closeMobileNav();
        });
      });
    }

    let currentPath = "README.md";
    let mermaidId = 0;

    function prepareMermaidSource(source) {
      // Show readable labels: Staff_Web -> Staff Web; keep node IDs intact.
      return String(source).replace(/\[([^\]]+)\]/g, (_, label) => {
        const cleaned = label
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        return `[${cleaned}]`;
      });
    }

    async function renderMermaid(article) {
      const nodes = [...article.querySelectorAll("pre.mermaid")];
      if (!nodes.length) return;

      // Wait for fonts so Mermaid measures text with the same face it paints
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_) {}
      }

      for (const node of nodes) {
        const source = prepareMermaidSource(node.textContent);
        const id = `mmd-${++mermaidId}`;
        try {
          const { svg } = await mermaid.render(id, source);
          const wrap = document.createElement("div");
          wrap.className = "mermaid";
          wrap.innerHTML = svg;
          const svgEl = wrap.querySelector("svg");
          if (svgEl) {
            // Keep Mermaid native size (default font). Only shrink if wider than content.
            svgEl.removeAttribute("height");
            svgEl.style.cssText =
              "max-width:100%;width:auto;height:auto;margin:0 auto;display:block;";
          }
          node.replaceWith(wrap);
        } catch (err) {
          const fail = document.createElement("pre");
          fail.textContent =
            "Mermaid render error:\n" +
            (err && err.message ? err.message : String(err)) +
            "\n\n" +
            source;
          node.replaceWith(fail);
        }
      }
    }

    function getMarkdown(path) {
      const data = window.DOCS_DATA || {};
      return data[path] || data[normalizePath(path)] || null;
    }

    async function loadDoc(path) {
      currentPath = normalizePath(path) || "README.md";
      setActive(currentPath);
      const label = labelByPath[currentPath] || currentPath;
      const section = currentPath.startsWith("web/")
        ? "Web"
        : currentPath.startsWith("mobile/")
          ? "Mobile"
          : currentPath.startsWith("architecture/")
            ? "Architecture"
            : "Docs";
      crumbEl.innerHTML = `<strong>${section}</strong><span class="sep">/</span>${label}<span class="sep">·</span><span>${currentPath}</span>`;

      const md = getMarkdown(currentPath);
      if (!md) {
        scrollEl.innerHTML = `
          <div class="content-slot"><div class="box"><div class="box-body state">
            <h2>Document not found</h2>
            <p><code>${currentPath}</code> is missing from <code>docs-data.js</code>.</p>
            <p>Rebuild with: <code>node docs/build-docs-data.js</code></p>
          </div></div></div>`;
        return;
      }

      const article = document.createElement("article");
      article.className = "article";
      article.innerHTML = marked.parse(md);
      assignHeadingIds(article);
      wrapScenarioCards(article);

      scrollEl.innerHTML = `
        <div class="content-slot">
          <div class="content-layout">
            ${buildSlotRail(article)}
            <div class="box content-main"><div class="box-body" id="articleHost"></div></div>
          </div>
        </div>`;
      document.getElementById("articleHost").appendChild(article);
      wireRail(scrollEl);
      wireInternalLinks(article, currentPath);
      await renderMermaid(article);
      requestAnimationFrame(updateNavScrollHint);
      scrollEl.scrollTop = 0;

      const hashParts = location.hash.split("#").filter(Boolean);
      if (hashParts.length > 1) {
        const anchor = decodeURIComponent(hashParts[1]);
        const el = document.getElementById(anchor);
        if (el) el.scrollIntoView({ block: "start" });
      }
    }

    function navigate(path) {
      const p = normalizePath(path) || "README.md";
      if (location.hash !== "#" + encodeURIComponent(p)) location.hash = encodeURIComponent(p);
      else loadDoc(p);
    }

    function pathFromHash() {
      const raw = location.hash.replace(/^#/, "");
      if (!raw) return "README.md";
      return normalizePath(decodeURIComponent(raw.split("#")[0])) || "README.md";
    }

    function closeMobileNav() {
      document.body.classList.remove("nav-open");
    }

    searchEl.addEventListener("input", () => {
      const q = searchEl.value.trim().toLowerCase();
      const groups = {};
      navEl.querySelectorAll(".slide[data-path]").forEach((li) => {
        const hay = (li.dataset.label + " " + li.dataset.path).toLowerCase();
        const show = !q || hay.includes(q);
        li.classList.toggle("hidden", !show);
        if (show) groups[li.dataset.group] = true;
      });
      navEl.querySelectorAll(".slide__category").forEach((cat) => {
        cat.classList.toggle("hidden", q && !groups[cat.dataset.group]);
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== searchEl && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        searchEl.focus();
      }
    });

    menuBtn.addEventListener("click", () => document.body.classList.toggle("nav-open"));
    backdrop.addEventListener("click", closeMobileNav);
    window.addEventListener("hashchange", () => {
      loadDoc(pathFromHash());
      closeMobileNav();
    });

    if (typeof marked === 'undefined') {
      scrollEl.innerHTML = `
        <div class="content-slot"><div class="box"><div class="box-body state">
          <h2>Markdown engine failed to load</h2>
          <p>Expected local file <code>docs/vendor/marked.min.js</code>.</p>
        </div></div></div>`;
    } else if (!window.DOCS_DATA) {
      scrollEl.innerHTML = `
        <div class="content-slot"><div class="box"><div class="box-body state">
          <h2>Missing docs data</h2>
          <p>Run <code>node docs/build-docs-data.js</code> then reopen <code>index.html</code>.</p>
        </div></div></div>`;
    } else {
      buildNav();
      loadDoc(pathFromHash()).catch((err) => {
        scrollEl.innerHTML = `
          <div class="content-slot"><div class="box"><div class="box-body state">
            <h2>Render error</h2>
            <p>${String(err && err.message ? err.message : err)}</p>
          </div></div></div>`;
      });
    }
  </script>
</body>
</html>
