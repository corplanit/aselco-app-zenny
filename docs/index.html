file map, routes, permissions, a context diagram, and a process flowchart.\n\n## Browse in the browser (no server needed)\n\nDouble-open [`index.html`](index.html) — markdown is embedded in [`docs-data.js`](docs-data.js), so you do **not** need `npx serve`.\n\nThe viewer matches the staff web shell (dark sidebar, Bootstrap Icons, ASELCO brand, light header). Inside each page, a **second sidebar** shows Topics, Scenarios, Discussion, Related modules, and “Before you code” tips.\n\n**After editing any `.md` file**, rebuild the embed:\n\n```bash\nnode docs/build-docs-data.js\n```\n\nThen refresh `index.html`. (Diagrams/CDN scripts need internet once for Mermaid + Bootstrap Icons.)\n\n## How to read these docs\n\n1. Start with [Architecture overview](architecture/overview.md) if you are new to the monorepo.\n2. Skim [MVC conventions](architecture/mvc-conventions.md) for where Controllers, Models, Views, and Services live.\n3. Open the module you need under [Web](web/README.md) or [Mobile](mobile/README.md).\n4. Use **Related modules** and **Backend link** sections to jump across web ↔ API ↔ mobile.\n\n## Repository layout\n\n| Path | Role |\n|------|------|\n| `aselcoph/` | Laravel 12 staff web portal + `/api/v1` backend |\n| `mobile/` | Ionic React 8 + Capacitor customer app (`myASELCO`) |\n| `aselcoph/docs/` | Deeper existing docs (AST architecture, OpenAPI, go-live) — linked from module pages |\n\n## Indexes\n\n- [Web modules](web/README.md)\n- [Mobile modules](mobile/README.md)\n- [Architecture overview](architecture/overview.md)\n- [MVC conventions](architecture/mvc-conventions.md)\n\n## Web ↔ Mobile cross map\n\n| Domain | Web doc | Mobile doc |\n|--------|---------|------------|\n| Auth | [web/auth-profile.md](web/auth-profile.md) | [mobile/auth.md](mobile/auth.md) |\n| Membership / accounts | [web/consumers-billing.md](web/consumers-billing.md) | [mobile/membership.md](mobile/membership.md) |\n| Dashboard / Home | [web/dashboard.md](web/dashboard.md) | [mobile/home-dashboard.md](mobile/home-dashboard.md) |\n| Ledger / billing history | [web/consumers-billing.md](web/consumers-billing.md) | [mobile/ledger.md](mobile/ledger.md) |\n| AST Wallet | [web/ast-wallet.md](web/ast-wallet.md) | [mobile/ast-wallet.md](mobile/ast-wallet.md) |\n| Pay with AST | [web/ast-wallet.md](web/ast-wallet.md) | [mobile/pay-with-ast.md](mobile/pay-with-ast.md) |\n| Tickets | [web/tickets.md](web/tickets.md) | [mobile/tickets.md](mobile/tickets.md) |\n| Create complaint | [web/tickets.md](web/tickets.md) | [mobile/complaints.md](mobile/complaints.md) |\n| AI | [web/ai-assistant.md](web/ai-assistant.md) | [mobile/ai-assistant.md](mobile/ai-assistant.md) |\n| Knowledge / RAG | [web/knowledge-rag.md](web/knowledge-rag.md) | (via AI answers) |\n| Support chat | [web/support-chat.md](web/support-chat.md) | [mobile/support-chat.md](mobile/support-chat.md) |\n| Notifications | [web/announcements.md](web/announcements.md) | [mobile/notifications.md](mobile/notifications.md) |\n| Profile | [web/access-user-management.md](web/access-user-management.md) | [mobile/profile.md](mobile/profile.md) |\n\n## Module doc template\n\nEvery module page follows the same structure:\n\n1. Purpose  \n2. Users / entry points  \n3. Context diagram (Mermaid)  \n4. Process flowchart (Mermaid)  \n5. File map (MVC + Services + AI)  \n6. Routes / API  \n7. Permissions / feature flags  \n8. Related modules  \n\nPaths in file maps are relative to the repo root unless noted.\n","web/access-user-management.md":"# Web — Access / User Management\n\n## Purpose\n\nCentral staff module for users, customers, support agents, departments, roles, permission matrix, sessions, activity, availability, assignments, settings, and access reports. Gates every other staff feature through `config/access.php` permission codes.\n\nDeeper reference: [aselcoph/docs/user-management.md](../../aselcoph/docs/user-management.md).\n\nAccess is the control plane for who can see and change everything else in the staff portal. Creating a user without the right role/department breaks ticket assignment and menu visibility; editing permissions without understanding gates breaks APIs that check `can.permission:*` or module codes. Web UI under `/access/*` and admin APIs under `/api/v1/admin/*` should stay aligned with `AccessService` / `UserManagementService`.\n\nMobile auth creates or returns users via Sanctum, but staff org structure, workload, and fine-grained module permissions are owned here. Optional AI assignment (`ACCESS_AI_ASSIGNMENT`) only influences ticket assign paths — it does not replace role gates.\n\n## Deeper explanation\n\n- **Key concepts:** Roles and permissions catalog in `config/access.php`; optional per-user overrides (`UserPermission`); departments; availability/skills/schedules for assignment; sessions and activity for security ops; Laravel Gates registered from access config.\n- **Invariants:** Side menus and write routes must respect `can` / permission middleware, not only Blade `@if(role)`; default role on register comes from `ACCESS_DEFAULT_ROLE`; activity logging should capture sensitive access changes.\n- **Common pitfalls:** Hard-coding role names in new controllers; granting `permissions` edit without audit; treating customer records here as a full billing CIS substitute; enabling MFA/lockout env flags without testing staff login flows.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Admins / HR-style staff | `/access/users`, `/access/customers`, `/access/support` |\n| Org admins | `/access/departments`, `/roles`, `/permissions` |\n| Security | `/access/sessions`, `/access/activity` |\n| Ops | `/access/availability`, `/assignments`, `/settings`, `/reports` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Admin[Staff_Admin] --> UserWeb[AccessUserWebController]\n  Admin --> OrgWeb[AccessOrgWebController]\n  Api[Admin_API] --> AccessApi[AccessAdminApiController]\n  UserWeb --> UserSvc[UserManagementService]\n  OrgWeb --> AccessSvc[AccessService]\n  AccessApi --> AccessSvc\n  AccessSvc --> Gates[Laravel_Gates]\n  UserSvc --> Users[(users)]\n  AccessSvc --> Roles[(roles_permissions)]\n  AccessSvc --> ActivityLogger\n```\n\n## Process flowchart — grant access\n\n```mermaid\nflowchart TD\n  Create[Create_or_edit_user] --> Role[Assign_role_and_department]\n  Role --> Perms[Optional_user_permission_overrides]\n  Perms --> Save[Persist_via_AccessService]\n  Save --> Gate[AppServiceProvider_registers_gates]\n  Gate --> Menu[Side_menu_and_routes_respect_can]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `Access/AccessUserWebController.php`, `Access/AccessOrgWebController.php` |\n| | `Api/Admin/AccessAdminApiController.php`, `UserController.php` |\n| Models | `User.php`, `Role.php`, `Permission.php`, `UserPermission.php`, `Department.php` |\n| | `UserProfile.php`, `UserAvailability.php`, `UserSchedule.php`, `UserSkill.php` |\n| | `UserActivityLog.php`, `AccessSetting.php` |\n| Services | `Services/Access/AccessService.php`, `UserManagementService.php`, `ActivityLogger.php` |\n| Views | `aselcoph/resources/views/pages/staff/access/*` including `membership-application.blade.php` |\n| Config | `aselcoph/config/access.php` |\n| AI | Optional assignment assist via `ACCESS_AI_ASSIGNMENT` (ticket assign path) |\n\n## Routes / API\n\n### Web (`access.*`)\n\n`/access/users`, `/customers`, `/support`, departments, roles, permissions, sessions, activity, availability, assignments, settings, reports — see `routes/web.php` access group.\n\n### API (`/api/v1`)\n\n| Path | Notes |\n|------|--------|\n| `/admin/users`, `/departments`, `/roles`, `/permissions` | CRUD-ish |\n| `/admin/tickets/{id}/assign\\|reassign` | Assignment |\n| `/support/tickets`, `/support/dashboard`, `/support/profile` | Agent support API |\n\n## Permissions / feature flags\n\nModule catalog in `config/access.php`: `users`, `departments`, `roles`, `permissions`, `settings`, `audit`, `sessions`, plus feature modules (`tickets`, `wallet`, `ai`, …).\n\nEnv: `ACCESS_DEFAULT_ROLE`, lockout, MFA staff, max workload, AI assignment.\n\n## Scenarios\n\n### Scenario A — Create staff user and grant role\n\n- **Actor:** Access admin\n- **Steps:**\n  1. Create/edit user under `/access/users`.\n  2. Assign role and department.\n  3. Optionally set permission overrides; save.\n- **Expected result:** Gates and menus reflect new access; activity log records the change.\n- **Where in code:** `AccessUserWebController` → `UserManagementService` / `AccessService`; `config/access.php`.\n\n### Scenario B — Adjust permission matrix\n\n- **Actor:** Org admin\n- **Steps:**\n  1. Open `/access/permissions` (and roles as needed).\n  2. Toggle module codes (e.g. `tickets.*`, `wallet.*`).\n  3. Verify a test staff session sees updated menus/API authorization.\n- **Expected result:** Middleware `can.permission:*` and catalog codes agree; no orphan routes without a permission story.\n- **Where in code:** `AccessOrgWebController`, `AccessAdminApiController`, Gate registration.\n\n### Scenario C — Agent availability and ticket assign\n\n- **Actor:** Supervisor / assigner\n- **Steps:**\n  1. Set availability under `/access/availability`.\n  2. Use assignments UI or ticket assign/reassign APIs.\n  3. Confirm workload / AI assignment flags behave as configured.\n- **Expected result:** Assignments respect availability and permissions; AI assignment only when `ACCESS_AI_ASSIGNMENT` allows.\n- **Where in code:** Access models `UserAvailability`, `UserSkill`; ticket assign routes under `/admin/tickets/{id}/assign|reassign`.\n\n## Developer discussion\n\n- Did you add new permission codes to `config/access.php` and wire middleware/menus, not only Blade role checks?\n- Are web and `/api/v1/admin/*` authorization rules equivalent for the same action?\n- Sensitive changes (roles, permissions, sessions): is `ActivityLogger` covering them?\n- What is the blast radius if `ACCESS_DEFAULT_ROLE` or MFA/lockout env changes?\n- Do not break: existing staff login, ticket assign pools, wallet load role lists that read access config.\n\n## Related modules\n\n- [Support Workspace](support-workspace.md)\n- [Tickets](tickets.md)\n- [Auth & Profile](auth-profile.md)\n- [Consumers / Billing](consumers-billing.md) — customer records overlap\n","web/ai-assistant.md":"# Web — AI Assistant & Ticket AI\n\n## Purpose\n\nServer-side AI for (1) customer assistant chat on mobile, (2) staff CSR assist, and (3) ticket analysis / draft replies. All OpenAI calls stay in Laravel services — never from the mobile client with an API key. Answers for customer chat are grounded via the [Knowledge / RAG](knowledge-rag.md) pipeline when documents are indexed.\n\nAI is a product layer on top of tickets and knowledge, not a separate app. Mobile only sends user text and receives replies/conversation IDs over `/api/v1/customer/ai/*`. Staff trigger analyze/suggest from ticket Blade screens or admin AI APIs. That design keeps keys, prompt guards, and retrieval policy in `Services/Ai` and `Services/Rag`.\n\nWhen retrieval quality is poor, answers can drift; when escalation is detected, the flow may create or link a ticket instead of looping forever in chat. Feature flags (`AI_ENABLED`, access codes like `ai.chat`) and throttles (`throttle:api-ai`) are first-class controls — treat them as part of the contract when enabling AI in an environment.\n\n## Deeper explanation\n\n- **Key concepts:** Conversations/messages as chat state; `AiAssistantService` as the customer path orchestrator; ticket analyzer vs response assistant as staff helpers; PromptGuard / AiResponseValidator as safety rails; LocalAiFallback when primary completion is unavailable; RAG retrieval as optional grounding, not optional key storage.\n- **Invariants:** No OpenAI key in mobile or Blade JS; staff AI writes go through audited/admin paths where modeled (`AiAdminAuditLog`, request logs); escalation is explicit via detector + escalate endpoints, not silent ticket spam; ticket AI drafts are reviewed before use.\n- **Common pitfalls:** Calling OpenAI from a new controller instead of `OpenAiClient` / contracts; skipping RAG when knowledge is expected; applying ticket priority from analysis without the apply-priority step; forgetting throttle groups on new AI routes.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Members | Mobile `/assistant` → `/api/v1/customer/ai/*` |\n| Ticket staff | `/tickets/ai`, ticket detail AI buttons |\n| Knowledge testers | `/knowledge/chat`, `/knowledge/test` |\n| Admin API | `/api/v1/admin/ai/assist`, `/admin/tickets/{id}/ai/*` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Mobile[Mobile_Assistant] --> CustAi[CustomerAiController]\n  Staff[Staff_Tickets] --> TicketWeb[TicketAdminWebController]\n  AdminApi[Admin_API] --> AdminAi[AdminAiController]\n  AdminApi --> TicketAiApi[AdminTicketAiController]\n  CustAi --> Assist[AiAssistantService]\n  TicketWeb --> Analyzer[TicketAiAnalyzer]\n  TicketWeb --> Drafts[TicketAiResponseAssistant]\n  AdminAi --> Assist\n  TicketAiApi --> Analyzer\n  Assist --> Rag[KnowledgeRetriever]\n  Assist --> OpenAI[OpenAiClient]\n  Analyzer --> OpenAI\n  Drafts --> OpenAI\n```\n\n## Process flowchart — customer chat\n\n```mermaid\nflowchart TD\n  Msg[Customer_message] --> Guard[PromptGuard]\n  Guard --> Ctx[CustomerContextBuilder]\n  Ctx --> Retrieve[RAG_retrieve_chunks]\n  Retrieve --> Complete[OpenAI_or_LocalAiFallback]\n  Complete --> Validate[AiResponseValidator]\n  Validate --> Save[Save_AiMessage]\n  Save --> Escalate{Needs_escalate}\n  Escalate -->|yes| Ticket[Create_or_link_ticket]\n  Escalate -->|no| Reply[Return_reply]\n```\n\n## Process flowchart — ticket AI assist\n\n```mermaid\nflowchart TD\n  Open[Staff_opens_ticket] --> Analyze[POST_ai_analyze]\n  Analyze --> Store[Store_TicketAiAnalysis]\n  Store --> Apply{Apply_priority}\n  Apply -->|yes| Priority[Update_ticket_priority]\n  Suggest[POST_suggest_response] --> Draft[Store_TicketAiResponseDraft]\n  Draft --> Review[Staff_reviews_draft]\n  Review --> Use[Use_or_edit_reply]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `Api/V1/CustomerAiController.php` |\n| | `Api/Admin/AdminAiController.php` |\n| | `Api/Admin/AdminTicketAiController.php` |\n| | AI actions also on `TicketAdminWebController.php`, `KnowledgeAdminWebController.php` |\n| Models | `AiConversation.php`, `AiMessage.php`, `AiRequestLog.php`, `AiAdminAuditLog.php` |\n| | `TicketAiAnalysis.php`, `TicketAiResponseDraft.php` |\n| Services (`Services/Ai/`) | `AiAssistantService.php`, `OpenAiClient.php` |\n| | `TicketAiAnalyzer.php`, `TicketAiResponseAssistant.php` |\n| | `ConversationCoach.php`, `EscalationDetector.php`, `CustomerContextBuilder.php` |\n| | `LocalAiFallback.php`, `PromptGuard.php`, `AiResponseValidator.php` |\n| | `Contracts/AiCompletionClient.php` |\n| RAG link | `Services/Rag/*` (see Knowledge doc) |\n| Config | `aselcoph/config/ai.php` (`AI_ENABLED`, OpenAI keys/models) |\n| Views | Ticket AI dashboard under `pages/staff/tickets/`; knowledge chat under `pages/staff/knowledge/` |\n\n## Routes / API\n\n| Surface | Paths |\n|---------|--------|\n| Web | `GET /tickets/ai`; `POST /tickets/{id}/ai/analyze\\|apply-priority\\|suggest-response`; draft review |\n| | Knowledge chat: `/knowledge/chat`, `/knowledge/test` |\n| API customer | `GET /customer/ai/bootstrap`; `POST /chat`, `/inquiry`, `/search`, `/escalate` |\n| | `GET\\|DELETE /customer/ai/conversations[/{id}]` |\n| API admin | `POST /admin/ai/assist`; `/admin/tickets/.../ai/*`; `GET /admin/tickets/ai/dashboard` |\n\n## Permissions / feature flags\n\n| Key | Notes |\n|-----|--------|\n| `ai.chat`, `ai.ticket-analysis.view`, `ai.response-suggestions` | Staff AI features |\n| `ai.knowledge.manage`, `ai.settings.manage` | Knowledge / settings |\n| `AI_ENABLED` | Master toggle in `config/ai.php` |\n| `ACCESS_AI_ASSIGNMENT` | Optional AI-assisted ticket assignment |\n| Throttle | `throttle:api-ai` on AI API groups |\n\n## Scenarios\n\n### Scenario A — Member chats with the assistant\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. App loads bootstrap via `GET /customer/ai/bootstrap`.\n  2. User sends a message via `POST .../chat` (or inquiry/search as implemented).\n  3. Optional escalate via `POST .../escalate` when human handoff is needed.\n- **Expected result:** Reply returned after guard → context → RAG → completion → validate → save; no API key leaves the server.\n- **Where in code:** `CustomerAiController` → `AiAssistantService`, `PromptGuard`, `KnowledgeRetriever`, `OpenAiClient`.\n\n### Scenario B — Staff analyzes a ticket and applies priority\n\n- **Actor:** Ticket staff with AI analysis permission\n- **Steps:**\n  1. Open ticket detail; `POST /tickets/{id}/ai/analyze`.\n  2. Review stored `TicketAiAnalysis`.\n  3. Optionally `POST .../ai/apply-priority`.\n- **Expected result:** Analysis persisted; priority changes only on apply; request/audit logs updated as designed.\n- **Where in code:** `TicketAdminWebController` / `AdminTicketAiController` → `TicketAiAnalyzer`; model `TicketAiAnalysis`.\n\n### Scenario C — Suggest reply draft\n\n- **Actor:** Ticket staff with response-suggestions\n- **Steps:**\n  1. `POST .../ai/suggest-response`.\n  2. Review `TicketAiResponseDraft` on the ticket AI UI.\n  3. Edit and send as a normal ticket reply (human-owned).\n- **Expected result:** Draft stored for review; not auto-posted as the customer-facing message without staff action.\n- **Where in code:** `TicketAiResponseAssistant`; views under `pages/staff/tickets/`.\n\n## Developer discussion\n\n- Does any client-visible code path expose OpenAI keys or bypass `OpenAiClient` / `AiCompletionClient`?\n- Are PromptGuard + AiResponseValidator still on the customer chat path after this change?\n- How does this behave when `AI_ENABLED` is false or RAG returns zero hits?\n- Ticket AI: is apply-priority gated separately from analyze, and are drafts clearly non-final?\n- Cost/abuse: are new endpoints under `throttle:api-ai` and the right `ai.*` permission codes?\n\n## Related modules\n\n- [Knowledge / RAG](knowledge-rag.md) — grounding source\n- [Tickets](tickets.md)\n- [Mobile AI Assistant](../mobile/ai-assistant.md)\n- Repo notes: `AI-Knowledge.md`, `AI-Knowledge-Structure.md` at repo root\n","web/announcements.md":"# Web — Announcements & Push Dispatch\n\n## Purpose\n\nStaff create, preview audience, and publish mobile announcements. Publishing resolves the audience, writes in-app notifications, and can dispatch FCM push (and SMS where configured) to registered devices.\n\nAnnouncements are the broadcast channel for outages, reminders, and coop-wide messages. Staff author and preview on Blade; members receive via FCM and the notifications inbox API. Device tokens are registered from mobile boot (`POST /api/v1/devices`), so publish without tokens is a silent no-op for push even if in-app rows are written.\n\nKeep publishing in `AnnouncementPublisher` + audience resolver + `NotificationDispatchService` so web UI never talks to FCM directly. Preferences (`NotificationPreference`) and admin notification APIs exist so members can opt down noise without staff bypassing the publisher pipeline.\n\n## Deeper explanation\n\n- **Key concepts:** Draft → preview audience → publish; audience resolution to user set; `AppNotification` rows for in-app; FCM via `FcmPushService` using `device_tokens`; optional SMS via `SmsDeliveryService`.\n- **Invariants:** Preview should not send; publish is the side-effecting step; token registration is member-owned (`DeviceTokenController`); staff should not invent ad-hoc FCM sends outside dispatch services for announcement content.\n- **Common pitfalls:** Publishing without preview on large audiences; missing Firebase/env config then assuming “push broken in app”; duplicating announcement text into unrelated notification writers; ignoring preference endpoints when adding new notification types.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Staff publishers | `/announcements`, create/edit/publish |\n| Members | Mobile push + (eventually) notifications inbox |\n| Devices | `POST /api/v1/devices` from mobile boot |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff_Web] --> AnnCtrl[AnnouncementController]\n  AnnCtrl --> Publisher[AnnouncementPublisher]\n  Publisher --> Audience[AnnouncementAudienceResolver]\n  Publisher --> Dispatch[NotificationDispatchService]\n  Dispatch --> Fcm[FcmPushService]\n  Dispatch --> Sms[SmsDeliveryService]\n  Dispatch --> Notif[(app_notifications)]\n  Mobile[Mobile_App] --> Devices[DeviceTokenController]\n  Devices --> Tokens[(device_tokens)]\n  Fcm --> Tokens\n```\n\n## Process flowchart — publish\n\n```mermaid\nflowchart TD\n  Draft[Create_announcement] --> Preview[Preview_audience]\n  Preview --> Publish[POST_publish]\n  Publish --> Resolve[Resolve_target_users]\n  Resolve --> Write[Write_AppNotification_rows]\n  Write --> Push[FCM_to_device_tokens]\n  Push --> Done[Published]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `AnnouncementController.php` |\n| | `Api/V1/NotificationController.php`, `DeviceTokenController.php`, `NotificationPreferenceController.php` |\n| Models | `Announcement.php`, `AppNotification.php`, `NotificationPreference.php`, `DeviceToken.php` |\n| Services | `AnnouncementPublisher.php`, `AnnouncementAudienceResolver.php` |\n| | `NotificationDispatchService.php`, `FcmPushService.php`, `SmsDeliveryService.php` |\n| Views | `aselcoph/resources/views/pages/staff/announcements/*` |\n| AI | None |\n\n## Routes / API\n\n### Web\n\n`GET/POST /announcements`, create, edit, show, `preview-audience`, `publish`, `search-users`.\n\n### API (`/api/v1`)\n\n| Path | Notes |\n|------|--------|\n| `POST\\|DELETE /devices` (and `/device-tokens`) | Register push token |\n| `GET /notifications`, mark read / read-all | Inbox API |\n| `GET\\|PUT /notification-preferences` | Preferences |\n| `/admin/notifications/*` | Staff notification API |\n\n## Permissions / feature flags\n\n- `notifications.view` in access catalog\n- FCM credentials via env / Firebase config used by `FcmPushService`\n\n## Scenarios\n\n### Scenario A — Staff publishes after audience preview\n\n- **Actor:** Staff publisher\n- **Steps:**\n  1. Create announcement under `/announcements`.\n  2. Run `preview-audience` and confirm target set.\n  3. Publish.\n- **Expected result:** `AppNotification` rows created for targets; FCM attempted for registered tokens; SMS only if configured for that path.\n- **Where in code:** `AnnouncementController` → `AnnouncementPublisher` → `AnnouncementAudienceResolver` → `NotificationDispatchService`.\n\n### Scenario B — Mobile registers device then receives push\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. App registers token via `POST /api/v1/devices`.\n  2. Staff publishes an announcement targeting that user.\n  3. Member sees push and/or inbox via `GET /notifications`.\n- **Expected result:** Token stored; dispatch finds token; mark-read works on inbox API.\n- **Where in code:** `DeviceTokenController`, `FcmPushService`, `NotificationController`.\n\n### Scenario C — Member updates notification preferences\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. `GET /notification-preferences`.\n  2. `PUT` updated preferences.\n  3. Subsequent publishes/dispatches respect preference rules as implemented.\n- **Expected result:** Preferences persisted; dispatch path consults them rather than ignoring the API.\n- **Where in code:** `NotificationPreferenceController`, `NotificationPreference` model, dispatch services.\n\n## Developer discussion\n\n- Does publish still go through `AnnouncementPublisher` / `NotificationDispatchService` with no direct FCM calls from the controller?\n- Preview vs publish: are side effects impossible on preview?\n- How are missing/invalid device tokens handled (cleanup vs retry)?\n- Permissions: who can publish vs only `notifications.view`?\n- Do not break: device register/delete endpoints and mark-read inbox behavior used by mobile.\n\n## Related modules\n\n- [Mobile Notifications](../mobile/notifications.md)\n- [Tickets](tickets.md) — ticket events may also notify\n- [Support Workspace](support-workspace.md)\n","web/ast-wallet.md":"# Web — AST Wallet (ASELCO Token)\n\n## Purpose\n\nClosed-loop internal credit for members. **1 AST ≈ ₱1** (`config/ast.php` → `php_per_ast`). Staff load AST onto a customer wallet; members spend AST to pay electric bills from mobile. Loads at or above the approval threshold use maker-checker. Bill payments can be posted to CIS via a staff queue.\n\nNot cash, not withdrawable, not transferable between customers. One wallet per member (`users.id`), even if they have multiple electric accounts.\n\nAST exists so ASELCO can offer prepaid-style bill settlement without treating tokens as bank money. Staff control supply through load (and optional adjust) paths; members only debit via pay-bill. That split keeps treasury-like operations on the Blade admin surface while spend UX lives on mobile.\n\nWeb admin and admin API call the same domain services (`AstWalletService`, ledger helpers). Mobile never talks to CIS directly: it hits `/api/v1/customer/wallet/*`, and staff later post queued payments from `/ast/cis-queue`. Concurrency and audit rules are stricter than typical CRUD — see the deeper table contract linked below.\n\nDeeper table/concurrency contract: [aselcoph/docs/ast-wallet-architecture.md](../../aselcoph/docs/ast-wallet-architecture.md).\n\n## Deeper explanation\n\n- **Key concepts:** Wallet balance is the source of truth for spendable AST; `wallet_transactions` are the audit trail; `wallet_load_requests` hold pending maker-checker loads; CIS queue is an ops follow-up after a successful mobile pay, not part of the debit itself.\n- **Invariants:** No peer-to-peer transfer; one wallet per user; pay-bill requires an Idempotency-Key; loads at/above `AST_LOAD_APPROVAL_THRESHOLD` must not credit until a second staffer approves; prefer Phase-1 `Wallet*` models over legacy `AstWallet*` / `AstLedgerEntry*` paths.\n- **Common pitfalls:** Treating AST like withdrawable cash in copy or product rules; skipping row locks / idempotency on pay; inventing alternate balance math outside `AstWalletService`; posting CIS before the wallet debit succeeds; mixing legacy Ast* tables with Phase-1 wallet tables in new code.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Staff with wallet load rights | Side menu → AST admin (`/ast/admin/dashboard`, `/ast/admin/load`) |\n| Staff (read / CIS) | `/ast/wallet`, `/ast/cis-queue` |\n| Approvers | `/ast/admin/load-requests` |\n| Members | Mobile wallet + Pay (see [mobile AST](../mobile/ast-wallet.md), [Pay](../mobile/pay-with-ast.md)) |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff_Web] --> AstAdmin[AstAdminWebController]\n  Staff --> AstWallet[AstWalletAdminController]\n  Mobile[Mobile_App] --> CustWallet[CustomerWalletController]\n  AstAdmin --> AstSvc[AstWalletService]\n  AstWallet --> AstSvc\n  CustWallet --> AstSvc\n  AstSvc --> Wallet[(wallets)]\n  AstSvc --> Txn[(wallet_transactions)]\n  AstSvc --> LoadReq[(wallet_load_requests)]\n  AstWallet --> CisQueue[CIS_post_queue]\n```\n\n## Process flowchart — load AST (maker-checker)\n\n```mermaid\nflowchart TD\n  Start[Staff_submits_load] --> CheckAmt{Amount_vs_threshold}\n  CheckAmt -->|below| Credit[Credit_wallet_now]\n  CheckAmt -->|at_or_above| Queue[Create_wallet_load_request]\n  Queue --> Approver[Second_staff_approves_or_rejects]\n  Approver -->|approve| Credit\n  Approver -->|reject| DoneReject[Request_rejected]\n  Credit --> Audit[Write_audit_log]\n  Audit --> Done[Done]\n```\n\n## Process flowchart — pay bill with AST\n\n```mermaid\nflowchart TD\n  Pay[Mobile_pay_bill] --> Idem[Require_Idempotency_Key]\n  Idem --> Lock[Lock_wallet_row]\n  Lock --> Validate{Balance_and_bill_OK}\n  Validate -->|no| Err[Return_AST_error_code]\n  Validate -->|yes| Debit[Insert_payment_txn]\n  Debit --> UpdateBal[Update_wallet_balance]\n  UpdateBal --> Cis[Queue_or_await_CIS_post]\n  Cis --> Done[Return_success]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers (web) | `aselcoph/app/Http/Controllers/AstAdminWebController.php` |\n| | `aselcoph/app/Http/Controllers/AstWalletAdminController.php` |\n| Controllers (API) | `aselcoph/app/Http/Controllers/Api/Admin/AdminWalletController.php` |\n| | `aselcoph/app/Http/Controllers/Api/V1/CustomerWalletController.php` |\n| | `aselcoph/app/Http/Controllers/Api/V1/WalletController.php` |\n| | `aselcoph/app/Http/Controllers/Api/V1/LedgerController.php` (billing ledger, related) |\n| Models | `Wallet.php`, `WalletTransaction.php`, `WalletLoadRequest.php`, `WalletAuditLog.php` |\n| | Legacy/first-pass: `AstWallet.php`, `AstLedgerEntry.php`, `AstAuditLog.php` (prefer Phase-1 Wallet* tables) |\n| Services | `aselcoph/app/Services/AstWalletService.php` |\n| | `aselcoph/app/Services/WalletLedgerService.php` |\n| Views | `aselcoph/resources/views/pages/staff/ast/*` |\n| | `aselcoph/resources/views/pages/staff/ast-cis-queue.blade.php` |\n| Config | `aselcoph/config/ast.php` |\n| AI | None directly |\n\n## Routes / API\n\n### Web\n\n| Method | Path | Name / notes |\n|--------|------|----------------|\n| GET | `/ast/admin/dashboard` | `ast.admin.dashboard` |\n| GET/POST | `/ast/admin/load` | Load form / submit |\n| POST | `/ast/admin/adjust` | Adjustment |\n| GET/POST | `/ast/admin/request` | Support load request |\n| GET | `/ast/admin/load-requests` | Maker-checker queue |\n| POST | `/ast/admin/load-requests/{id}/approve\\|reject` | Approve / reject |\n| GET | `/ast/admin/customer/{userId}` | Customer wallet detail |\n| GET | `/ast/wallet` | Wallet admin show |\n| POST | `/ast/load` | Load shortcut |\n| GET | `/ast/cis-queue` | CIS posting queue |\n| POST | `/ast/payments/{id}/post-cis` | Post payment to CIS |\n\n### API (`/api/v1`)\n\n| Method | Path | Notes |\n|--------|------|--------|\n| GET | `/customer/wallet/balance` | Mobile primary |\n| GET | `/customer/wallet/transactions` | Mobile primary |\n| POST | `/customer/wallet/pay-bill` | Requires Idempotency-Key |\n| GET | `/wallet`, `/wallet/transactions` | Alternate wallet API |\n| POST | `/wallet/pay` | Alternate pay |\n| GET/POST | `/admin/wallet/*` | Admin load / approve (`can.load-wallet`) |\n\n## Permissions / feature flags\n\n| Key | Source |\n|-----|--------|\n| `wallet.view`, `wallet.load`, `wallet.approve`, `wallet.transactions.view`, `wallet.audit.view` | `config/access.php` |\n| Middleware `can.load-wallet` | Admin wallet API |\n| `AST_PHP_RATE` | Rate (default 1) |\n| `AST_LOAD_APPROVAL_THRESHOLD` | Default 10000 AST |\n| `AST_MAX_LOAD_AMOUNT` | Cap |\n| `AST_LOAD_WALLET_ROLES` | Roles allowed to load |\n\n## Scenarios\n\n### Scenario A — Staff loads below approval threshold\n\n- **Actor:** Staff with `wallet.load`\n- **Steps:**\n  1. Open `/ast/admin/load` and select the member.\n  2. Enter an amount under `AST_LOAD_APPROVAL_THRESHOLD`.\n  3. Submit the load.\n- **Expected result:** Wallet is credited immediately; a transaction and audit entry appear; no pending load request.\n- **Where in code:** `AstAdminWebController` → `AstWalletService`; views under `pages/staff/ast/*`; config `config/ast.php`.\n\n### Scenario B — Large load requires maker-checker\n\n- **Actor:** Loader + second-staff approver (`wallet.approve`)\n- **Steps:**\n  1. Loader submits a load at or above the threshold.\n  2. Approver opens `/ast/admin/load-requests`.\n  3. Approver approves (or rejects) the request.\n- **Expected result:** On approve, balance increases and audit is written; on reject, balance unchanged and request marked rejected. Same staffer should not both make and check when policy forbids it.\n- **Where in code:** Load-request routes on `AstAdminWebController`; models `WalletLoadRequest`, `WalletAuditLog`; middleware/permissions `wallet.approve`.\n\n### Scenario C — Member pays a bill with AST\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. App calls `POST /api/v1/customer/wallet/pay-bill` with Idempotency-Key.\n  2. Service locks wallet, validates balance and bill, inserts payment txn, updates balance.\n  3. Staff later posts to CIS from `/ast/cis-queue` if needed.\n- **Expected result:** Debit succeeds once; retries with the same key do not double-charge; CIS post is a separate staff action.\n- **Where in code:** `CustomerWalletController` → `AstWalletService`; CIS via `AstWalletAdminController` / `ast-cis-queue.blade.php`.\n\n## Developer discussion\n\n- Does this change keep all balance mutations inside `AstWalletService` (or documented ledger helpers), with no ad-hoc SQL in controllers?\n- Are maker-checker, max load, and permission checks covered for amounts around `AST_LOAD_APPROVAL_THRESHOLD`?\n- For pay-bill: is Idempotency-Key enforced, and what happens on concurrent double-submit?\n- Could this PR write or “fix” historical `wallet_transactions` rows instead of appending?\n- Security: who can `wallet.approve` / `can.load-wallet`, and can a loader self-approve?\n\n## Related modules\n\n- [Mobile AST Wallet](../mobile/ast-wallet.md)\n- [Mobile Pay with AST](../mobile/pay-with-ast.md)\n- [Consumers / Billing](consumers-billing.md) — account + bill data\n- [Ledger (mobile)](../mobile/ledger.md)\n- [Dashboard](dashboard.md)\n","web/auth-profile.md":"# Web — Auth & Profile\n\n## Purpose\n\nStaff and customer web authentication via Laravel Fortify/Jetstream (login, register, email verify, 2FA, profile). Google OAuth is available for web. Mobile uses a separate Sanctum token API (`Api/V1/AuthController`) documented under [mobile Auth](../mobile/auth.md).\n\nAuth is the front door for both portals, but the session model differs: web relies on Fortify/Jetstream cookies/sessions (plus optional Google OAuth and 2FA); mobile uses personal access tokens from `/api/v1/auth/*`. Both ultimately bind to `users`. Profile management on web is Jetstream’s `/user/profile`; mobile uses `/auth/user` and related membership flows.\n\nAccess defaults (`ACCESS_DEFAULT_ROLE`) and optional staff MFA (`ACCESS_MFA_STAFF`) connect this module to User Management. Do not reuse mobile token issuance for Blade pages or put Google OAuth secrets in the mobile app — keep providers under `aselcoph/app/Providers/` and `Auth/GoogleController.php`.\n\n## Deeper explanation\n\n- **Key concepts:** Fortify/Jetstream feature flags; email verification gate; Google OAuth callback linking/creating users; Sanctum PATs for mobile; logout vs logout-all on API.\n- **Invariants:** Unverified web users hit verification notice before role dashboards; mobile bearer tokens are revoked on logout/logout-all as implemented; Google callback only on web routes `/auth/google*`.\n- **Common pitfalls:** Sharing one login UX assumption across web and mobile; disabling Jetstream 2FA/verify in config without updating ops runbooks; creating users in OAuth without the intended default role; treating API `/user` as a place to dump staff permission matrices (use Access APIs for that).\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Staff / customers (web) | Jetstream login, `/user/profile` |\n| Google users | `/auth/google`, `/auth/google/callback` |\n| Email verify | `/email/verify*` |\n| Mobile members | `/api/v1/auth/*` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Browser[Web_Browser] --> Fortify[Fortify_Jetstream]\n  Browser --> Google[GoogleController]\n  Mobile[Mobile_App] --> AuthApi[AuthController_V1]\n  Fortify --> Users[(users)]\n  Google --> Users\n  AuthApi --> Sanctum[Personal_access_tokens]\n  Sanctum --> Users\n```\n\n## Process flowchart — web login\n\n```mermaid\nflowchart TD\n  Visit[Visit_login] --> Creds{Credentials_or_Google}\n  Creds -->|password| Fortify[Fortify_authenticate]\n  Creds -->|Google| OAuth[Google_OAuth_callback]\n  Fortify --> Verify{Email_verified}\n  OAuth --> Verify\n  Verify -->|no| Resend[Verification_notice]\n  Verify -->|yes| Dash[Role_dashboard]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `Auth/GoogleController.php`, `Api/V1/AuthController.php` |\n| Providers | Jetstream/Fortify service providers under `aselcoph/app/Providers/` |\n| Models | `User.php` (+ Jetstream traits) |\n| Views | Jetstream views under `resources/views` (auth, profile, 2FA) |\n| Services / AI | None dedicated |\n\n## Routes / API\n\n### Web\n\n| Path | Notes |\n|------|--------|\n| Fortify/Jetstream routes | Login, register, password, 2FA, profile |\n| `/auth/google`, `/auth/google/callback` | Google OAuth |\n| `/email/verify`, `/email/verify/{id}/{hash}` | Verification |\n| `/user/profile` | Profile |\n\n### API (`/api/v1/auth`)\n\n| Method | Path |\n|--------|------|\n| POST | `/register`, `/login` |\n| POST | `/logout`, `/logout-all` (auth) |\n| GET | `/user` (auth) |\n| POST | `/email/resend` |\n\n## Permissions / feature flags\n\n- Jetstream features in `config/jetstream.php` / Fortify\n- Access default role on register: `ACCESS_DEFAULT_ROLE`\n- Optional `ACCESS_MFA_STAFF`\n\n## Scenarios\n\n### Scenario A — Staff password login with verification\n\n- **Actor:** Staff or customer web user\n- **Steps:**\n  1. Visit login; submit credentials via Fortify.\n  2. If email unverified, land on verification notice / resend.\n  3. After verify, reach role dashboard.\n- **Expected result:** Session established only when Fortify + verification rules pass.\n- **Where in code:** Fortify/Jetstream providers and views; dashboard routing after login.\n\n### Scenario B — Google OAuth on web\n\n- **Actor:** Web user\n- **Steps:**\n  1. Hit `/auth/google`.\n  2. Complete provider consent; return on `/auth/google/callback`.\n  3. Land verified/dashboard path per account state.\n- **Expected result:** User linked/created in `users`; no mobile token issued from this path.\n- **Where in code:** `Auth/GoogleController.php`.\n\n### Scenario C — Mobile register/login/logout\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. `POST /api/v1/auth/register` or `/login`.\n  2. Call `GET /auth/user` with bearer token.\n  3. `POST /logout` or `/logout-all`.\n- **Expected result:** PAT issued and later revoked as designed; web session untouched.\n- **Where in code:** `Api/V1/AuthController.php`; Sanctum personal access tokens.\n\n## Developer discussion\n\n- Web vs mobile: are you changing the correct stack (Fortify session vs Sanctum PAT)?\n- Default role / MFA env flags: regression impact on new registrations and staff login?\n- Email verification and `/email/resend` still enforced where product requires it?\n- Google OAuth: account takeover cases (email already registered) handled safely?\n- Do not break: `/user/profile` Jetstream flows and mobile logout-all for stolen-device response.\n\n## Related modules\n\n- [Mobile Auth](../mobile/auth.md)\n- [Access / User Management](access-user-management.md)\n- [Dashboard](dashboard.md)\n- [Membership (mobile)](../mobile/membership.md)\n","web/calendar.md":"# Web — Calendar\n\n## Purpose\n\nStaff calendar for internal activities/events (create, update, delete). Simple CRUD over `CalendarEvent` — not customer-facing on mobile.\n\nThe calendar gives authenticated staff a shared place for internal schedules (meetings, field ops notes, coop events) without standing up a separate SaaS calendar. It is intentionally thin: one controller, one model, Blade UI plus JSON endpoints for the same events.\n\nThere is no `/api/v1` calendar surface for members. If product later needs member-visible schedules, that would be a new contract — do not overload this staff CRUD. Auth is session-based via the Jetstream/Sanctum verified web group; there is no fine-grained `calendar.*` code in `config/access.php` beyond login.\n\n## Deeper explanation\n\n- **Key concepts:** `CalendarEvent` rows; `/calendar` view; `/calendar-events` JSON CRUD for the UI.\n- **Invariants:** Staff-only; mutations are ordinary REST-ish POST/PUT/DELETE on `/calendar-events/{event}`; no mobile consumer API.\n- **Common pitfalls:** Assuming role-based calendar ACLs that do not exist; exposing events on public routes; adding heavy business logic in the Blade instead of keeping CRUD clear; coupling ticket SLAs to calendar events without an explicit design.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Authenticated staff | `/calendar` UI, `/calendar-events` JSON |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff_Browser] --> CalCtrl[CalendarEventController]\n  CalCtrl --> Events[(calendar_events)]\n  CalCtrl --> View[calendar_blade]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Open[Open_calendar] --> Load[GET_calendar_events]\n  Load --> Render[Render_events]\n  Render --> Edit{Create_update_delete}\n  Edit --> Persist[POST_PUT_DELETE]\n  Persist --> Load\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controller | `aselcoph/app/Http/Controllers/CalendarEventController.php` |\n| Model | `aselcoph/app/Models/CalendarEvent.php` |\n| Views | `aselcoph/resources/views/pages/staff/calendar.blade.php` |\n| Services / AI | None dedicated |\n\n## Routes / API\n\n| Method | Path |\n|--------|------|\n| GET | `/calendar` (`calendar.view`) |\n| GET | `/calendar-events` |\n| POST | `/calendar-events` |\n| PUT | `/calendar-events/{event}` |\n| DELETE | `/calendar-events/{event}` |\n\nNo mobile `/api/v1` calendar endpoints.\n\n## Permissions / feature flags\n\nAuthenticated session (`auth:sanctum` + Jetstream verified group in `web.php`). No separate access module code beyond login.\n\n## Scenarios\n\n### Scenario A — Staff creates an event\n\n- **Actor:** Authenticated staff\n- **Steps:**\n  1. Open `/calendar`.\n  2. Create via UI → `POST /calendar-events`.\n  3. Confirm event appears after `GET /calendar-events` refresh.\n- **Expected result:** New `CalendarEvent` persisted and rendered.\n- **Where in code:** `CalendarEventController`; `calendar.blade.php`; model `CalendarEvent`.\n\n### Scenario B — Update and delete\n\n- **Actor:** Authenticated staff\n- **Steps:**\n  1. Select an existing event.\n  2. `PUT /calendar-events/{event}` with changes.\n  3. `DELETE /calendar-events/{event}` when done.\n- **Expected result:** Updates persist; delete removes from subsequent GETs.\n- **Where in code:** Same controller/model routes as above.\n\n### Scenario C — Unauthenticated or mobile client\n\n- **Actor:** Anonymous browser or mobile app\n- **Steps:**\n  1. Attempt `/calendar` without session.\n  2. Search for `/api/v1` calendar endpoints (none).\n- **Expected result:** Web redirects/denies per auth middleware; mobile has no calendar API.\n- **Where in code:** `web.php` auth group; absence of calendar routes in `api.php`.\n\n## Developer discussion\n\n- If adding ACLs, will you introduce real `config/access.php` codes instead of implicit “any logged-in staff”?\n- Validation: date ranges, required fields, XSS in event titles/descriptions?\n- Is JSON and Blade still sharing one controller path without divergent rules?\n- Do not accidentally publish calendar routes outside the authenticated group.\n- Keep mobile free of this module unless product explicitly adds a v1 contract.\n\n## Related modules\n\n- [Dashboard](dashboard.md)\n- [Support Workspace](support-workspace.md)\n","web/cms-blog.md":"# Web — CMS / Blog / Pages (legacy, still routed)\n\n## Purpose\n\nInternal content management for articles (`ublog`), static pages, and menu builder. Still used by the **Content Manager** role menu; blog links are often commented out of the main admin menu but routes remain active.\n\nCMS/blog predates the ticket/AI/knowledge stack and still serves coop content and static pages (`/page/about-us`, `/page/history`, public blog URLs). Content Managers edit via `/ublog`, `/pages`, and `/menus`. It is web-centric legacy MVC (`postController`, `blogController`, …) — not part of the mobile `/api/v1` product surface.\n\nTreat changes carefully: naming is inconsistent (`postModel` / `blogModel`), and access is role-menu based (`components/menu/cms.blade.php`) rather than fine-grained `config/access.php` codes. Prefer not to invent a second CMS; if you only need policy Q&A for the assistant, use Knowledge/RAG instead.\n\n## Deeper explanation\n\n- **Key concepts:** ublog articles (including PDF fields in the publish flow); static pages; menus / menu-items builder; public read URLs vs editor URLs.\n- **Invariants:** Routes remain even when admin menu links are commented out; Content Manager menu is the primary gate; public `/blog/{id}/{slug}` and `/page/*` are intentionally reachable without staff session (as routed today).\n- **Common pitfalls:** “Cleaning up” by deleting routes still used in bookmarks; mixing Knowledge documents with ublog posts; assuming `config/access.php` module codes protect CMS writes; breaking menu builder JSON while editing Blade.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Content Manager | `/ublog`, `/pages`, `/menus`, menu builder |\n| Public (limited) | `/blog/{id}/{slug}`, `/page/about-us`, `/page/history` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Editor[Content_Manager] --> Posts[postController]\n  Editor --> Blog[blogController]\n  Editor --> Pages[pagesController]\n  Editor --> Menus[MenuController]\n  Posts --> PostModel[(postModel)]\n  Blog --> BlogModel[(blogModel)]\n  Menus --> Menu[(menus_menu_items)]\n```\n\n## Process flowchart — publish article\n\n```mermaid\nflowchart TD\n  New[ublog_new] --> Edit[Fill_content_and_PDF]\n  Edit --> Save[POST_ublog_save]\n  Save --> List[ublog_index_datatable]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `postController.php`, `blogController.php`, `pagesController.php` |\n| | `MenuController.php`, `MenuItemController.php` |\n| Models | `postModel.php`, `blogModel.php`, `Menu.php`, `MenuItem.php` |\n| Views | `resources/views/cms/`, `pages/page/`, `components/menu/cms.blade.php` |\n| Services / AI | None |\n\n## Routes\n\n| Area | Paths |\n|------|--------|\n| Blog posts | `/ublog`, `/ublog/new`, `/ublog/edit/{id}`, save/update |\n| Pages | `/pages`, `/pages/new`, public `/page/*` |\n| Menus | `/menus`, builder, `menu-items/*` |\n| Admin blog create | `/admin/new-blog` |\n\n## Permissions / feature flags\n\nRole-based Content Manager menu (`components/menu/cms.blade.php`), not fine-grained `config/access.php` module codes.\n\n## Scenarios\n\n### Scenario A — Content Manager publishes ublog article\n\n- **Actor:** Content Manager\n- **Steps:**\n  1. Open `/ublog/new` from CMS menu.\n  2. Fill content (and PDF if used); save.\n  3. Confirm row in `/ublog` datatable; optional public `/blog/{id}/{slug}`.\n- **Expected result:** Article stored via post/blog controllers/models; listed for editors.\n- **Where in code:** `postController` / `blogController`; views under `resources/views/cms/`.\n\n### Scenario B — Edit static page\n\n- **Actor:** Content Manager\n- **Steps:**\n  1. Open `/pages` / `/pages/new` as needed.\n  2. Update about/history style content.\n  3. View public `/page/about-us` or `/page/history`.\n- **Expected result:** Public page reflects save; no staff session required on public GET.\n- **Where in code:** `pagesController`; `pages/page/` views.\n\n### Scenario C — Menu builder change\n\n- **Actor:** Content Manager\n- **Steps:**\n  1. Open `/menus` and builder / `menu-items/*`.\n  2. Add or reorder items; save.\n  3. Verify rendered menus for affected roles/pages.\n- **Expected result:** `Menu` / `MenuItem` persistence; CMS menu component still loads.\n- **Where in code:** `MenuController`, `MenuItemController`; `components/menu/cms.blade.php`.\n\n## Developer discussion\n\n- Is this change truly CMS, or should it live in Knowledge/RAG / Announcements instead?\n- Public vs editor routes: any new write endpoint left unauthenticated?\n- Role menu gate only — acceptable risk, or should this move to `config/access.php`?\n- File/PDF uploads: storage path and validation consistent with File Manager expectations?\n- Do not remove routed `/ublog` or `/page/*` paths without a redirect/content migration plan.\n\n## Related modules\n\n- [File Manager](file-manager.md) — media storage overlap\n- [Dashboard](dashboard.md)\n","web/consumers-billing.md":"# Web — Consumers, Account Linking & Billing\n\n## Purpose\n\nLink electric service accounts to app users, validate account requests, upload billing CSV data, and manage the consumer list. This data powers mobile membership gating, dashboard balances, ledger history, and AST bill pay matching.\n\nWithout a verified account link, mobile membership stays gated and wallet pay cannot reliably match a bill to a member. Staff own validation and CSV billing upload on web; members complete linking flows on mobile (and some customer web registration paths). Billing rows (`t_account_raw` / uploads) feed ledger and dashboard summary APIs — they are not edited from the mobile client.\n\nTreat this module as shared master data between Access customer lists, AST pay, and Home/Ledger. Prefer existing controllers (`CustomerController`, `AccountLinkController`, `BillingUploadController`, membership/ledger/dashboard API controllers) over parallel stores. Legacy complaint pages may still sit nearby but tickets are the modern case system.\n\n## Deeper explanation\n\n- **Key concepts:** Consumer/customer records; account validation; `AccountLink` as the user↔service-account bridge; billing CSV upload into raw/upload tables; membership status as the mobile gate; ledger/dashboard as read models over billing + links.\n- **Invariants:** A usable membership requires successful/approved links per product rules; billing upload is staff-only; mobile ledger/dashboard are read APIs; AST pay must resolve bills against linked accounts/billing data, not invent account numbers client-side.\n- **Common pitfalls:** Approving links without validation; uploading CSV with silent parse failures; assuming `/consumer/list` is CIS source of truth; mixing legacy `/complaints/*` into new ticket work.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Staff | `/access/customers`, `/access/customers/{id}`, `/validation`, `/billing-upload` |\n| Customer web | `/customer/registration`, complaint pages |\n| Members (mobile) | Membership setup + Profile linked accounts |\n| Billing ops | `/t/dashboard` (billing upload dashboard) |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff_Web] --> Consumer[CustomerController]\n  Staff --> Link[AccountLinkController]\n  Staff --> Billing[BillingUploadController]\n  Staff --> BillApi[BillingApiController]\n  Mobile[Mobile_App] --> Membership[MembershipController]\n  Mobile --> Ledger[LedgerController]\n  Mobile --> Dash[DashboardController]\n  Link --> AccountLink[(account_links)]\n  Billing --> Uploads[(billing_uploads)]\n  Billing --> Raw[(t_account_raw)]\n  Membership --> AccountLink\n  Ledger --> Raw\n```\n\n## Process flowchart — link account\n\n```mermaid\nflowchart TD\n  Request[Member_or_staff_submits_link] --> Validate[Validate_account_number]\n  Validate -->|fail| Reject[Reject_or_pending]\n  Validate -->|ok| Store[Store_AccountLink]\n  Store --> MembershipOK[Membership_status_ready]\n  MembershipOK --> MobileTabs[Mobile_unlocks_main_tabs]\n```\n\n## Process flowchart — billing upload\n\n```mermaid\nflowchart TD\n  Upload[Staff_uploads_CSV] --> Parse[BillingUploadController_store]\n  Parse --> Persist[Persist_billing_rows]\n  Persist --> Available[Ledger_and_dashboard_read_data]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `CustomerController.php`, `AccountLinkController.php` |\n| | `BillingUploadController.php`, `BillingApiController.php` |\n| | `CustomerComplaintController.php` (legacy complaints) |\n| | API: `Api/V1/MembershipController.php`, `DashboardController.php`, `LedgerController.php` |\n| Models | `AccountLink.php`, `MemberProfile.php`, `TAccountRaw.php`, `BillingUpload.php`, `CustomerComplaint.php` |\n| Services | `MemberProfileService.php`; other domain logic in controllers + wallet/ledger services for pay |\n| Views | `pages/customer/*`, `pages/staff/accounts.blade.php`, complaint/validation blades |\n| AI | None |\n\n## Routes / API\n\n### Web\n\n| Path | Notes |\n|------|--------|\n| `/access/customers`, `/access/customers/{id}` | Portal members + personal information |\n| `/access/customers/{id}/membership-application` | Print / Save as PDF application form |\n| `/customer/registration`, `/customer/store` | Customer registration |\n| `/validation`, `/api/account/validation*` | Account validation |\n| `/billing-upload` | CSV upload UI |\n| `/fetch-billing` | Billing API fetch |\n| `/complaints/*`, `/complaint` | Legacy complaint UI |\n\n### API (`/api/v1`)\n\n| Path | Notes |\n|------|--------|\n| `/membership/status`, `/privacy`, `/account-links`, `/profile`, `/linked-accounts` | Mobile gate |\n| `/dashboard/summary` | Home balances |\n| `/ledger` | Billing history |\n\n## Permissions / feature flags\n\n- `customers.*`, `billing.view` in `config/access.php`\n\n## Scenarios\n\n### Scenario A — Staff validates and links an account\n\n- **Actor:** Staff with customer/billing access\n- **Steps:**\n  1. Review pending validation under `/validation` (or related account APIs).\n  2. Confirm account number against billing/consumer data.\n  3. Store/approve `AccountLink`.\n- **Expected result:** Membership status becomes ready for that member; mobile unlocks gated tabs.\n- **Where in code:** `AccountLinkController`, `MembershipController`; model `AccountLink`.\n\n### Scenario B — Billing CSV upload\n\n- **Actor:** Billing ops staff\n- **Steps:**\n  1. Open `/billing-upload` (and/or `/t/dashboard`).\n  2. Upload CSV; confirm parse/persist.\n  3. Spot-check mobile `/ledger` and `/dashboard/summary` for a linked account.\n- **Expected result:** Rows in billing upload / `t_account_raw`; read APIs reflect new data.\n- **Where in code:** `BillingUploadController`, `BillingApiController`; models `BillingUpload`, `TAccountRaw`.\n\n### Scenario C — Member completes membership on mobile\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. Submit account link / privacy, then personal information via membership APIs.\n  2. Poll `/membership/status`.\n  3. Once ready, Home uses `/dashboard/summary` and ledger history.\n- **Expected result:** Gate lifts only when links validate; pay/ledger use the same linked accounts.\n- **Where in code:** `MembershipController`, `DashboardController`, `LedgerController`.\n\n### Scenario D — Staff prints a membership application\n\n- **Actor:** Staff or support with `customers.view`\n- **Steps:**\n  1. Open **User Management → Customers** (`/access/customers`) or **Members → Customers** on the support menu.\n  2. Open the member detail.\n  3. Review **Membership application** (address, civil status, contact, seminar date).\n  4. Click **Print / Save as PDF** to open the official application form filled with the member’s data. Fill Membership O.R.#, date issued, and area manager on the print page if needed, then print.\n- **Expected result:** The paper form matches `docs/aselco_membership_application.html`, with member-submitted fields prefilled.\n- **Where in code:** `AccessUserWebController::membershipApplication`; view `pages/staff/access/membership-application.blade.php`.\n\n## Developer discussion\n\n- Does account validation still run before `AccountLink` becomes membership-ready?\n- CSV upload failure modes: partial writes, duplicate accounts, bad rows — how are they surfaced?\n- Permissions: `customers.*` / `billing.view` on new staff routes?\n- Cross-module: will AST pay-bill and dashboard summary still resolve the same account identifiers?\n- Do not treat legacy `/complaints/*` as the path for new request/complaint features (use Tickets).\n\n## Related modules\n\n- [Mobile Membership](../mobile/membership.md)\n- [Mobile Ledger](../mobile/ledger.md)\n- [AST Wallet](ast-wallet.md)\n- [Access / User Management](access-user-management.md)\n- [Dashboard](dashboard.md)\n","web/dashboard.md":"# Web — Dashboard\n\n## Purpose\n\nRole-based home after login. Staff land on general or billing dashboards; customers get a simpler home. Mobile Home uses `GET /api/v1/dashboard/summary` instead of Blade.\n\nDashboards orient users after auth: staff see operational entry points, billing ops get `/t/dashboard` tied to upload workflows, and customer web may use `/u/dashboard`. Mobile never renders these Blade pages — it consumes a JSON summary that aggregates wallet and linked-account billing signals for the Home tab.\n\nKeep role routing explicit in `web.php` / post-login redirects. The API summary should remain a read model over wallet + consumers/billing data, not a place to embed ticket queues or AI chat. Permission `dashboard.view` gates staff visibility where the access catalog applies.\n\n## Deeper explanation\n\n- **Key concepts:** Post-login role routing; staff Blade dashboards; billing upload dashboard (`BillingUploadController::dashboard`); mobile summary API.\n- **Invariants:** Mobile Home depends on `/api/v1/dashboard/summary`; web dashboards stay session-authenticated; summary should not mutate wallet or billing data.\n- **Common pitfalls:** Returning staff-only fields on the mobile summary; breaking `/t/dashboard` when refactoring billing upload; hard-coding role names in multiple places instead of one redirect strategy; assuming one Blade template serves all roles.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Authenticated users | `/dashboard` |\n| Billing staff | `/t/dashboard` (`BillingUploadController::dashboard`) |\n| Users (alt) | `/u/dashboard` |\n| Members (mobile) | Home tab via dashboard summary API |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff] --> DashWeb[\"/dashboard\"]\n  BillingStaff[Billing_Staff] --> TDash[\"/t/dashboard\"]\n  Mobile[Mobile_Home] --> DashApi[DashboardController]\n  DashApi --> Wallet[Wallet_summary]\n  DashApi --> Bills[Linked_account_balances]\n  TDash --> BillingUpload[BillingUploadController]\n```\n\n## Process flowchart\n\n```mermaid\nflowchart TD\n  Login[Successful_login] --> Role{Role_routing}\n  Role -->|billing_ops| TDash[t_dashboard]\n  Role -->|staff| StaffDash[staff_dashboard]\n  Role -->|customer_web| UDash[u_dashboard]\n  Role -->|mobile| Summary[GET_dashboard_summary]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | Closure routes in `web.php`; `BillingUploadController::dashboard` |\n| | `Api/V1/DashboardController.php` |\n| Views | `dashboard.blade.php`, `pages/staff/dashboard.blade.php`, `pages/staff/index.blade.php` |\n| Models / services | Pulls wallet + billing-linked data for API summary |\n| AI | None |\n\n## Routes / API\n\n| Path | Notes |\n|------|--------|\n| `GET /dashboard` | Default post-login |\n| `GET /t/dashboard` | Billing upload dashboard |\n| `GET /u/dashboard` | Alternate user dashboard |\n| `GET /api/v1/dashboard/summary` | Mobile Home |\n\n## Permissions / feature flags\n\n- `dashboard.view` in access catalog\n- Auth middleware group in `web.php`\n\n## Scenarios\n\n### Scenario A — Staff lands on general dashboard\n\n- **Actor:** Authenticated staff\n- **Steps:**\n  1. Log in via Fortify/Jetstream.\n  2. Redirect to `/dashboard` (or role-specific staff view).\n  3. Navigate to modules from menus.\n- **Expected result:** Correct Blade home for role; unauthorized modules hidden by access menus.\n- **Where in code:** `web.php` closures; `pages/staff/dashboard.blade.php` / `index.blade.php`.\n\n### Scenario B — Billing ops dashboard\n\n- **Actor:** Billing staff\n- **Steps:**\n  1. Open `/t/dashboard`.\n  2. Use billing upload related actions from that surface.\n- **Expected result:** BillingUpload dashboard loads; ties to consumers/billing upload flows.\n- **Where in code:** `BillingUploadController::dashboard`.\n\n### Scenario C — Mobile Home summary\n\n- **Actor:** Mobile member with membership\n- **Steps:**\n  1. Authenticate with Sanctum.\n  2. `GET /api/v1/dashboard/summary`.\n  3. Home renders wallet + linked account balances from payload.\n- **Expected result:** Read-only summary; empty/zero states when no links/wallet.\n- **Where in code:** `Api/V1/DashboardController.php`; wallet + billing-linked reads.\n\n## Developer discussion\n\n- Did post-login redirects for each role stay correct after your change?\n- Mobile summary: additive fields only, backward compatible with the Home tab?\n- Any mutation accidentally added to a dashboard GET?\n- Permission `dashboard.view` vs auth-only routes — consistent with menus?\n- Do not break: `/t/dashboard` billing ops path and `/api/v1/dashboard/summary` contract.\n\n## Related modules\n\n- [Consumers / Billing](consumers-billing.md)\n- [AST Wallet](ast-wallet.md)\n- [Mobile Home](../mobile/home-dashboard.md)\n- [Auth & Profile](auth-profile.md)\n","web/file-manager.md":"# Web — File Manager / Google Drive (ops legacy)\n\n## Purpose\n\nInternal file storage UI with folders, upload, rename, soft-delete, plus Google Drive helpers and chunked upload. Used for ops/content workflows; not part of the mobile customer app.\n\nFile Manager fills the gap between Blade CMS/content work and ad-hoc shared drives: staff upload and organize files in-app, or push large files through chunked upload into Google Drive when configured. It is an authenticated staff ops tool — members do not call these routes from Ionic.\n\nTicket attachments and knowledge documents use their own storage paths; do not assume File Manager is the universal binary store. Drive features depend on Google credentials in env; without them, local file-manager routes may still work while `/google-drive*` / `/drive/*` fail.\n\n## Deeper explanation\n\n- **Key concepts:** Local `file_manager` metadata; folder tree; soft-delete; Google Drive activate/UI; chunked upload for large payloads.\n- **Invariants:** Staff session required; mobile `/api/v1` is out of scope; ticket attachments remain on the tickets module path; Drive ops go through `GoogleDriveController` / `ChunkUploadController`.\n- **Common pitfalls:** Treating soft-delete as hard purge; mixing Drive file IDs with local `FileManager` rows; exposing list/upload APIs without auth; using File Manager for member PII that should live in ticket-secure storage.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Staff | `/file-manager/*`, `/google-drive`, `/drive/*` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff] --> FM[FileManagerController]\n  Staff --> Drive[GoogleDriveController]\n  Staff --> Chunk[ChunkUploadController]\n  FM --> Files[(file_manager)]\n  Drive --> GDrive[Google_Drive_API]\n  Chunk --> Drive\n```\n\n## Process flowchart — upload\n\n```mermaid\nflowchart TD\n  Open[Open_file_manager] --> Upload[POST_upload_or_chunk]\n  Upload --> Store[Store_file_metadata]\n  Store --> List[Refresh_file_list]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `FileManagerController.php`, `ChunkUploadController.php`, `GoogleDriveController.php` |\n| Model | `FileManager.php` |\n| Views | `modules/file-manager/`, `pages/filemanager/` |\n| Services / AI | None dedicated |\n\n## Routes\n\n| Path | Notes |\n|------|--------|\n| `/file-manager/*` | List, upload, folder, rename, destroy, API files |\n| `/file-manager/v2/list` | Demo list |\n| `/google-drive`, `/google-drive-actived` | Drive UI / activate |\n| `/drive/folder/create`, `/drive/file/upload`, `/drive/storage` | Drive ops |\n| `/drive/file/upload-chunk` | Chunked upload |\n\n## Permissions / feature flags\n\nAuthenticated staff session; Google Drive credentials via env.\n\n## Scenarios\n\n### Scenario A — Local upload and organize\n\n- **Actor:** Authenticated staff\n- **Steps:**\n  1. Open file manager UI under `/file-manager/*`.\n  2. Upload a file; optionally create folder / rename.\n  3. Soft-delete if needed; confirm list refresh.\n- **Expected result:** `FileManager` metadata stored; file list updates; soft-delete hides without necessarily purging storage immediately as implemented.\n- **Where in code:** `FileManagerController`; views `modules/file-manager/`, `pages/filemanager/`.\n\n### Scenario B — Chunked Google Drive upload\n\n- **Actor:** Staff with Drive configured\n- **Steps:**\n  1. Activate/open `/google-drive` as required.\n  2. Upload via `/drive/file/upload-chunk` (and related `/drive/*` ops).\n  3. Confirm Drive storage/folder create paths succeed.\n- **Expected result:** Chunks assemble remotely; failures surface when credentials/env missing.\n- **Where in code:** `ChunkUploadController`, `GoogleDriveController`.\n\n### Scenario C — Not for tickets or mobile\n\n- **Actor:** Developer integrating attachments\n- **Steps:**\n  1. Check tickets attachment flow vs file-manager routes.\n  2. Confirm no mobile API client points at `/file-manager/*`.\n- **Expected result:** Ticket binaries stay on ticket storage; mobile unaffected.\n- **Where in code:** Tickets module attachment controllers; absence of file-manager in mobile API clients.\n\n## Developer discussion\n\n- Auth on every list/upload/destroy route — any new public leak?\n- Soft-delete vs hard delete and storage cleanup jobs?\n- Drive credentials: fail closed with clear errors when env missing?\n- MIME/size validation and path traversal on rename/folder APIs?\n- Do not route ticket or member document uploads through this legacy manager without a security review.\n\n## Related modules\n\n- [CMS / Blog](cms-blog.md)\n- [Tickets](tickets.md) — ticket attachments use separate storage path\n","web/knowledge-rag.md":"# Web — Knowledge Base / RAG\n\n## Purpose\n\nStaff manage approved knowledge documents and categories, chunk/embed them, and retrieve them so AI answers stay grounded in ASELCO policy and how-to content. Includes a staff test/chat UI to validate retrieval before customers see answers in the mobile assistant.\n\nWithout this module, the assistant would answer from model priors only. Knowledge/RAG is the editorial control plane: who can publish, what is active, how documents are reindexed, and how retrieval is tested. It is staff-web and admin-API facing; members never manage documents — they only consume grounded answers through AI.\n\nFit in the stack: Blade under `/knowledge/*` (middleware `can.manage-tickets`) and `/api/v1/admin/knowledge` feed `KnowledgeBaseService` / `DocumentProcessor`. At query time, `AiAssistantService` calls `KnowledgeRetriever` → `GroundedResponder`. Config lives in `config/rag.php`; seed content under `database/seeders/knowledge-base/**`.\n\n## Deeper explanation\n\n- **Key concepts:** Documents and versions; categories; chunks with embeddings; active/publish toggles; retrieval logs for debugging; test/chat UIs as pre-prod validation, not a second product channel.\n- **Invariants:** Inactive documents should not ground customer answers; reindex rebuilds chunks/embeddings rather than leaving stale vectors; retrieval logging (`KnowledgeRetrievalLog`) should remain available for “why did it say that?” investigations; mobile has no separate knowledge CRUD API.\n- **Common pitfalls:** Editing text in DB without reindex; pointing AI at unapproved drafts; changing chunk/embed settings in `config/rag.php` without reprocessing existing docs; treating `/knowledge/chat` as a replacement for production customer AI authZ.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Knowledge / ticket admins | `/knowledge`, `/knowledge/documents` |\n| Editors | Create/edit/toggle/reindex documents |\n| Testers | `/knowledge/test`, `/knowledge/chat` |\n| AI runtime | Called from `AiAssistantService` / grounded responder (no separate mobile UI) |\n\nMiddleware: `can.manage-tickets` on `/knowledge/*`.\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff_Web] --> KnowWeb[KnowledgeAdminWebController]\n  AdminApi[Admin_API] --> KnowApi[AdminKnowledgeController]\n  KnowWeb --> KbSvc[KnowledgeBaseService]\n  KnowApi --> KbSvc\n  KbSvc --> DocProc[DocumentProcessor]\n  DocProc --> Embed[EmbeddingEncoder]\n  Embed --> Chunks[(knowledge_chunks)]\n  AiChat[AiAssistantService] --> Retriever[KnowledgeRetriever]\n  Retriever --> Chunks\n  Retriever --> Grounded[GroundedResponder]\n```\n\n## Process flowchart — publish & retrieve\n\n```mermaid\nflowchart TD\n  Upload[Create_or_update_document] --> Process[DocumentProcessor_chunk]\n  Process --> Embed[Embed_chunks]\n  Embed --> Index[Store_knowledge_chunks]\n  Index --> Ready[Document_active]\n  Query[User_or_AI_query] --> QP[QueryProcessor]\n  QP --> Retrieve[KnowledgeRetriever]\n  Retrieve --> Answer[GroundedResponder]\n  Answer --> Log[KnowledgeRetrievalLog]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `aselcoph/app/Http/Controllers/KnowledgeAdminWebController.php` |\n| | `aselcoph/app/Http/Controllers/Api/Admin/AdminKnowledgeController.php` |\n| Models | `KnowledgeDocument.php`, `KnowledgeDocumentVersion.php`, `KnowledgeChunk.php` |\n| | `KnowledgeCategory.php`, `KnowledgeRetrievalLog.php` |\n| Services (`Services/Rag/`) | `KnowledgeBaseService.php`, `KnowledgeRetriever.php` |\n| | `DocumentProcessor.php`, `EmbeddingEncoder.php` |\n| | `GroundedResponder.php`, `QueryProcessor.php`, `RetrievalHit.php` |\n| AI consumer | `Services/Ai/AiAssistantService.php` |\n| Views | `aselcoph/resources/views/pages/staff/knowledge/*` |\n| Config | `aselcoph/config/rag.php` |\n| Seed content | `aselcoph/database/seeders/knowledge-base/**` |\n\n## Routes / API\n\n### Web (`knowledge.*`)\n\n| Path | Action |\n|------|--------|\n| `GET /knowledge` | Dashboard |\n| `GET/POST /knowledge/documents` | List / create |\n| `GET/PUT /knowledge/documents/{id}` | Show / update |\n| `POST .../toggle`, `.../reindex` | Activate / re-embed |\n| `GET/POST /knowledge/categories` | Categories |\n| `GET\\|POST /knowledge/test`, `/knowledge/chat` | Retrieval testing |\n\n### API (`/api/v1/admin/knowledge`)\n\n| Method | Path |\n|--------|------|\n| GET/POST | `/` |\n| GET/PUT/POST/DELETE | `/{id}` |\n| POST | `/{id}/index` |\n| GET | `/categories` |\n| POST | `/search` |\n\n## Permissions / feature flags\n\n| Key | Notes |\n|-----|--------|\n| `knowledge.view/create/edit/delete/publish/index` | `config/access.php` |\n| `ai.knowledge.manage` | AI-side knowledge management |\n| RAG settings | `config/rag.php` (chunk size, embedding provider, etc.) |\n\n## Scenarios\n\n### Scenario A — Publish a new knowledge document\n\n- **Actor:** Knowledge editor with create/publish rights\n- **Steps:**\n  1. Create document under `/knowledge/documents`.\n  2. Assign category; save content.\n  3. Index/reindex and toggle active/publish as required.\n- **Expected result:** Chunks embedded and stored; document eligible for retrieval when active.\n- **Where in code:** `KnowledgeAdminWebController` → `KnowledgeBaseService` / `DocumentProcessor` / `EmbeddingEncoder`.\n\n### Scenario B — Staff validates retrieval before go-live\n\n- **Actor:** Tester / knowledge admin\n- **Steps:**\n  1. Open `/knowledge/test` or `/knowledge/chat`.\n  2. Run representative member questions.\n  3. Inspect hits / logs; adjust document or reindex if weak.\n- **Expected result:** Grounded answers or clear empty-hit behavior; logs in `KnowledgeRetrievalLog` for debugging.\n- **Where in code:** Knowledge admin views; `QueryProcessor`, `KnowledgeRetriever`, `GroundedResponder`.\n\n### Scenario C — Customer AI uses indexed knowledge\n\n- **Actor:** Mobile member (indirect)\n- **Steps:**\n  1. Member chats via customer AI API.\n  2. `AiAssistantService` retrieves chunks for the query.\n  3. Completion uses grounded context when hits exist.\n- **Expected result:** Answer reflects approved docs; inactive docs not used.\n- **Where in code:** `AiAssistantService` → `KnowledgeRetriever` → chunks table.\n\n## Developer discussion\n\n- After content edits, is reindex (`.../reindex` or API `/{id}/index`) required and documented in the PR?\n- Do permission codes (`knowledge.*` vs `ai.knowledge.manage`) match the routes you added?\n- How do inactive/unpublished documents behave in `KnowledgeRetriever` — regression test?\n- Changing `config/rag.php` chunk/embed settings: migration plan for existing `knowledge_chunks`?\n- Security: admin knowledge APIs must not be callable with only a member Sanctum token.\n\n## Related modules\n\n- [AI Assistant](ai-assistant.md)\n- [Tickets](tickets.md)\n- [Mobile AI Assistant](../mobile/ai-assistant.md) — consumes grounded answers\n","web/README.md":"# Web modules (Laravel staff portal)\n\nStaff UI lives in `aselcoph/` (Blade). Customer mobile consumes the same backend via `/api/v1`.\n\n## Active modules\n\n| Module | Doc | Primary routes |\n|--------|-----|----------------|\n| AST Wallet | [ast-wallet.md](ast-wallet.md) | `/ast/admin/*`, `/ast/wallet`, `/ast/cis-queue` |\n| Tickets | [tickets.md](tickets.md) | `/tickets/*` |\n| AI Assistant + Ticket AI | [ai-assistant.md](ai-assistant.md) | `/tickets/ai`, ticket AI actions |\n| Knowledge / RAG | [knowledge-rag.md](knowledge-rag.md) | `/knowledge/*` |\n| Support Chat | [support-chat.md](support-chat.md) | `/chats/support/*` |\n| Access / User Management | [access-user-management.md](access-user-management.md) | `/access/*` |\n| Support Workspace | [support-workspace.md](support-workspace.md) | `/workspace/*` |\n| Announcements | [announcements.md](announcements.md) | `/announcements/*` |\n| Consumers / Billing | [consumers-billing.md](consumers-billing.md) | `/consumer/*`, `/validation`, `/billing-upload` |\n| Calendar | [calendar.md](calendar.md) | `/calendar` |\n| Auth & Profile | [auth-profile.md](auth-profile.md) | Jetstream + `/auth/google` |\n| Dashboard | [dashboard.md](dashboard.md) | `/dashboard`, `/u/dashboard`, `/t/dashboard` |\n\n## Legacy / ops (still routed)\n\n| Module | Doc | Notes |\n|--------|-----|-------|\n| CMS / Blog / Pages | [cms-blog.md](cms-blog.md) | Content Manager menu |\n| File Manager / Drive | [file-manager.md](file-manager.md) | Internal ops |\n| Satisfaction Survey | [survey.md](survey.md) | Survey link update |\n\n## Activation cheat sheet\n\n- Permissions: `aselcoph/config/access.php`\n- Ticket / knowledge / AI admin: middleware `can.manage-tickets`\n- AST load writes: middleware `can.load-wallet` (API) + controller checks (web)\n- Menus: `aselcoph/resources/views/components/menu/`\n","web/support-chat.md":"# Web — Support Chat\n\n## Purpose\n\nHuman customer↔staff support chat shared by staff Blade UI and the mobile app. One conversation model is served through `SupportChatService` and `SupportChatApiController`. A legacy staff chat monitor (`ConversationController`, older `Supp*` models) still exists for internal/monitoring paths.\n\nThis is separate from the [AI Assistant](ai-assistant.md) channel.\n\nSupport chat exists so members can reach a live agent without mixing AI transcripts into the same thread model. Staff work from `/chats` / `/chats/support`; members use mobile `/support/chat`. Realtime delivery depends on Pusher/broadcasting auth; persistence still goes through `SupportChatService` into conversation/message tables.\n\nPrefer the modern Chats models (`Models/Chats/Conversation`, `Message`, …) and `SupportChatService` for new features. Treat `Supp*` controllers/models and `/chats/monitor` as legacy/monitor surfaces — do not fork business rules into both stacks without an explicit migration plan.\n\n## Deeper explanation\n\n- **Key concepts:** Ensure-conversation (open or reuse thread); inbox + unread totals for staff badges; message send/read receipts; attachments/pins/reactions on the modern models; Pusher for fan-out after persist.\n- **Invariants:** One logical customer support thread per ensure rules (reuse, don’t spam new conversations); staff API under `/support/chat/*` gated with `can.manage-tickets`; member paths under `/customer/support-chat/*`; AI assistant remains a parallel channel.\n- **Common pitfalls:** Broadcasting before persist; reading legacy `Supp*` tables from new mobile clients; forgetting `{origin}/broadcasting/auth`; conflating `chat.view` menu access with ticket-manage API middleware.\n\n## Users / entry points\n\n| Who | Where |\n|-----|--------|\n| Support staff | `/chats`, `/chats/support`, inbox + unread totals |\n| Monitors | `/chats/monitor` |\n| Members | Mobile `/support/chat` |\n| Permission | `chat.view` |\n\n## Context diagram\n\n```mermaid\nflowchart LR\n  Staff[Staff_Web] --> SupportWeb[SupportChatController]\n  Mobile[Mobile_App] --> SupportApi[SupportChatApiController]\n  SupportWeb --> ChatSvc[SupportChatService]\n  SupportApi --> ChatSvc\n  ChatSvc --> Conv[(conversations)]\n  ChatSvc --> Msg[(messages)]\n  Mobile --> Pusher[Pusher_realtime]\n  Staff --> Pusher\n  Legacy[ConversationController] --> LegacyModels[Chats_legacy_monitor]\n```\n\n## Process flowchart — customer message\n\n```mermaid\nflowchart TD\n  Ensure[POST_ensure_conversation] --> Open[Open_or_reuse_thread]\n  Open --> Send[POST_message]\n  Send --> Persist[Save_message]\n  Persist --> Broadcast[Broadcast_via_Pusher]\n  Broadcast --> StaffRead[Staff_inbox_updates]\n  StaffRead --> Reply[Staff_replies]\n  Reply --> MarkRead[POST_read]\n```\n\n## File map (MVC + Services + AI)\n\n| Layer | Path |\n|-------|------|\n| Controllers | `aselcoph/app/Http/Controllers/Chats/SupportChatController.php` |\n| | `aselcoph/app/Http/Controllers/Chats/ConversationController.php` |\n| | `aselcoph/app/Http/Controllers/Chats/MessagesController.php` |\n| | `aselcoph/app/Http/Controllers/Api/V1/SupportChatApiController.php` |\n| Legacy | `SuppChatController.php`, `SuppMessageController.php` |\n| Models | `Models/Chats/Conversation.php`, `Message.php`, `Attachment.php` |\n| | `ConversationParticipant.php`, `MessagePin.php`, `MessageReaction.php` |\n| | Legacy: `SuppConversation.php`, `SuppMessage.php`, `SuppParticipant.php`, `SuppAttachment.php` |\n| Services | `aselcoph/app/Services/SupportChatService.php` |\n| Views | `aselcoph/resources/views/modules/chats/support.blade.php` |\n| | `aselcoph/resources/views/modules/chats/*`, `supp_chat/*` |\n| AI | None (human channel only) |\n\n## Routes / API\n\n### Web\n\n| Path | Notes |\n|------|--------|\n| `GET /chats`, `/chats/support` | Staff UI |\n| `POST /chats/support/ensure` | Ensure thread |\n| `GET /chats/support/inbox` | Inbox |\n| `GET\\|POST /chats/support/{conversation}/messages` | Messages |\n| `POST /chats/support/{conversation}/read` | Mark read |\n| `GET /chats/support/unread-total` | Badge |\n| `GET /chats/monitor` | Legacy monitor |\n\n### API (`/api/v1`)\n\n| Path | Role |\n|------|------|\n| `/customer/support-chat/*` | Mobile member |\n| `/support/chat/*` | Staff (`can.manage-tickets`) |\n| `{origin}/broadcasting/auth` | Pusher auth |\n\n## Permissions / feature flags\n\n| Key | Notes |\n|-----|--------|\n| `chat.view` | Access support chat |\n| `can.manage-tickets` | Staff support chat API |\n| Pusher / broadcasting | App broadcasting config + mobile `realtime/supportPusher.ts` |\n\n## Scenarios\n\n### Scenario A — Member starts or resumes chat\n\n- **Actor:** Mobile member\n- **Steps:**\n  1. App calls ensure-conversation on `/customer/support-chat/*`.\n  2. Member sends a message.\n  3. Message persists and broadcasts; staff inbox unread updates.\n- **Expected result:** Existing open thread reused when ensure rules say so; staff sees the message without refresh if Pusher is healthy.\n- **Where in code:** `SupportChatApiController` → `SupportChatService`; mobile realtime `supportPusher.ts`.\n\n### Scenario B — Staff
